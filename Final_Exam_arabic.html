0631\u0647 3 \u0623\u0633\u0627\u0628\u064a\u0639 \u064a\u0639\u0627\u0646\u064a \u0645\u0646 \u0642\u064a\u0621 \u0646\u0627\u0641\u0648\u0631\u064a (Projectile Vomiting) \u0645\u0646\u0637\u0644\u0642 \u0628\u0642\u0648\u0629 \u0628\u0639\u062f \u0643\u0644 \u0631\u0636\u0639\u0629\u060c \u0648\u064a\u0628\u062f\u0648 \u062c\u0627\u0626\u0639\u0627\u064b \u062f\u0627\u0626\u0645\u0627\u064b\u060c \u0627\u0644\u0625\u062c\u0631\u0627\u0621\u061f", ["\u062a\u063a\u064a\u064a\u0631 \u0627\u0644\u062d\u0644\u064a\u0628 \u0625\u0644\u0649 \u0646\u0648\u0639 \u062e\u0627\u0644\u064a \u0645\u0646 \u0627\u0644\u0644\u0627\u0643\u062a\u0648\u0632", "\u0625\u062d\u0627\u0644\u0629 \u0641\u0648\u0631\u064a\u0629 \u0644\u0644\u062a\u062f\u062e\u0644 \u0627\u0644\u062c\u0631\u0627\u062d\u064a \u0644\u0644\u0627\u0634\u062a\u0628\u0627\u0647 \u0641\u064a '\u062a\u0636\u064a\u0642 \u0627\u0644\u0628\u0648\u0627\u0628' (Pyloric Stenosis)", "\u0625\u0639\u0637\u0627\u0624\u0647 \u0623\u0639\u0634\u0627\u0628 \u062f\u0627\u0641\u0626\u0629", "\u0635\u0631\u0641 \u062f\u0648\u0627\u0621 \u0644\u0644\u0642\u064a\u0621"], "\u0625\u062d\u0627\u0644\u0629 \u0641\u0648\u0631\u064a\u0629 \u0644\u0644\u062a\u062f\u062e\u0644 \u0627\u0644\u062c\u0631\u0627\u062d\u064a \u0644\u0644\u0627\u0634\u062a\u0628\u0627\u0647 \u0641\u064a '\u062a\u0636\u064a\u0642 \u0627\u0644\u0628\u0648\u0627\u0628' (Pyloric Stenosis)", "\u0637\u0627\u0631\u0626 \u062c\u0631\u0627\u062d\u064a \u0628\u0633\u0628\u0628 \u062a\u0636\u062e\u0645 \u0627\u0644\u0639\u0636\u0644\u0629 \u0641\u064a \u0645\u062e\u0631\u062c \u0627\u0644\u0645\u0639\u062f\u0629."], ["\u0627\u0644\u0645\u0628\u062f\u0623 \u0627\u0644\u0623\u0633\u0627\u0633\u064a \u0648\u0627\u0644\u0623\u0647\u0645 \u0641\u064a \u0627\u0644\u062a\u0639\u0627\u0645\u0644 \u0645\u0639 \u0627\u0644\u0642\u064a\u0621 \u0627\u0644\u0645\u062a\u0643\u0631\u0631 \u0639\u0646\u062f \u0627\u0644\u0623\u0637\u0641\u0627\u0644 \u0641\u064a \u0627\u0644\u0645\u0646\u0632\u0644 \u0647\u0648\u061f", ["\u0625\u064a\u0642\u0627\u0641 \u0627\u0644\u0642\u064a\u0621 \u0628\u0627\u0644\u0623\u062f\u0648\u064a\u0629", "\u0645\u0646\u0639 \u0627\u0644\u062c\u0641\u0627\u0641 \u0628\u062a\u0639\u0648\u064a\u0636 \u0627\u0644\u0633\u0648\u0627\u0626\u0644 \u0628\u0645\u062d\u0644\u0648\u0644 \u0627\u0644\u0625\u0645\u0647\u0627\u0621 (ORS) \u0628\u062c\u0631\u0639\u0627\u062a \u0635\u063a\u064a\u0631\u0629 \u0648\u0645\u062a\u0643\u0631\u0631\u0629 (\u0631\u0634\u0641\u0627\u062a)", "\u0625\u0639\u0637\u0627\u0621 \u0645\u0636\u0627\u062f \u062d\u064a\u0648\u064a", "\u0625\u062c\u0628\u0627\u0631 \u0627\u0644\u0637\u0641\u0644 \u0639\u0644\u0649 \u0627\u0644\u0623\u0643\u0644 \u0627\u0644\u0635\u0644\u0628"], "\u0645\u0646\u0639 \u0627\u0644\u062c\u0641\u0627\u0641 \u0628\u062a\u0639\u0648\u064a\u0636 \u0627\u0644\u0633\u0648\u0627\u0626\u0644 \u0628\u0645\u062d\u0644\u0648\u0644 \u0627\u0644\u0625\u0645\u0647\u0627\u0621 (ORS) \u0628\u062c\u0631\u0639\u0627\u062a \u0635\u063a\u064a\u0631\u0629 \u0648\u0645\u062a\u0643\u0631\u0631\u0629 (\u0631\u0634\u0641\u0627\u062a)", "\u0627\u0644\u0645\u0639\u062f\u0629 \u0627\u0644\u0645\u062a\u0647\u064a\u062c\u0629 \u0633\u062a\u0631\u0641\u0636 \u0627\u0644\u0643\u0645\u064a\u0627\u062a \u0627\u0644\u0643\u0628\u064a\u0631\u0629 \u0648\u062a\u062a\u0642\u064a\u0623\u0647\u0627 \u0641\u0648\u0631\u0627\u064b."], ["\u0625\u0630\u0627 \u0643\u0627\u0646 \u0627\u0644\u0637\u0641\u0644 \u0627\u0644\u0645\u0635\u0627\u0628 \u0628\u0627\u0644\u0642\u064a\u0621 \u0627\u0644\u0645\u062a\u0643\u0631\u0631 \u0644\u0627 \u064a\u0633\u062a\u0637\u064a\u0639 \u062d\u062a\u0649 \u0627\u0644\u0627\u062d\u062a\u0641\u0627\u0638 \u0628\u0631\u0634\u0641\u0627\u062a \u0645\u062d\u0644\u0648\u0644 \u0627\u0644\u062c\u0641\u0627\u0641 \u0648\u064a\u062a\u0642\u064a\u0623\u0647\u0627 \u0641\u0648\u0631\u0627\u064b\u060c \u0627\u0644\u0625\u062c\u0631\u0627\u0621\u061f", ["\u062a\u0631\u0643\u0647 \u062d\u062a\u0649 \u064a\u0631\u062a\u0627\u062d", "\u0625\u062d\u0627\u0644\u0629 \u0641\u0648\u0631\u064a\u0629 \u0648\u0639\u0627\u062c\u0644\u0629 \u0644\u0644\u0645\u0633\u062a\u0634\u0641\u0649 \u0644\u0644\u062d\u0635\u0648\u0644 \u0639\u0644\u0649 \u0633\u0648\u0627\u0626\u0644 \u0648\u0631\u064a\u062f\u064a\u0629 (IV Fluids) \u0644\u062a\u062c\u0646\u0628 \u0627\u0644\u062c\u0641\u0627\u0641 \u0627\u0644\u0642\u0627\u062a\u0644", "\u0625\u0639\u0637\u0627\u0624\u0647 \u062f\u0648\u0627\u0621 \u0642\u0648\u064a \u0644\u0644\u0642\u064a\u0621", "\u062f\u0647\u0646 \u0628\u0637\u0646\u0647 \u0628\u0627\u0644\u0632\u064a\u062a"], "\u0625\u062d\u0627\u0644\u0629 \u0641\u0648\u0631\u064a\u0629 \u0648\u0639\u0627\u062c\u0644\u0629 \u0644\u0644\u0645\u0633\u062a\u0634\u0641\u0649 \u0644\u0644\u062d\u0635\u0648\u0644 \u0639\u0644\u0649 \u0633\u0648\u0627\u0626\u0644 \u0648\u0631\u064a\u062f\u064a\u0629 (IV Fluids) \u0644\u062a\u062c\u0646\u0628 \u0627\u0644\u062c\u0641\u0627\u0641 \u0627\u0644\u0642\u0627\u062a\u0644", "\u0627\u0644\u062c\u0641\u0627\u0641 \u064a\u062a\u0637\u0648\u0631 \u0628\u0633\u0631\u0639\u0629 \u0645\u062e\u064a\u0641\u0629 \u0639\u0646\u062f \u0627\u0644\u0631\u0636\u0639."], ["\u0623\u062f\u0648\u064a\u0629 \u0645\u062c\u0645\u0648\u0639\u0629 (Setrons) \u0645\u062b\u0644 \u0627\u0644\u0623\u0648\u0646\u062f\u0627\u0646\u0633\u064a\u062a\u0631\u0648\u0646 (Ondansetron) \u0647\u064a \u0623\u062f\u0648\u064a\u0629 \u0642\u0648\u064a\u0629 \u0644\u0644\u0642\u064a\u0621\u060c \u0645\u0627 \u0647\u064a \u0622\u0644\u064a\u062a\u0647\u0627 \u0627\u0644\u0623\u0633\u0627\u0633\u064a\u0629\u061f", ["\u062a\u062b\u0628\u064a\u0637 \u0645\u0633\u062a\u0642\u0628\u0644\u0627\u062a \u0627\u0644\u0647\u064a\u0633\u062a\u0627\u0645\u064a\u0646 (H1)", "\u062a\u062b\u0628\u064a\u0637 \u0645\u0633\u062a\u0642\u0628\u0644\u0627\u062a \u0627\u0644\u0633\u064a\u0631\u0648\u062a\u0648\u0646\u064a\u0646 (5-HT3) \u0641\u064a \u0645\u0631\u0643\u0632 \u0627\u0644\u0642\u064a\u0621 \u0641\u064a \u0627\u0644\u062f\u0645\u0627\u063a (CTZ)", "\u062a\u0646\u0634\u064a\u0637 \u0627\u0644\u062f\u0648\u0628\u0627\u0645\u064a\u0646", "\u0625\u0628\u0637\u0627\u0621 \u0627\u0644\u0623\u0645\u0639\u0627\u0621"], "\u062a\u062b\u0628\u064a\u0637 \u0645\u0633\u062a\u0642\u0628\u0644\u0627\u062a \u0627\u0644\u0633\u064a\u0631\u0648\u062a\u0648\u0646\u064a\u0646 (5-HT3) \u0641\u064a \u0645\u0631\u0643\u0632 \u0627\u0644\u0642\u064a\u0621 \u0641\u064a \u0627\u0644\u062f\u0645\u0627\u063a (CTZ)", "\u0648\u0647\u064a \u0645\u062e\u0635\u0635\u0629 \u0644\u0644\u0642\u064a\u0621 \u0627\u0644\u0634\u062f\u064a\u062f \u0645\u062b\u0644 \u0627\u0644\u0645\u0635\u0627\u062d\u0628 \u0644\u0644\u0639\u0644\u0627\u062c \u0627\u0644\u0643\u064a\u0645\u0627\u0648\u064a."], ["\u0647\u0644 \u064a\u064f\u0646\u0635\u062d \u0627\u0644\u0635\u064a\u062f\u0644\u064a \u0628\u0635\u0631\u0641 \u062f\u0648\u0627\u0621 '\u0628\u0631\u0648\u0643\u0644\u0648\u0631\u0628\u064a\u0631\u0627\u0632\u064a\u0646' \u0623\u0648 '\u062f\u0648\u0645\u0628\u064a\u0631\u064a\u062f\u0648\u0646' \u0644\u0639\u0644\u0627\u062c \u063a\u062b\u064a\u0627\u0646 \u0628\u0633\u064a\u0637 \u063a\u064a\u0631 \u0645\u0628\u0631\u0631 \u0628\u0640 OTC\u061f", ["\u0646\u0639\u0645 \u062f\u0627\u0626\u0645\u0627\u064b", "\u0644\u0627\u060c \u064a\u064f\u062d\u0638\u0631 \u0635\u0631\u0641\u0647\u0627 \u0639\u0634\u0648\u0627\u0626\u064a\u0627\u064b \u0628\u0633\u0628\u0628 \u0642\u064a\u0648\u062f \u0627\u0644\u0623\u0645\u0627\u0646 (\u062a\u0637\u064a\u0644 \u0641\u062a\u0631\u0629 QT \u0641\u064a \u0627\u0644\u0642\u0644\u0628) \u0648\u062a\u064f\u0635\u0631\u0641 \u0641\u0642\u0637 \u0644\u062f\u0648\u0627\u0639\u064a \u0637\u0628\u064a\u0629 \u0645\u062d\u062f\u062f\u0629 \u0643\u063a\u062b\u064a\u0627\u0646 \u0627\u0644\u0635\u062f\u0627\u0639 \u0627\u0644\u0646\u0635\u0641\u064a \u0627\u0644\u0645\u0634\u062e\u0635", "\u0646\u0639\u0645\u060c \u0647\u064a \u0622\u0645\u0646\u0629 100%", "\u0646\u0639\u0645\u060c \u0644\u0644\u0628\u0627\u0644\u063a\u064a\u0646 \u0641\u0642\u0637"], "\u0644\u0627\u060c \u064a\u064f\u062d\u0638\u0631 \u0635\u0631\u0641\u0647\u0627 \u0639\u0634\u0648\u0627\u0626\u064a\u0627\u064b \u0628\u0633\u0628\u0628 \u0642\u064a\u0648\u062f \u0627\u0644\u0623\u0645\u0627\u0646 (\u062a\u0637\u064a\u0644 \u0641\u062a\u0631\u0629 QT \u0641\u064a \u0627\u0644\u0642\u0644\u0628) \u0648\u062a\u064f\u0635\u0631\u0641 \u0641\u0642\u0637 \u0644\u062f\u0648\u0627\u0639\u064a \u0637\u0628\u064a\u0629 \u0645\u062d\u062f\u062f\u0629 \u0643\u063a\u062b\u064a\u0627\u0646 \u0627\u0644\u0635\u062f\u0627\u0639 \u0627\u0644\u0646\u0635\u0641\u064a \u0627\u0644\u0645\u0634\u062e\u0635", "\u0642\u064a\u0648\u062f \u0627\u0644\u0633\u0644\u0627\u0645\u0629 \u0644\u0644\u0642\u0644\u0628 \u0635\u0627\u0631\u0645\u0629 \u062d\u0648\u0644\u0647\u0627."], ["\u0645\u0631\u064a\u0636 \u064a\u062a\u0646\u0627\u0648\u0644 \u062f\u0648\u0627\u0621 \u0627\u0643\u062a\u0626\u0627\u0628 \u0645\u0646 \u0641\u0626\u0629 (SSRI) \u0648\u0627\u0634\u062a\u0643\u0649 \u0645\u0646 \u0638\u0647\u0648\u0631 \u063a\u062b\u064a\u0627\u0646 \u0648\u0623\u0631\u0642 \u0641\u064a \u0627\u0644\u0623\u0633\u0627\u0628\u064a\u0639 \u0627\u0644\u0623\u0648\u0644\u0649\u060c \u0645\u0627 \u0647\u0648 \u0627\u0644\u062a\u0641\u0633\u064a\u0631 \u0627\u0644\u0639\u0644\u0645\u064a\u061f", ["\u0627\u0644\u062f\u0648\u0627\u0621 \u0645\u0646\u062a\u0647\u064a \u0627\u0644\u0635\u0644\u0627\u062d\u064a\u0629", "\u0632\u064a\u0627\u062f\u0629 \u0645\u0633\u062a\u0648\u064a\u0627\u062a \u0627\u0644\u0633\u064a\u0631\u0648\u062a\u0648\u0646\u064a\u0646 \u0627\u0644\u062a\u064a \u064a\u062d\u062f\u062b\u0647\u0627 \u0627\u0644\u062f\u0648\u0627\u0621 \u062a\u0624\u062b\u0631 \u0639\u0644\u0649 \u0645\u0633\u062a\u0642\u0628\u0644\u0627\u062a \u0627\u0644\u0633\u064a\u0631\u0648\u062a\u0648\u0646\u064a\u0646 (5-HT) \u0627\u0644\u0645\u0648\u062c\u0648\u062f\u0629 \u0628\u0643\u062b\u0631\u0629 \u0641\u064a \u0627\u0644\u062c\u0647\u0627\u0632 \u0627\u0644\u0647\u0636\u0645\u064a \u0648\u0627\u0644\u062f\u0645\u0627\u063a", "\u0627\u0644\u0645\u0631\u064a\u0636 \u064a\u0639\u0627\u0646\u064a \u0645\u0646 \u0641\u0634\u0644 \u0643\u0644\u0648\u064a", "\u0647\u0630\u0647 \u062d\u0633\u0627\u0633\u064a\u0629 \u0645\u0641\u0631\u0637\u0629"], "\u0632\u064a\u0627\u062f\u0629 \u0645\u0633\u062a\u0648\u064a\u0627\u062a \u0627\u0644\u0633\u064a\u0631\u0648\u062a\u0648\u0646\u064a\u0646 \u0627\u0644\u062a\u064a \u064a\u062d\u062f\u062b\u0647\u0627 \u0627\u0644\u062f\u0648\u0627\u0621 \u062a\u0624\u062b\u0631 \u0639\u0644\u0649 \u0645\u0633\u062a\u0642\u0628\u0644\u0627\u062a \u0627\u0644\u0633\u064a\u0631\u0648\u062a\u0648\u0646\u064a\u0646 (5-HT) \u0627\u0644\u0645\u0648\u062c\u0648\u062f\u0629 \u0628\u0643\u062b\u0631\u0629 \u0641\u064a \u0627\u0644\u062c\u0647\u0627\u0632 \u0627\u0644\u0647\u0636\u0645\u064a \u0648\u0627\u0644\u062f\u0645\u0627\u063a", "\u0627\u0644\u0633\u064a\u0631\u0648\u062a\u0648\u0646\u064a\u0646 \u064a\u0644\u0639\u0628 \u062f\u0648\u0631\u0627\u064b \u0643\u0628\u064a\u0631\u0627\u064b \u0641\u064a \u0627\u0644\u064a\u0642\u0638\u0629 \u0648\u062d\u0631\u0643\u0629 \u0627\u0644\u0623\u0645\u0639\u0627\u0621."], ["\u0644\u0645\u0627\u0630\u0627 \u064a\u064f\u0646\u0635\u062d \u0645\u0631\u0636\u0649 \u0627\u0644\u0623\u0631\u0642 \u0628\u0627\u0644\u0627\u0628\u062a\u0639\u0627\u062f \u0627\u0644\u062a\u0627\u0645 \u0639\u0646 \u0627\u0644\u0634\u0627\u0634\u0627\u062a \u0648\u0627\u0644\u0647\u0648\u0627\u062a\u0641 (\u0627\u0644\u0636\u0648\u0621 \u0627\u0644\u0623\u0632\u0631\u0642) \u0642\u0628\u0644 \u0627\u0644\u0646\u0648\u0645 \u0628\u0633\u0627\u0639\u0629 \u0623\u0648 \u0633\u0627\u0639\u062a\u064a\u0646\u061f", ["\u0644\u0623\u0646\u0647\u0627 \u062a\u0633\u0628\u0628 \u0627\u0644\u0635\u062f\u0627\u0639", "\u0644\u0623\u0646 \u0627\u0644\u0636\u0648\u0621 \u0627\u0644\u0623\u0632\u0631\u0642 \u064a\u062e\u062f\u0639 \u0627\u0644\u062f\u0645\u0627\u063a \u0628\u0623\u0646\u0647 \u0646\u0647\u0627\u0631\u060c \u0641\u064a\u0642\u0648\u0645 \u0628\u062a\u062b\u0628\u064a\u0637 \u0625\u0641\u0631\u0627\u0632 \u0647\u0631\u0645\u0648\u0646 \u0627\u0644\u0646\u0648\u0645 (\u0627\u0644\u0645\u064a\u0644\u0627\u062a\u0648\u0646\u064a\u0646) \u0627\u0644\u0637\u0628\u064a\u0639\u064a", "\u0644\u0623\u0646\u0647\u0627 \u062a\u062c\u0647\u062f \u0627\u0644\u0639\u064a\u0646 \u0648\u062a\u0633\u0628\u0628 \u062a\u062f\u0645\u064a\u0639", "\u0644\u0623\u0646\u0647\u0627 \u062a\u0628\u0639\u062b \u0625\u0634\u0639\u0627\u0639\u0627\u062a \u062d\u0631\u0627\u0631\u064a\u0629"], "\u0644\u0623\u0646 \u0627\u0644\u0636\u0648\u0621 \u0627\u0644\u0623\u0632\u0631\u0642 \u064a\u062e\u062f\u0639 \u0627\u0644\u062f\u0645\u0627\u063a \u0628\u0623\u0646\u0647 \u0646\u0647\u0627\u0631\u060c \u0641\u064a\u0642\u0648\u0645 \u0628\u062a\u062b\u0628\u064a\u0637 \u0625\u0641\u0631\u0627\u0632 \u0647\u0631\u0645\u0648\u0646 \u0627\u0644\u0646\u0648\u0645 (\u0627\u0644\u0645\u064a\u0644\u0627\u062a\u0648\u0646\u064a\u0646) \u0627\u0644\u0637\u0628\u064a\u0639\u064a", "\u064a\u062c\u0628 \u062a\u0648\u0641\u064a\u0631 \u0628\u064a\u0626\u0629 \u062e\u0627\u0641\u062a\u0629 \u0644\u0644\u0633\u0645\u0627\u062d \u0644\u063a\u062f\u0629 \u0627\u0644\u0635\u0646\u0648\u0628\u0631\u064a\u0629 \u0628\u0627\u0644\u0639\u0645\u0644."]];
    const questions = questionsRaw.map(q => {
        return {
            q: q[0],
            options: q[1],
            ans: q[2],
            hint: q[3]
        };
    });

    let currentQ = 0;
    let score = 0;

    function render() {
        const qBox = document.getElementById('q-box');
        if (currentQ >= questions.length) {
            const pct = Math.round((score / questions.length) * 100);
            qBox.innerHTML = `
                <div style="text-align: center; padding: 30px 0;">
                    <h2 style="color: #2c3e50; font-size: 2.2rem; margin-bottom: 10px;">انتهى الاختبار!</h2>
                    <p style="font-size: 1.8rem; color: ${pct >= 80 ? '#27ae60' : '#c0392b'}; font-weight: bold;">النتيجة النهائية: ${score} / ${questions.length} (${pct}%)</p>
                    <p style="color: #7f8c8d; font-size: 1.2rem; margin-top: 10px;">${pct >= 80 ? 'عمل ممتاز! أنت مستعد تماماً للامتحان.' : 'قم بمراجعة الشروحات المرفقة لتعزيز معلوماتك.'}</p>
                </div>
                <button class="btn btn-restart" style="display: block;" onclick="location.reload()">إعادة الاختبار</button>
            `;
            document.getElementById('p-bar').style.width = '100%';
            return;
        }

        const q = questions[currentQ];
        document.getElementById('q-tracker').innerText = `السؤال: ${currentQ + 1} / ${questions.length}`;
        document.getElementById('score-tracker').innerText = `النتيجة: ${score}`;
        document.getElementById('p-bar').style.width = `${(currentQ / questions.length) * 100}%`;

        // Shuffle options for better testing
        let shuffledOptions = [...q.options].sort(() => Math.random() - 0.5);

        let html = `<div class='question'>${q.q}</div><div class='options'>`;
        shuffledOptions.forEach(opt => {
            const safeOpt = opt.replace(/'/g, "\'").replace(/"/g, '&quot;');
            const safeAns = q.ans.replace(/'/g, "\'").replace(/"/g, '&quot;');
            html += `<button class="opt-btn" onclick="checkAnswer('${safeOpt}', '${safeAns}', this)">${opt}</button>`;
        });

        html += `</div>

                    <button id="hintBtn" class="btn btn-hint" onclick="showHint()">💡 عرض الشرح الطبي</button>
                    <button id="nextBtn" class="btn btn-next" onclick="nextQuestion()">السؤال التالي ⬅️</button>
                 </div>
                 <div class='hint-box' id='hint'><strong>التفسير العلمي:</strong> ${q.hint}</div>`;

        qBox.innerHTML = html;
    }

    function checkAnswer(choice, ans, btn) {
        const buttons = document.querySelectorAll('.opt-btn');
        buttons.forEach(b => b.disabled = true);

        if (choice === ans) {
            btn.classList.add('correct');
            score++;
            document.getElementById('score-tracker').innerText = `النتيجة: ${score}`;
        } else {
            btn.classList.add('wrong');
            buttons.forEach(b => {
                if (b.innerText === ans) {
                    b.classList.add('correct');
                }
            });
        }
        document.getElementById('nextBtn').style.display = 'block';
        showHint();
    }

    function showHint() {
        document.getElementById('hint').style.display = 'block';
        document.getElementById('hintBtn').disabled = true;
        document.getElementById('hintBtn').style.opacity = '0.5';
    }

    function nextQuestion() {
        currentQ++;
        render();
    }

    render();
</script>
</body>
</html>
