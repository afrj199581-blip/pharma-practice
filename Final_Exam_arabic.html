\u0623\u0643\u062b\u0631 \u0623\u0645\u0627\u0646\u0627\u064b \u0644\u0644\u062d\u0648\u0627\u0645\u0644 \u0648\u0627\u0644\u0630\u064a \u064a\u0639\u062a\u0628\u0631 \u0627\u0644\u062e\u0637 \u0627\u0644\u0623\u0648\u0644 \u0644\u0644\u0639\u0644\u0627\u062c\u061f", ["\u0627\u0644\u0645\u0644\u064a\u0646\u0627\u062a \u0627\u0644\u0645\u0646\u0628\u0647\u0629 (Senna)", "\u0627\u0644\u0645\u0644\u064a\u0646\u0627\u062a \u0627\u0644\u0643\u062a\u0644\u0648\u064a\u0629 (Bulk-forming laxatives) \u0645\u062b\u0644 \u0627\u0644\u0625\u0633\u0628\u0627\u062c\u0648\u0644\u0627", "\u0632\u064a\u062a \u0627\u0644\u062e\u0631\u0648\u0639", "\u0627\u0644\u0645\u0644\u064a\u0646\u0627\u062a \u0627\u0644\u0645\u0644\u062d\u064a\u0629"], "\u0627\u0644\u0645\u0644\u064a\u0646\u0627\u062a \u0627\u0644\u0643\u062a\u0644\u0648\u064a\u0629 (Bulk-forming laxatives) \u0645\u062b\u0644 \u0627\u0644\u0625\u0633\u0628\u0627\u062c\u0648\u0644\u0627", "\u0644\u0623\u0646\u0647\u0627 \u0644\u0627 \u062a\u0645\u062a\u0635 \u0641\u064a \u0627\u0644\u062f\u0645 \u0648\u062a\u0639\u0645\u0644 \u0645\u0648\u0636\u0639\u064a\u0627\u064b \u062f\u0627\u062e\u0644 \u0627\u0644\u0623\u0645\u0639\u0627\u0621 \u0643\u0627\u0644\u0623\u0644\u064a\u0627\u0641 \u0627\u0644\u0637\u0628\u064a\u0639\u064a\u0629."], ["\u0645\u0627 \u0647\u0648 \u0627\u0644\u0634\u0631\u0637 \u0627\u0644\u0623\u0633\u0627\u0633\u064a \u0627\u0644\u0630\u064a \u064a\u062c\u0628 \u062a\u0623\u0643\u064a\u062f\u0647 \u0639\u0644\u0649 \u0627\u0644\u0645\u0631\u064a\u0636 \u0639\u0646\u062f \u0627\u0633\u062a\u062e\u062f\u0627\u0645 \u0627\u0644\u0645\u0644\u064a\u0646\u0627\u062a \u0627\u0644\u0643\u062a\u0644\u0648\u064a\u0629 (Ispaghula)\u061f", ["\u0645\u0636\u063a\u0647\u0627 \u062c\u064a\u062f\u0627\u064b", "\u062a\u0646\u0627\u0648\u0644\u0647\u0627 \u0645\u0639 \u0643\u0645\u064a\u0627\u062a \u0648\u0641\u064a\u0631\u0629 \u0645\u0646 \u0627\u0644\u0645\u0627\u0621 (\u0643\u0648\u0628 \u0643\u0627\u0645\u0644)", "\u062a\u0646\u0627\u0648\u0644\u0647\u0627 \u0645\u0639 \u0627\u0644\u062d\u0644\u064a\u0628 \u0627\u0644\u0633\u0627\u062e\u0646", "\u062a\u0646\u0627\u0648\u0644\u0647\u0627 \u0642\u0628\u0644 \u0627\u0644\u0646\u0648\u0645 \u0645\u0628\u0627\u0634\u0631\u0629 \u062f\u0648\u0646 \u0645\u0627\u0621"], "\u062a\u0646\u0627\u0648\u0644\u0647\u0627 \u0645\u0639 \u0643\u0645\u064a\u0627\u062a \u0648\u0641\u064a\u0631\u0629 \u0645\u0646 \u0627\u0644\u0645\u0627\u0621 (\u0643\u0648\u0628 \u0643\u0627\u0645\u0644)", "\u0644\u0623\u0646\u0647\u0627 \u062a\u0645\u062a\u0635 \u0627\u0644\u0645\u0627\u0621 \u0644\u062a\u0646\u062a\u0641\u062e\u060c \u0648\u0625\u0630\u0627 \u0644\u0645 \u062a\u0634\u0631\u0628 \u0645\u0627\u0621\u064b \u0643\u0627\u0641\u064a\u0627\u064b \u0642\u062f \u062a\u0633\u0628\u0628 \u0627\u0646\u0633\u062f\u0627\u062f\u0627\u064b \u0645\u0639\u0648\u064a\u0627\u064b."], ["\u0645\u0631\u064a\u0636 \u064a\u0628\u0644\u063a 70 \u0639\u0627\u0645\u0627\u064b \u064a\u0634\u0643\u0648 \u0645\u0646 \u0625\u0645\u0633\u0627\u0643 \u062d\u062f\u064a\u062b \u0627\u0644\u0638\u0647\u0648\u0631 \u0645\u0639 \u0641\u0642\u062f\u0627\u0646 \u0648\u0632\u0646 \u063a\u064a\u0631 \u0645\u0628\u0631\u0631\u060c \u0627\u0644\u0625\u062c\u0631\u0627\u0621 \u0627\u0644\u0635\u062d\u064a\u062d\u061f", ["\u0625\u0639\u0637\u0627\u0624\u0647 \u0645\u0644\u064a\u0646 \u0642\u0648\u064a", "\u0646\u0635\u062d\u0647 \u0628\u0632\u064a\u0627\u062f\u0629 \u0627\u0644\u0623\u0644\u064a\u0627\u0641", "\u0625\u062d\u0627\u0644\u0629 \u0641\u0648\u0631\u064a\u0629 \u0639\u0627\u062c\u0644\u0629 \u0644\u0627\u0633\u062a\u0628\u0639\u0627\u062f \u0633\u0631\u0637\u0627\u0646 \u0627\u0644\u0642\u0648\u0644\u0648\u0646", "\u062a\u062c\u0627\u0647\u0644 \u0627\u0644\u0623\u0645\u0631"], "\u0625\u062d\u0627\u0644\u0629 \u0641\u0648\u0631\u064a\u0629 \u0639\u0627\u062c\u0644\u0629 \u0644\u0627\u0633\u062a\u0628\u0639\u0627\u062f \u0633\u0631\u0637\u0627\u0646 \u0627\u0644\u0642\u0648\u0644\u0648\u0646", "\u0647\u0630\u0647 \u0645\u062c\u0645\u0648\u0639\u0629 \u0639\u0644\u0627\u0645\u0627\u062a \u062e\u0637\u0631 \u062d\u0645\u0631\u0627\u0621 (Red flags) \u0644\u0627 \u064a\u0633\u062a\u0647\u0627\u0646 \u0628\u0647\u0627."], ["\u0645\u0627 \u0647\u0648 \u0623\u0633\u0631\u0639 \u0627\u0644\u0645\u0644\u064a\u0646\u0627\u062a \u0627\u0644\u0641\u0645\u0648\u064a\u0629 \u0645\u0641\u0639\u0648\u0644\u0627\u064b (\u064a\u0639\u0645\u0644 \u062e\u0644\u0627\u0644 6-12 \u0633\u0627\u0639\u0629)\u061f", ["\u0627\u0644\u0645\u0644\u064a\u0646\u0627\u062a \u0627\u0644\u062a\u0646\u0627\u0636\u062d\u064a\u0629", "\u0627\u0644\u0645\u0644\u064a\u0646\u0627\u062a \u0627\u0644\u0643\u062a\u0644\u0648\u064a\u0629", "\u0627\u0644\u0645\u0644\u064a\u0646\u0627\u062a \u0627\u0644\u0645\u0646\u0628\u0647\u0629 (Stimulant laxatives) \u0645\u062b\u0644 \u0628\u064a\u0633\u0627\u0643\u0648\u062f\u064a\u0644", "\u0632\u064a\u062a \u0627\u0644\u0632\u064a\u062a\u0648\u0646"], "\u0627\u0644\u0645\u0644\u064a\u0646\u0627\u062a \u0627\u0644\u0645\u0646\u0628\u0647\u0629 (Stimulant laxatives) \u0645\u062b\u0644 \u0628\u064a\u0633\u0627\u0643\u0648\u062f\u064a\u0644", "\u062a\u062d\u0641\u0632 \u062c\u062f\u0627\u0631 \u0627\u0644\u0623\u0645\u0639\u0627\u0621 \u0645\u0628\u0627\u0634\u0631\u0629 \u0648\u062a\u0624\u062e\u0630 \u0639\u0627\u062f\u0629 \u0644\u064a\u0644\u0627\u064b \u0644\u062a\u0639\u0645\u0644 \u0641\u064a \u0627\u0644\u0635\u0628\u0627\u062d."], ["\u0644\u0645\u0627\u0630\u0627 \u064a\u064f\u0641\u0636\u0644 \u062a\u062c\u0646\u0628 \u0627\u0644\u0645\u0644\u064a\u0646\u0627\u062a \u0627\u0644\u0645\u0646\u0628\u0647\u0629 (Stimulants) \u0628\u0634\u0643\u0644 \u0631\u0648\u062a\u064a\u0646\u064a \u0623\u062b\u0646\u0627\u0621 \u0627\u0644\u062d\u0645\u0644\u061f", ["\u0644\u0623\u0646\u0647\u0627 \u062a\u0633\u0628\u0628 \u062a\u0634\u0648\u0647\u0627\u062a", "\u0644\u0623\u0646 \u062a\u062d\u0641\u064a\u0632\u0647\u0627 \u0627\u0644\u0642\u0648\u064a \u0644\u0644\u0623\u0645\u0639\u0627\u0621 \u0642\u062f \u064a\u062d\u0641\u0632 \u0627\u0646\u0642\u0628\u0627\u0636\u0627\u062a \u0627\u0644\u0631\u062d\u0645", "\u0644\u0623\u0646\u0647\u0627 \u063a\u064a\u0631 \u0641\u0639\u0627\u0644\u0629", "\u0644\u0623\u0646\u0647\u0627 \u062a\u0631\u0641\u0639 \u0627\u0644\u0636\u063a\u0637"], "\u0644\u0623\u0646 \u062a\u062d\u0641\u064a\u0632\u0647\u0627 \u0627\u0644\u0642\u0648\u064a \u0644\u0644\u0623\u0645\u0639\u0627\u0621 \u0642\u062f \u064a\u062d\u0641\u0632 \u0627\u0646\u0642\u0628\u0627\u0636\u0627\u062a \u0627\u0644\u0631\u062d\u0645", "\u062a\u0633\u062a\u062e\u062f\u0645 \u0641\u0642\u0637 \u0643\u0645\u0644\u0627\u0630 \u0623\u062e\u064a\u0631 \u0648\u0628\u062d\u0630\u0631 \u0634\u062f\u064a\u062f."], ["\u0634\u0631\u0627\u0628 \u0627\u0644\u0644\u0627\u0643\u062a\u0648\u0644\u0648\u0632 (Lactulose) \u064a\u0646\u062a\u0645\u064a \u0644\u0623\u064a \u0641\u0626\u0629 \u0645\u0646 \u0627\u0644\u0645\u0644\u064a\u0646\u0627\u062a\u061f", ["\u0627\u0644\u0643\u062a\u0644\u0648\u064a\u0629", "\u0627\u0644\u0645\u0646\u0628\u0647\u0629", "\u0627\u0644\u0645\u0644\u064a\u0646\u0627\u062a \u0627\u0644\u062a\u0646\u0627\u0636\u062d\u064a\u0629 (Osmotic laxatives)", "\u0627\u0644\u0645\u0646\u0639\u0645\u0629 \u0644\u0644\u0628\u0631\u0627\u0632"], "\u0627\u0644\u0645\u0644\u064a\u0646\u0627\u062a \u0627\u0644\u062a\u0646\u0627\u0636\u062d\u064a\u0629 (Osmotic laxatives)", "\u064a\u0639\u0645\u0644 \u0643\u0625\u0633\u0641\u0646\u062c\u0629 \u0643\u064a\u0645\u064a\u0627\u0626\u064a\u0629 \u062a\u0633\u062d\u0628 \u0627\u0644\u0645\u0627\u0621 \u0625\u0644\u0649 \u062a\u062c\u0648\u064a\u0641 \u0627\u0644\u0623\u0645\u0639\u0627\u0621 \u0644\u062a\u0644\u064a\u064a\u0646 \u0627\u0644\u0628\u0631\u0627\u0632."], ["\u0645\u0627 \u0647\u064a \u0627\u0644\u0641\u0626\u0629 \u0627\u0644\u062f\u064a\u0645\u0648\u063a\u0631\u0627\u0641\u064a\u0629 \u0627\u0644\u062a\u064a \u064a\u0643\u062b\u0631 \u0641\u064a\u0647\u0627 \u0633\u0648\u0621 \u0627\u0633\u062a\u062e\u062f\u0627\u0645 \u0627\u0644\u0645\u0644\u064a\u0646\u0627\u062a (Laxative Abuse) \u0644\u0623\u0633\u0628\u0627\u0628 \u0646\u0641\u0633\u064a\u0629\u061f", ["\u0627\u0644\u0631\u062c\u0627\u0644 \u0641\u0648\u0642 50 \u0633\u0646\u0629", "\u0627\u0644\u0634\u0627\u0628\u0627\u062a \u0648\u0627\u0644\u0645\u0631\u0627\u0647\u0642\u0627\u062a \u0627\u0644\u0644\u0627\u062a\u064a \u064a\u0639\u0627\u0646\u064a\u0646 \u0645\u0646 \u0627\u0636\u0637\u0631\u0627\u0628\u0627\u062a \u0627\u0644\u0623\u0643\u0644 \u0648\u0647\u0648\u0633 \u0641\u0642\u062f\u0627\u0646 \u0627\u0644\u0648\u0632\u0646", "\u0627\u0644\u0623\u0637\u0641\u0627\u0644", "\u0627\u0644\u0631\u064a\u0627\u0636\u064a\u0648\u0646"], "\u0627\u0644\u0634\u0627\u0628\u0627\u062a \u0648\u0627\u0644\u0645\u0631\u0627\u0647\u0642\u0627\u062a \u0627\u0644\u0644\u0627\u062a\u064a \u064a\u0639\u0627\u0646\u064a\u0646 \u0645\u0646 \u0627\u0636\u0637\u0631\u0627\u0628\u0627\u062a \u0627\u0644\u0623\u0643\u0644 \u0648\u0647\u0648\u0633 \u0641\u0642\u062f\u0627\u0646 \u0627\u0644\u0648\u0632\u0646", "\u0627\u0633\u062a\u062e\u062f\u0627\u0645\u0647\u0627 \u0627\u0644\u0645\u0641\u0631\u0637 \u064a\u062f\u0645\u0631 \u0648\u0638\u064a\u0641\u0629 \u0627\u0644\u0623\u0645\u0639\u0627\u0621 \u0627\u0644\u0637\u0628\u064a\u0639\u064a\u0629 \u0648\u064a\u0633\u0628\u0628 \u0627\u062e\u062a\u0644\u0627\u0644\u0627\u064b \u0641\u064a \u0627\u0644\u0628\u0648\u062a\u0627\u0633\u064a\u0648\u0645."], ["\u0645\u0627 \u0647\u0648 \u062f\u0648\u0631 \u062f\u0648\u0627\u0621 \u062f\u0648\u0643\u0648\u0633\u0627\u062a \u0627\u0644\u0635\u0648\u062f\u064a\u0648\u0645 (Docusate Sodium) \u0641\u064a \u0639\u0644\u0627\u062c \u0627\u0644\u0625\u0645\u0633\u0627\u0643\u061f", ["\u062a\u0646\u0634\u064a\u0637 \u0627\u0644\u0623\u0645\u0639\u0627\u0621 \u0628\u0634\u062f\u0629", "\u062a\u0642\u0644\u064a\u0644 \u0627\u0644\u062a\u0648\u062a\u0631 \u0627\u0644\u0633\u0637\u062d\u064a \u0644\u0644\u0628\u0631\u0627\u0632 \u0644\u064a\u0633\u0645\u062d \u0628\u062f\u062e\u0648\u0644 \u0627\u0644\u0645\u0627\u0621 \u0648\u0627\u0644\u062f\u0647\u0648\u0646 (\u0645\u0646\u0639\u0645 \u0644\u0644\u0628\u0631\u0627\u0632 Softener)", "\u0632\u064a\u0627\u062f\u0629 \u062d\u062c\u0645 \u0627\u0644\u0628\u0631\u0627\u0632", "\u0633\u062d\u0628 \u0627\u0644\u0645\u0627\u0621 \u0628\u0627\u0644\u062a\u0646\u0627\u0636\u062d"], "\u062a\u0642\u0644\u064a\u0644 \u0627\u0644\u062a\u0648\u062a\u0631 \u0627\u0644\u0633\u0637\u062d\u064a \u0644\u0644\u0628\u0631\u0627\u0632 \u0644\u064a\u0633\u0645\u062d \u0628\u062f\u062e\u0648\u0644 \u0627\u0644\u0645\u0627\u0621 \u0648\u0627\u0644\u062f\u0647\u0648\u0646 (\u0645\u0646\u0639\u0645 \u0644\u0644\u0628\u0631\u0627\u0632 Softener)", "\u064a\u0639\u0645\u0644 \u0643\u0645\u0627\u062f\u0629 \u062e\u0627\u0641\u0636\u0629 \u0644\u0644\u062a\u0648\u062a\u0631 \u0627\u0644\u0633\u0637\u062d\u064a."], ["\u0637\u0641\u0644 \u064a\u0639\u0627\u0646\u064a \u0645\u0646 \u0627\u0644\u0625\u0645\u0633\u0627\u0643 \u0648\u064a\u0642\u0648\u0645 \u0628\u062a\u0635\u0631\u0641\u0627\u062a \u0645\u062b\u0644 \u0625\u062e\u0641\u0627\u0621 \u0646\u0641\u0633\u0647\u060c \u0639\u0642\u062f \u0633\u0627\u0642\u064a\u0647\u060c \u0648\u0627\u0644\u0631\u0642\u0635 \u0641\u064a \u0645\u0643\u0627\u0646\u0647. \u0645\u0627 \u0647\u0630\u0627 \u0627\u0644\u0633\u0644\u0648\u0643\u061f", ["\u0644\u0639\u0628 \u0637\u0628\u064a\u0639\u064a", "\u0633\u0644\u0648\u0643 \u062d\u062c\u0628 \u0627\u0644\u0628\u0631\u0627\u0632 (Stool withholding behavior)", "\u0623\u0644\u0645 \u0641\u064a \u0627\u0644\u0628\u0637\u0646", "\u0641\u0631\u0637 \u0646\u0634\u0627\u0637"], "\u0633\u0644\u0648\u0643 \u062d\u062c\u0628 \u0627\u0644\u0628\u0631\u0627\u0632 (Stool withholding behavior)", "\u0627\u0644\u0637\u0641\u0644 \u064a\u0631\u0628\u0637 \u0627\u0644\u062a\u0628\u0631\u0632 \u0628\u0627\u0644\u0623\u0644\u0645 \u0641\u064a\u062d\u0627\u0648\u0644 \u062d\u0628\u0633\u0647\u060c \u0645\u0645\u0627 \u064a\u0632\u064a\u062f \u0627\u0644\u0625\u0645\u0633\u0627\u0643 \u0633\u0648\u0621\u0627\u064b \u0648\u062a\u0634\u0643\u0644 \u0643\u062a\u0644\u0629 \u0635\u0644\u0628\u0629."], ["\u0644\u062d\u0644 \u0645\u0634\u0643\u0644\u0629 \u0627\u0646\u062d\u0634\u0627\u0631 \u0627\u0644\u0628\u0631\u0627\u0632 \u0627\u0644\u0635\u0644\u0628 \u062c\u062f\u0627\u064b \u0641\u064a \u0627\u0644\u0645\u0633\u062a\u0642\u064a\u0645 \u0628\u0634\u0643\u0644 \u0633\u0631\u064a\u0639 (\u062e\u0644\u0627\u0644 15-30 \u062f\u0642\u064a\u0642\u0629)\u060c \u0645\u0627 \u0647\u0648 \u0627\u0644\u062e\u064a\u0627\u0631 \u0627\u0644\u0623\u0641\u0636\u0644\u061f", ["\u0645\u0644\u064a\u0646 \u0643\u062a\u0644\u0648\u064a \u0641\u0645\u0648\u064a", "\u0644\u0628\u0648\u0633 \u0627\u0644\u062c\u0644\u0633\u0631\u064a\u0646 (Glycerin Suppository) \u0623\u0648 \u0627\u0644\u062d\u0642\u0646\u0629 \u0627\u0644\u0634\u0631\u062c\u064a\u0629", "\u0634\u0631\u0627\u0628 \u0627\u0644\u0644\u0627\u0643\u062a\u0648\u0644\u0648\u0632", "\u0623\u0642\u0631\u0627\u0635 \u0633\u0646\u0627"], "\u0644\u0628\u0648\u0633 \u0627\u0644\u062c\u0644\u0633\u0631\u064a\u0646 (Glycerin Suppository) \u0623\u0648 \u0627\u0644\u062d\u0642\u0646\u0629 \u0627\u0644\u0634\u0631\u062c\u064a\u0629", "\u062a\u0639\u0645\u0644 \u0645\u0648\u0636\u0639\u064a\u0627\u064b \u0648\u0628\u0633\u0631\u0639\u0629 \u0641\u0627\u0626\u0642\u0629 \u0644\u062a\u0630\u0648\u064a\u0628 \u0648\u062a\u062d\u0641\u064a\u0632 \u0637\u0631\u062f \u0627\u0644\u0643\u062a\u0644\u0629 \u0627\u0644\u0645\u0627\u0646\u0639\u0629."], ["\u0627\u0633\u062a\u062e\u062f\u0627\u0645 \u0623\u0642\u0631\u0627\u0635 \u0633\u0646\u0627 (Senna) \u0644\u0641\u062a\u0631\u0627\u062a \u0637\u0648\u064a\u0644\u0629 \u064a\u0633\u0628\u0628 \u062a\u0644\u0648\u0646 \u062c\u062f\u0627\u0631 \u0627\u0644\u0642\u0648\u0644\u0648\u0646 \u0628\u0644\u0648\u0646 \u062f\u0627\u0643\u0646\u060c \u0645\u0627\u0630\u0627 \u062a\u0633\u0645\u0649 \u0647\u0630\u0647 \u0627\u0644\u062d\u0627\u0644\u0629\u061f", ["\u0633\u0631\u0637\u0627\u0646 \u0627\u0644\u0642\u0648\u0644\u0648\u0646", "\u0627\u0644\u062a\u0647\u0627\u0628 \u0627\u0644\u0642\u0648\u0644\u0648\u0646", "\u0627\u0644\u0642\u062a\u0627\u0645 \u0627\u0644\u0642\u0648\u0644\u0648\u0646\u064a (Melanosis coli)", "\u0627\u0644\u0628\u0648\u0627\u0633\u064a\u0631"], "\u0627\u0644\u0642\u062a\u0627\u0645 \u0627\u0644\u0642\u0648\u0644\u0648\u0646\u064a (Melanosis coli)", "\u062d\u0627\u0644\u0629 \u062d\u0645\u064a\u062f\u0629 \u0642\u0627\u0628\u0644\u0629 \u0644\u0644\u0627\u0646\u0639\u0643\u0627\u0633 \u0628\u0645\u062c\u0631\u062f \u0627\u0644\u062a\u0648\u0642\u0641 \u0639\u0646 \u0627\u0644\u062f\u0648\u0627\u0621."], ["\u0644\u0645\u0627\u0630\u0627 \u064a\u064f\u0646\u0635\u062d \u0645\u0631\u0636\u0649 \u0642\u0635\u0648\u0631 \u0627\u0644\u063a\u062f\u0629 \u0627\u0644\u062f\u0631\u0642\u064a\u0629 (Hypothyroidism) \u0628\u0627\u0644\u0627\u0646\u062a\u0628\u0627\u0647 \u0644\u0645\u0648\u0636\u0648\u0639 \u0627\u0644\u0625\u0645\u0633\u0627\u0643\u061f", ["\u0644\u0623\u0646 \u0627\u0644\u063a\u062f\u0629 \u062a\u0646\u062a\u062c \u0633\u0645\u0648\u0645\u0627\u064b", "\u0644\u0623\u0646 \u0646\u0642\u0635 \u0647\u0631\u0645\u0648\u0646 \u0627\u0644\u062b\u064a\u0631\u0648\u0643\u0633\u064a\u0646 \u064a\u0628\u0637\u0626 \u062c\u0645\u064a\u0639 \u0639\u0645\u0644\u064a\u0627\u062a \u0627\u0644\u0623\u064a\u0636 \u0628\u0645\u0627 \u0641\u064a\u0647\u0627 \u062d\u0631\u0643\u0629 \u0627\u0644\u0623\u0645\u0639\u0627\u0621", "\u0644\u0623\u0646\u0647\u0645 \u064a\u0623\u0643\u0644\u0648\u0646 \u0642\u0644\u064a\u0644\u0627\u064b", "\u0628\u0633\u0628\u0628 \u0623\u062f\u0648\u064a\u0629 \u0627\u0644\u063a\u062f\u0629"], "\u0644\u0623\u0646 \u0646\u0642\u0635 \u0647\u0631\u0645\u0648\u0646 \u0627\u0644\u062b\u064a\u0631\u0648\u0643\u0633\u064a\u0646 \u064a\u0628\u0637\u0626 \u062c\u0645\u064a\u0639 \u0639\u0645\u0644\u064a\u0627\u062a \u0627\u0644\u0623\u064a\u0636 \u0628\u0645\u0627 \u0641\u064a\u0647\u0627 \u062d\u0631\u0643\u0629 \u0627\u0644\u0623\u0645\u0639\u0627\u0621", "\u0627\u0644\u0625\u0645\u0633\u0627\u0643 \u0639\u0631\u0636 \u0643\u0644\u0627\u0633\u064a\u0643\u064a \u0644\u062e\u0645\u0648\u0644 \u0627\u0644\u063a\u062f\u0629."], ["\u0645\u0631\u064a\u0636 \u064a\u062a\u0646\u0627\u0648\u0644 \u0645\u0636\u0627\u062f\u0627\u062a \u0627\u0643\u062a\u0626\u0627\u0628 \u062b\u0644\u0627\u062b\u064a\u0629 \u0627\u0644\u062d\u0644\u0642\u0627\u062a (TCAs) \u0648\u064a\u0634\u062a\u0643\u064a \u0645\u0646 \u0625\u0645\u0633\u0627\u0643 \u0634\u062f\u064a\u062f\u060c \u0645\u0627 \u0647\u0648 \u0627\u0644\u0633\u0628\u0628 \u0627\u0644\u062f\u0648\u0627\u0626\u064a\u061f", ["\u062e\u0635\u0627\u0626\u0635 \u0627\u0644\u062f\u0648\u0627\u0621 \u0627\u0644\u0645\u0636\u0627\u062f\u0629 \u0644\u0644\u0643\u0648\u0644\u064a\u0646 (Anticholinergic effects) \u0627\u0644\u062a\u064a \u062a\u062c\u0641\u0641 \u0648\u062a\u0628\u0637\u0626 \u0627\u0644\u0623\u0645\u0639\u0627\u0621", "\u062a\u0623\u062b\u064a\u0631 \u0627\u0644\u062f\u0648\u0627\u0621 \u0639\u0644\u0649 \u0627\u0644\u0633\u064a\u0631\u0648\u062a\u0648\u0646\u064a\u0646", "\u062a\u062f\u0645\u064a\u0631 \u0627\u0644\u0628\u0643\u062a\u064a\u0631\u064a\u0627 \u0627\u0644\u0646\u0627\u0641\u0639\u0629", "\u0646\u0642\u0635 \u0627\u0645\u062a\u0635\u0627\u0635 \u0627\u0644\u0643\u0627\u0644\u0633\u064a\u0648\u0645"], "\u062e\u0635\u0627\u0626\u0635 \u0627\u0644\u062f\u0648\u0627\u0621 \u0627\u0644\u0645\u0636\u0627\u062f\u0629 \u0644\u0644\u0643\u0648\u0644\u064a\u0646 (Anticholinergic effects) \u0627\u0644\u062a\u064a \u062a\u062c\u0641\u0641 \u0648\u062a\u0628\u0637\u0626 \u0627\u0644\u0623\u0645\u0639\u0627\u0621", "\u0627\u0644\u062a\u0623\u062b\u064a\u0631 \u0627\u0644\u0645\u0636\u0627\u062f \u0644\u0644\u0643\u0648\u0644\u064a\u0646 \u064a\u0633\u0628\u0628 \u062c\u0641\u0627\u0641 \u0627\u0644\u0641\u0645\u060c \u0627\u0644\u0625\u0645\u0633\u0627\u0643\u060c \u0648\u0627\u062d\u062a\u0628\u0627\u0633 \u0627\u0644\u0628\u0648\u0644."], ["\u0645\u0627 \u0647\u0648 \u0627\u0644\u0647\u062f\u0641 \u0627\u0644\u0639\u0644\u0645\u064a \u0648\u0627\u0644\u0623\u0633\u0627\u0633\u064a \u0645\u0646 \u0627\u0644\u0639\u0644\u0627\u062c \u0628\u0628\u062f\u0627\u0626\u0644 \u0627\u0644\u0646\u064a\u0643\u0648\u062a\u064a\u0646 (NRT)\u061f", ["\u0625\u0642\u0646\u0627\u0639 \u0627\u0644\u0645\u0631\u064a\u0636 \u0628\u0643\u0631\u0627\u0647\u064a\u0629 \u0627\u0644\u062a\u062f\u062e\u064a\u0646", "\u062a\u0648\u0635\u064a\u0644 \u0627\u0644\u0646\u064a\u0643\u0648\u062a\u064a\u0646 \u0628\u0637\u0631\u064a\u0642\u0629 \u0622\u0645\u0646\u0629 \u0644\u062a\u062e\u0641\u064a\u0641 \u0623\u0639\u0631\u0627\u0636 \u0627\u0644\u0627\u0646\u0633\u062d\u0627\u0628 \u0628\u062f\u0648\u0646 \u0627\u0644\u0642\u0637\u0631\u0627\u0646 \u0648\u0627\u0644\u063a\u0627\u0632\u0627\u062a \u0627\u0644\u0633\u0627\u0645\u0629", "\u0645\u0646\u0639 \u0627\u0644\u0646\u064a\u0643\u0648\u062a\u064a\u0646 \u0645\u0646 \u0627\u0644\u0648\u0635\u0648\u0644 \u0644\u0644\u062f\u0645\u0627\u063a", "\u062a\u062e\u062f\u064a\u0631 \u0627\u0644\u0645\u0631\u064a\u0636"], "\u062a\u0648\u0635\u064a\u0644 \u0627\u0644\u0646\u064a\u0643\u0648\u062a\u064a\u0646 \u0628\u0637\u0631\u064a\u0642\u0629 \u0622\u0645\u0646\u0629 \u0644\u062a\u062e\u0641\u064a\u0641 \u0623\u0639\u0631\u0627\u0636 \u0627\u0644\u0627\u0646\u0633\u062d\u0627\u0628 \u0628\u062f\u0648\u0646 \u0627\u0644\u0642\u0637\u0631\u0627\u0646 \u0648\u0627\u0644\u063a\u0627\u0632\u0627\u062a \u0627\u0644\u0633\u0627\u0645\u0629", "\u064a\u0641\u0635\u0644 \u0625\u062f\u0645\u0627\u0646 \u0627\u0644\u0646\u064a\u0643\u0648\u062a\u064a\u0646 \u0639\u0646 \u0623\u0636\u0631\u0627\u0631 \u0627\u0644\u062f\u062e\u0627\u0646."], ["\u0645\u0627 \u0647\u064a \u0627\u0644\u0645\u064a\u0632\u0629 \u0627\u0644\u062d\u0631\u0643\u064a\u0629 (Pharmacokinetics) \u0644\u0644\u0635\u0642\u0627\u062a \u0627\u0644\u0646\u064a\u0643\u0648\u062a\u064a\u0646 (Patches)\u061f", ["\u062a\u0635\u0644 \u0644\u0644\u0630\u0631\u0648\u0629 \u0641\u064a \u062b\u0648\u0627\u0646\u064d", "\u062a\u0648\u0641\u0631 \u062a\u0648\u0635\u064a\u0644\u0627\u064b \u0628\u0637\u064a\u0626\u0627\u064b \u0648\u0645\u0633\u062a\u0645\u0631\u0627\u064b \u0644\u0644\u0646\u064a\u0643\u0648\u062a\u064a\u0646 \u0645\u0645\u0627 \u064a\u0648\u0641\u0631 \u0627\u0633\u062a\u0642\u0631\u0627\u0631\u0627\u064b (Baseline control) \u0637\u0648\u0627\u0644 \u0627\u0644\u064a\u0648\u0645", "\u062a\u0639\u0645\u0644 \u0641\u0642\u0637 \u0639\u0646\u062f \u0645\u0636\u063a\u0647\u0627", "\u062a\u0646\u062a\u0647\u064a \u0641\u0639\u0627\u0644\u064a\u062a\u0647\u0627 \u062e\u0644\u0627\u0644 \u0633\u0627\u0639\u0629"], "\u062a\u0648\u0641\u0631 \u062a\u0648\u0635\u064a\u0644\u0627\u064b \u0628\u0637\u064a\u0626\u0627\u064b \u0648\u0645\u0633\u062a\u0645\u0631\u0627\u064b \u0644\u0644\u0646\u064a\u0643\u0648\u062a\u064a\u0646 \u0645\u0645\u0627 \u064a\u0648\u0641\u0631 \u0627\u0633\u062a\u0642\u0631\u0627\u0631\u0627\u064b (Baseline control) \u0637\u0648\u0627\u0644 \u0627\u0644\u064a\u0648\u0645", "\u062a\u0645\u0646\u0639 \u0627\u0644\u0631\u063a\u0628\u0629 \u0627\u0644\u0645\u0633\u062a\u0645\u0631\u0629 (Craving) \u0628\u0641\u0636\u0644 \u0627\u0644\u0645\u0633\u062a\u0648\u0649 \u0627\u0644\u062b\u0627\u0628\u062a \u0641\u064a \u0627\u0644\u062f\u0645."], ["\u0645\u0627 \u0647\u064a \u0627\u0644\u0637\u0631\u064a\u0642\u0629 \u0627\u0644\u0635\u062d\u064a\u062d\u0629 \u0627\u0644\u0648\u062d\u064a\u062f\u0629 \u0644\u0627\u0633\u062a\u062e\u062f\u0627\u0645 \u0639\u0644\u0643\u0629 \u0627\u0644\u0646\u064a\u0643\u0648\u062a\u064a\u0646 \u0627\u0644\u0641\u0645\u0648\u064a\u0629 \u0644\u0636\u0645\u0627\u0646 \u0627\u0644\u0641\u0639\u0627\u0644\u064a\u0629 \u0648\u062a\u0642\u0644\u064a\u0644 \u0627\u0644\u0622\u062b\u0627\u0631 \u0627\u0644\u062c\u0627\u0646\u0628\u064a\u0629\u061f", ["\u0627\u0644\u0645\u0636\u063a \u0627\u0644\u0645\u0633\u062a\u0645\u0631 \u0643\u0627\u0644\u0639\u0644\u0643\u0629 \u0627\u0644\u0639\u0627\u062f\u064a\u0629", "\u0627\u0644\u0628\u0644\u0639 \u0641\u0648\u0631\u0627\u064b", "\u062a\u0642\u0646\u064a\u0629 '\u0627\u0644\u0627\u0645\u0636\u063a \u0648\u0627\u0631\u0643\u0646' (Chew and Park) \u0628\u064a\u0646 \u0627\u0644\u062e\u062f \u0648\u0627\u0644\u0644\u062b\u0629", "\u062a\u0630\u0648\u064a\u0628\u0647\u0627 \u0628\u0627\u0644\u0645\u0627\u0621 \u0627\u0644\u0633\u0627\u062e\u0646"], "\u062a\u0642\u0646\u064a\u0629 '\u0627\u0644\u0627\u0645\u0636\u063a \u0648\u0627\u0631\u0643\u0646' (Chew and Park) \u0628\u064a\u0646 \u0627\u0644\u062e\u062f \u0648\u0627\u0644\u0644\u062b\u0629", "\u0644\u0643\u064a \u064a\u064f\u0645\u062a\u0635 \u0627\u0644\u0646\u064a\u0643\u0648\u062a\u064a\u0646 \u0628\u0628\u0637\u0621 \u0639\u0628\u0631 \u0627\u0644\u063a\u0634\u0627\u0621 \u0627\u0644\u0645\u062e\u0627\u0637\u064a \u0644\u0644\u0641\u0645 \u0648\u0644\u064a\u0633 \u0627\u0644\u0645\u0639\u062f\u0629."], ["\u0645\u0631\u064a\u0636 \u064a\u0645\u0636\u063a \u0639\u0644\u0643\u0629 \u0627\u0644\u0646\u064a\u0643\u0648\u062a\u064a\u0646 \u0628\u0627\u0633\u062a\u0645\u0631\u0627\u0631 \u0648\u064a\u0634\u062a\u0643\u064a \u0645\u0646 \u062d\u0631\u0642\u0627\u0646 \u0634\u062f\u064a\u062f \u0641\u064a \u0627\u0644\u0645\u0639\u062f\u0629 \u0648\u063a\u062b\u064a\u0627\u0646\u060c \u0645\u0627 \u0627\u0644\u0633\u0628\u0628\u061f", ["\u0627\u0644\u0639\u0644\u0643\u0629 \u0645\u0646\u062a\u0647\u064a\u0629 \u0627\u0644\u0635\u0644\u0627\u062d\u064a\u0629", "\u0627\u0628\u062a\u0644\u0627\u0639 \u0627\u0644\u0644\u0639\u0627\u0628 \u0627\u0644\u0645\u0644\u064a\u0621 \u0628\u0627\u0644\u0646\u064a\u0643\u0648\u062a\u064a\u0646 \u064a\u0633\u0628\u0628 \u062a\u0647\u064a\u062c\u0627\u064b \u0634\u062f\u064a\u062f\u0627\u064b \u0644\u0644\u0645\u0639\u062f\u0629 \u0648\u0636\u0639\u0641\u0627\u064b \u0641\u064a \u0627\u0644\u0627\u0645\u062a\u0635\u0627\u0635", "\u0644\u062f\u064a\u0647 \u0642\u0631\u062d\u0629 \u0645\u0639\u062f\u0629 \u0633\u0627\u0628\u0642\u0629", "\u062a\u0623\u062b\u064a\u0631 \u062c\u0627\u0646\u0628\u064a \u0637\u0628\u064a\u0639\u064a \u0644\u0627 \u064a\u0645\u0643\u0646 \u062a\u062c\u0646\u0628\u0647"], "\u0627\u0628\u062a\u0644\u0627\u0639 \u0627\u0644\u0644\u0639\u0627\u0628 \u0627\u0644\u0645\u0644\u064a\u0621 \u0628\u0627\u0644\u0646\u064a\u0643\u0648\u062a\u064a\u0646 \u064a\u0633\u0628\u0628 \u062a\u0647\u064a\u062c\u0627\u064b \u0634\u062f\u064a\u062f\u0627\u064b \u0644\u0644\u0645\u0639\u062f\u0629 \u0648\u0636\u0639\u0641\u0627\u064b \u0641\u064a \u0627\u0644\u0627\u0645\u062a\u0635\u0627\u0635", "\u0627\u0644\u0646\u064a\u0643\u0648\u062a\u064a\u0646 \u064a\u0645\u062a\u0635 \u0628\u0643\u0641\u0627\u0621\u0629 \u0641\u064a \u0627\u0644\u0641\u0645\u060c \u0628\u064a\u0646\u0645\u0627 \u064a\u062a\u062f\u0645\u0631 \u0648\u064a\u0647\u064a\u062c \u0641\u064a \u0627\u0644\u0645\u0639\u062f\u0629."], ["\u0644\u0645\u0627\u0630\u0627 \u064a\u064f\u0646\u0635\u062d \u0627\u0644\u0645\u0631\u064a\u0636 \u0628\u062a\u062c\u0646\u0628 \u0627\u0644\u0642\u0647\u0648\u0629\u060c \u0627\u0644\u0643\u0648\u0644\u0627\u060c \u0648\u0627\u0644\u0639\u0635\u0627\u0626\u0631 \u0627\u0644\u062d\u0645\u0636\u064a\u0629 \u0642\u0628\u0644 15 \u062f\u0642\u064a\u0642\u0629 \u0645\u0646 \u0627\u0633\u062a\u062e\u062f\u0627\u0645 \u0627\u0644\u0639\u0644\u0643\u0629 \u0623\u0648 \u0627\u0644\u0645\u0633\u062a\u062d\u0644\u0628\u061f", ["\u0644\u0623\u0646\u0647\u0627 \u062a\u0635\u0628\u063a \u0627\u0644\u0623\u0633\u0646\u0627\u0646", "\u0644\u0623\u0646 \u0627\u0644\u0648\u0633\u0637 \u0627\u0644\u062d\u0645\u0636\u064a \u064a\u0645\u0646\u0639 \u0628\u0634\u0643\u0644 \u0643\u0628\u064a\u0631 \u0627\u0645\u062a\u0635\u0627\u0635 \u0627\u0644\u0646\u064a\u0643\u0648\u062a\u064a\u0646 \u0639\u0628\u0631 \u063a\u0634\u0627\u0621 \u0627\u0644\u0641\u0645", "\u0644\u0623\u0646\u0647\u0627 \u062a\u0632\u064a\u062f \u0627\u0644\u062a\u0648\u062a\u0631", "\u0644\u0623\u0646\u0647\u0627 \u062a\u0630\u064a\u0628 \u0627\u0644\u0639\u0644\u0643\u0629"], "\u0644\u0623\u0646 \u0627\u0644\u0648\u0633\u0637 \u0627\u0644\u062d\u0645\u0636\u064a \u064a\u0645\u0646\u0639 \u0628\u0634\u0643\u0644 \u0643\u0628\u064a\u0631 \u0627\u0645\u062a\u0635\u0627\u0635 \u0627\u0644\u0646\u064a\u0643\u0648\u062a\u064a\u0646 \u0639\u0628\u0631 \u063a\u0634\u0627\u0621 \u0627\u0644\u0641\u0645", "\u0627\u0644\u0646\u064a\u0643\u0648\u062a\u064a\u0646 \u064a\u062d\u062a\u0627\u062c \u0644\u0648\u0633\u0637 \u0642\u0644\u0648\u064a (Alkaline) \u0644\u064a\u0639\u0628\u0631 \u0627\u0644\u0623\u063a\u0634\u064a\u0629 \u0628\u0643\u0641\u0627\u0621\u0629."], ["\u0645\u0627 \u0647\u0648 \u0623\u0633\u0631\u0639 \u0634\u0643\u0644 \u0635\u064a\u062f\u0644\u0627\u0646\u064a \u0644\u062a\u0648\u0635\u064a\u0644 \u0627\u0644\u0646\u064a\u0643\u0648\u062a\u064a\u0646 \u0644\u0644\u062f\u0645\u0627\u063a \u0644\u0645\u062d\u0627\u0643\u0627\u0629 '\u0636\u0631\u0628\u0629' \u0627\u0644\u0633\u064a\u062c\u0627\u0631\u0629 (Hit)\u061f", ["\u0644\u0635\u0642\u0629 \u0627\u0644\u0646\u064a\u0643\u0648\u062a\u064a\u0646", "\u0627\u0644\u0639\u0644\u0643\u0629", "\u0628\u062e\u0627\u062e \u0627\u0644\u0623\u0646\u0641 (Nasal Spray)", "\u0627\u0644\u0645\u0633\u062a\u062d\u0644\u0628"], "\u0628\u062e\u0627\u062e \u0627\u0644\u0623\u0646\u0641 (Nasal Spray)", "\u0644\u0623\u0646 \u0627\u0644\u063a\u0634\u0627\u0621 \u0627\u0644\u0645\u062e\u0627\u0637\u064a \u0644\u0644\u0623\u0646\u0641 \u063a\u0646\u064a \u062c\u062f\u0627\u064b \u0628\u0627\u0644\u0634\u0639\u064a\u0631\u0627\u062a \u0627\u0644\u062f\u0645\u0648\u064a\u0629\u060c \u0641\u064a\u062d\u062f\u062b \u0627\u0644\u0627\u0645\u062a\u0635\u0627\u0635 \u0641\u0648\u0631\u0627\u064b."], ["\u0645\u062f\u062e\u0646 \u0634\u0631\u0647 (\u0623\u0643\u062b\u0631 \u0645\u0646 20 \u0633\u064a\u062c\u0627\u0631\u0629 \u064a\u0648\u0645\u064a\u0627\u064b) \u0627\u0633\u062a\u062e\u062f\u0645 \u0627\u0644\u0644\u0635\u0642\u0629 \u0648\u062d\u062f\u0647\u0627 \u0648\u0641\u0634\u0644 \u0644\u0623\u0646\u0647 \u0644\u0627 \u064a\u0632\u0627\u0644 \u064a\u0634\u0639\u0631 \u0628\u0631\u063a\u0628\u0629 \u0645\u0641\u0627\u062c\u0626\u0629 \u0628\u0627\u0644\u062a\u062f\u062e\u064a\u0646\u060c \u0645\u0627 \u0627\u0644\u0627\u0633\u062a\u0631\u0627\u062a\u064a\u062c\u064a\u0629 \u0627\u0644\u0623\u0641\u0636\u0644\u061f", ["\u0627\u0644\u062a\u0648\u0642\u0641 \u0639\u0646 \u0627\u0644\u0639\u0644\u0627\u062c \u0644\u0623\u0646\u0647 \u0641\u0627\u0634\u0644", "\u0627\u0644\u0639\u0644\u0627\u062c \u0627\u0644\u0645\u0632\u062f\u0648\u062c (Combination Therapy): \u0644\u0635\u0642\u0629 \u0644\u0644\u0623\u0633\u0627\u0633 + \u0639\u0644\u0643\u0629 \u0623\u0648 \u0645\u0633\u062a\u062d\u0644\u0628 \u0644\u0644\u0631\u063a\u0628\u0627\u062a \u0627\u0644\u0645\u0641\u0627\u062c\u0626\u0629", "\u0648\u0636\u0639 3 \u0644\u0635\u0642\u0627\u062a \u0645\u0639\u0627\u064b", "\u0627\u0644\u0639\u0648\u062f\u0629 \u0644\u0644\u062a\u062f\u062e\u064a\u0646 \u0627\u0644\u062e\u0641\u064a\u0641"], "\u0627\u0644\u0639\u0644\u0627\u062c \u0627\u0644\u0645\u0632\u062f\u0648\u062c (Combination Therapy): \u0644\u0635\u0642\u0629 \u0644\u0644\u0623\u0633\u0627\u0633 + \u0639\u0644\u0643\u0629 \u0623\u0648 \u0645\u0633\u062a\u062d\u0644\u0628 \u0644\u0644\u0631\u063a\u0628\u0627\u062a \u0627\u0644\u0645\u0641\u0627\u062c\u0626\u0629", "\u0647\u0630\u0627 \u0647\u0648 \u0627\u0644\u0645\u0639\u064a\u0627\u0631 \u0627\u0644\u0630\u0647\u0628\u064a \u0644\u0644\u0645\u062f\u062e\u0646\u064a\u0646 \u0627\u0644\u0634\u0631\u0647\u064a\u0646 \u0644\u0644\u0633\u064a\u0637\u0631\u0629 \u0627\u0644\u062a\u0627\u0645\u0629."], ["\u0645\u0631\u064a\u0636 \u064a\u0633\u062a\u062e\u062f\u0645 \u0644\u0635\u0642\u0627\u062a \u0627\u0644\u0646\u064a\u0643\u0648\u062a\u064a\u0646 \u0648\u064a\u0634\u062a\u0643\u064a \u0645\u0646 \u0643\u0648\u0627\u0628\u064a\u0633 \u0648\u0623\u062d\u0644\u0627\u0645 \u0645\u0632\u0639\u062c\u0629 \u062c\u062f\u0627\u064b \u0648\u0648\u0627\u0642\u0639\u064a\u0629\u060c \u0645\u0627 \u0647\u064a \u0646\u0635\u064a\u062d\u062a\u0643 \u0643\u0635\u064a\u062f\u0644\u064a\u061f", ["\u0648\u0642\u0641 \u0627\u0644\u0639\u0644\u0627\u062c \u0641\u0648\u0631\u0627\u064b", "\u0625\u0632\u0627\u0644\u0629 \u0627\u0644\u0644\u0635\u0642\u0629 \u0644\u064a\u0644\u0627\u064b \u0642\u0628\u0644 \u0627\u0644\u0646\u0648\u0645 (\u062a\u062c\u0646\u0628 \u0627\u0644\u0627\u0645\u062a\u0635\u0627\u0635 \u0623\u062b\u0646\u0627\u0621 \u0646\u0648\u0645 \u062d\u0631\u0643\u0629 \u0627\u0644\u0639\u064a\u0646 \u0627\u0644\u0633\u0631\u064a\u0639\u0629 REM)", "\u062a\u0646\u0627\u0648\u0644 \u062d\u0628\u0648\u0628 \u0645\u0646\u0648\u0645\u0629 \u0645\u0639\u0647\u0627", "\u0645\u0636\u0627\u0639\u0641\u0629 \u0627\u0644\u062c\u0631\u0639\u0629 \u0641\u064a \u0627\u0644\u0635\u0628\u0627\u062d"], "\u0625\u0632\u0627\u0644\u0629 \u0627\u0644\u0644\u0635\u0642\u0629 \u0644\u064a\u0644\u0627\u064b \u0642\u0628\u0644 \u0627\u0644\u0646\u0648\u0645 (\u062a\u062c\u0646\u0628 \u0627\u0644\u0627\u0645\u062a\u0635\u0627\u0635 \u0623\u062b\u0646\u0627\u0621 \u0646\u0648\u0645 \u062d\u0631\u0643\u0629 \u0627\u0644\u0639\u064a\u0646 \u0627\u0644\u0633\u0631\u064a\u0639\u0629 REM)", "\u0627\u0644\u0646\u064a\u0643\u0648\u062a\u064a\u0646 \u0623\u062b\u0646\u0627\u0621 \u0627\u0644\u0644\u064a\u0644 \u064a\u0633\u0628\u0628 \u0627\u0636\u0637\u0631\u0627\u0628\u0627\u062a \u0642\u0648\u064a\u0629 \u0641\u064a \u0627\u0644\u0623\u062d\u0644\u0627\u0645."], ["\u062f\u0648\u0627\u0621 \u0628\u0648\u0628\u0631\u0648\u0628\u064a\u0648\u0646 (Zyban) \u0627\u0644\u0645\u0633\u062a\u062e\u062f\u0645 \u0644\u0644\u0625\u0642\u0644\u0627\u0639 \u0639\u0646 \u0627\u0644\u062a\u062f\u062e\u064a\u0646\u060c \u064a\u064f\u0645\u0646\u0639 \u0627\u0633\u062a\u062e\u062f\u0627\u0645\u0647 \u0645\u0646\u0639\u0627\u064b \u0628\u0627\u062a\u0627\u064b \u0644\u0623\u064a \u0641\u0626\u0629 \u0645\u0646 \u0627\u0644\u0645\u0631\u0636\u0649\u061f", ["\u0645\u0631\u0636\u0649 \u0627\u0644\u0631\u0628\u0648", "\u0627\u0644\u0645\u0631\u0636\u0649 \u0627\u0644\u0630\u064a\u0646 \u0644\u062f\u064a\u0647\u0645 \u062a\u0627\u0631\u064a\u062e \u0645\u0646 \u0627\u0644\u062a\u0634\u0646\u062c\u0627\u062a (Seizures) \u0623\u0648 \u0627\u0636\u0637\u0631\u0627\u0628\u0627\u062a \u0627\u0644\u0623\u0643\u0644", "\u0645\u0631\u0636\u0649 \u0627\u0644\u0642\u0631\u062d\u0629", "\u0645\u0631\u0636\u0649 \u0627\u0644\u0633\u0643\u0631\u064a"], "\u0627\u0644\u0645\u0631\u0636\u0649 \u0627\u0644\u0630\u064a\u0646 \u0644\u062f\u064a\u0647\u0645 \u062a\u0627\u0631\u064a\u062e \u0645\u0646 \u0627\u0644\u062a\u0634\u0646\u062c\u0627\u062a (Seizures) \u0623\u0648 \u0627\u0636\u0637\u0631\u0627\u0628\u0627\u062a \u0627\u0644\u0623\u0643\u0644", "\u0644\u0623\u0646\u0647 \u064a\u0642\u0644\u0644 \u0645\u0646 \u0627\u0644\u0639\u062a\u0628\u0629 \u0627\u0644\u0645\u062a\u0633\u0628\u0628\u0629 \u0641\u064a \u0627\u0644\u0646\u0648\u0628\u0627\u062a \u0627\u0644\u0639\u0635\u0628\u064a\u0629 (Seizure threshold)."], ["\u0643\u064a\u0641 \u064a\u0639\u0645\u0644 \u062f\u0648\u0627\u0621 \u0641\u0627\u0631\u064a\u0646\u064a\u0643\u0644\u064a\u0646 (Champix) \u0641\u064a \u0627\u0644\u062f\u0645\u0627\u063a \u0644\u0644\u0645\u0633\u0627\u0639\u062f\u0629 \u0641\u064a \u0627\u0644\u0625\u0642\u0644\u0627\u0639 \u0639\u0646 \u0627\u0644\u062a\u062f\u062e\u064a\u0646\u061f", ["\u064a\u064f\u0641\u0631\u0632 \u0646\u064a\u0643\u0648\u062a\u064a\u0646 \u0646\u0642\u064a", "\u064a\u0639\u0645\u0644 \u0643\u0645\u0646\u0634\u0637 \u062c\u0632\u0626\u064a (Partial Agonist) \u0644\u0645\u0633\u062a\u0642\u0628\u0644\u0627\u062a \u0627\u0644\u0646\u064a\u0643\u0648\u062a\u064a\u0646\u061b \u064a\u0642\u0644\u0644 \u0627\u0644\u0631\u063a\u0628\u0629 \u0648\u064a\u0645\u0646\u0639 \u0645\u062a\u0639\u0629 \u0627\u0644\u062a\u062f\u062e\u064a\u0646 \u0625\u0630\u0627 \u062f\u062e\u0646 \u0627\u0644\u0645\u0631\u064a\u0636", "\u064a\u0646\u0648\u0645 \u0627\u0644\u0645\u0631\u064a\u0636 \u0637\u0648\u0627\u0644 \u0627\u0644\u064a\u0648\u0645", "\u064a\u062c\u0639\u0644 \u0637\u0639\u0645 \u0627\u0644\u062f\u062e\u0627\u0646 \u062d\u0627\u0631\u0627\u064b"], "\u064a\u0639\u0645\u0644 \u0643\u0645\u0646\u0634\u0637 \u062c\u0632\u0626\u064a (Partial Agonist) \u0644\u0645\u0633\u062a\u0642\u0628\u0644\u0627\u062a \u0627\u0644\u0646\u064a\u0643\u0648\u062a\u064a\u0646\u061b \u064a\u0642\u0644\u0644 \u0627\u0644\u0631\u063a\u0628\u0629 \u0648\u064a\u0645\u0646\u0639 \u0645\u062a\u0639\u0629 \u0627\u0644\u062a\u062f\u062e\u064a\u0646 \u0625\u0630\u0627 \u062f\u062e\u0646 \u0627\u0644\u0645\u0631\u064a\u0636", "\u064a\u062e\u062f\u0639 \u0627\u0644\u062f\u0645\u0627\u063a \u0628\u0648\u062c\u0648\u062f \u0646\u064a\u0643\u0648\u062a\u064a\u0646 \u0642\u0644\u064a\u0644\u060c \u0648\u064a\u063a\u0644\u0642 \u0627\u0644\u0628\u0627\u0628 \u0623\u0645\u0627\u0645 \u0627\u0644\u0646\u064a\u0643\u0648\u062a\u064a\u0646 \u0627\u0644\u062e\u0627\u0631\u062c\u064a."], ["\u0627\u0644\u062a\u062f\u062e\u064a\u0646 \u0627\u0644\u0643\u062b\u064a\u0641 \u064a\u0633\u0631\u0651\u0639 \u0639\u0645\u0644 \u0628\u0639\u0636 \u0625\u0646\u0632\u064a\u0645\u0627\u062a \u0627\u0644\u0643\u0628\u062f. \u0639\u0646\u062f \u0625\u0642\u0644\u0627\u0639 \u0627\u0644\u0645\u0631\u064a\u0636 \u0628\u0646\u062c\u0627\u062d\u060c \u0645\u0627\u0630\u0627 \u064a\u062d\u062f\u062b \u0644\u0645\u0633\u062a\u0648\u064a\u0627\u062a \u0627\u0644\u0623\u062f\u0648\u064a\u0629 \u0627\u0644\u062a\u064a \u064a\u062a\u0646\u0627\u0648\u0644\u0647\u0627 \u0645\u062b\u0644 '\u0627\u0644\u0643\u0627\u0641\u064a\u064a\u0646' \u0648'\u0627\u0644\u0643\u0644\u0648\u0632\u0627\u0628\u064a\u0646'\u061f", ["\u062a\u0642\u0644 \u0628\u0634\u0643\u0644 \u0643\u0628\u064a\u0631 \u0641\u064a \u0627\u0644\u062f\u0645", "\u062a\u0631\u062a\u0641\u0639 \u0645\u0633\u062a\u0648\u064a\u0627\u062a\u0647\u0627 \u0641\u064a \u0627\u0644\u062f\u0645 \u0648\u0642\u062f \u062a\u0635\u0644 \u0644\u0644\u0633\u0645\u064a\u0629 (Toxicity) \u0644\u0628\u0637\u0621 \u062a\u0643\u0633\u064a\u0631\u0647\u0627", "\u0644\u0627 \u062a\u062a\u0623\u062b\u0631", "\u062a\u062a\u0628\u062e\u0631"], "\u062a\u0631\u062a\u0641\u0639 \u0645\u0633\u062a\u0648\u064a\u0627\u062a\u0647\u0627 \u0641\u064a \u0627\u0644\u062f\u0645 \u0648\u0642\u062f \u062a\u0635\u0644 \u0644\u0644\u0633\u0645\u064a\u0629 (Toxicity) \u0644\u0628\u0637\u0621 \u062a\u0643\u0633\u064a\u0631\u0647\u0627", "\u0627\u0644\u062a\u062f\u062e\u064a\u0646 \u0643\u0627\u0646 \u064a\u0633\u0631\u0639 \u062d\u0631\u0642\u0647\u0627\u060c \u0627\u0644\u062a\u0648\u0642\u0641 \u0639\u0646\u0647 \u064a\u0639\u064a\u062f \u0627\u0644\u062d\u0631\u0642 \u0644\u0637\u0628\u064a\u0639\u062a\u0647 \u0627\u0644\u0628\u0637\u064a\u0626\u0629 \u0641\u062a\u0631\u062a\u0641\u0639 \u0627\u0644\u0645\u0633\u062a\u0648\u064a\u0627\u062a."], ["\u0647\u0644 \u064a\u0645\u0643\u0646 \u0644\u0644\u0645\u0631\u0623\u0629 \u0627\u0644\u062d\u0627\u0645\u0644 \u0627\u0633\u062a\u062e\u062f\u0627\u0645 \u0628\u062f\u0627\u0626\u0644 \u0627\u0644\u0646\u064a\u0643\u0648\u062a\u064a\u0646 \u0628\u0623\u0645\u0627\u0646\u061f", ["\u0622\u0645\u0646\u0629 100% \u0648\u0644\u0627 \u062a\u062d\u062a\u0627\u062c \u0627\u0633\u062a\u0634\u0627\u0631\u0629", "\u062a\u064f\u0633\u062a\u062e\u062f\u0645 \u0628\u062d\u0630\u0631 \u0634\u062f\u064a\u062f \u0648\u062a\u062d\u062a \u0625\u0634\u0631\u0627\u0641 \u0637\u0628\u064a \u0641\u0642\u0637 \u0625\u0630\u0627 \u0641\u0634\u0644\u062a \u0627\u0644\u0639\u0644\u0627\u062c\u0627\u062a \u0627\u0644\u0633\u0644\u0648\u0643\u064a\u0629 \u0648\u0643\u0627\u0646 \u062e\u0637\u0631 \u0627\u0644\u062a\u062f\u062e\u064a\u0646 \u0623\u0643\u0628\u0631", "\u0645\u0645\u0646\u0648\u0639\u0629 \u062a\u0645\u0627\u0645\u0627\u064b \u0643\u0627\u0644\u0645\u062e\u062f\u0631\u0627\u062a", "\u062a\u0633\u062a\u062e\u062f\u0645 \u0641\u0642\u0637 \u0641\u064a \u0627\u0644\u062b\u0644\u062b \u0627\u0644\u0623\u0648\u0644"], "\u062a\u064f\u0633\u062a\u062e\u062f\u0645 \u0628\u062d\u0630\u0631 \u0634\u062f\u064a\u062f \u0648\u062a\u062d\u062a \u0625\u0634\u0631\u0627\u0641 \u0637\u0628\u064a \u0641\u0642\u0637 \u0625\u0630\u0627 \u0641\u0634\u0644\u062a \u0627\u0644\u0639\u0644\u0627\u062c\u0627\u062a \u0627\u0644\u0633\u0644\u0648\u0643\u064a\u0629 \u0648\u0643\u0627\u0646 \u062e\u0637\u0631 \u0627\u0644\u062a\u062f\u062e\u064a\u0646 \u0623\u0643\u0628\u0631", "\u0644\u0623\u0646 \u0627\u0644\u0646\u064a\u0643\u0648\u062a\u064a\u0646 \u064a\u0633\u0628\u0628 \u0627\u0646\u0642\u0628\u0627\u0636 \u0627\u0644\u0623\u0648\u0639\u064a\u0629 \u0627\u0644\u062f\u0645\u0648\u064a\u0629 \u0641\u064a \u0627\u0644\u0645\u0634\u064a\u0645\u0629\u060c \u0648\u0644\u0643\u0646\u0647 \u0623\u0642\u0644 \u0636\u0631\u0631\u0627\u064b \u0645\u0646 \u0627\u0644\u0633\u064a\u062c\u0627\u0631\u0629 \u0627\u0644\u0643\u0627\u0645\u0644\u0629."], ["\u0645\u0627 \u0647\u0648 \u0627\u0644\u0639\u0631\u0636 \u0627\u0644\u062c\u0627\u0646\u0628\u064a \u0627\u0644\u0623\u0643\u062b\u0631 \u0625\u0632\u0639\u0627\u062c\u0627\u064b \u0641\u064a \u0627\u0644\u0623\u064a\u0627\u0645 \u0627\u0644\u0623\u0648\u0644\u0649 \u0644\u0627\u0633\u062a\u062e\u062f\u0627\u0645 '\u0628\u062e\u0627\u062e \u0627\u0644\u0623\u0646\u0641' \u0644\u0644\u0646\u064a\u0643\u0648\u062a\u064a\u0646 \u0648\u0627\u0644\u0630\u064a \u064a\u062c\u0628 \u062a\u062d\u0630\u064a\u0631 \u0627\u0644\u0645\u0631\u064a\u0636 \u0645\u0646\u0647\u061f", ["\u0627\u0644\u0639\u0645\u0649 \u0627\u0644\u0645\u0624\u0642\u062a", "\u062a\u0647\u064a\u062c \u0634\u062f\u064a\u062f\u060c \u062d\u0631\u0642\u0627\u0646 \u0641\u064a \u0627\u0644\u0623\u0646\u0641 \u0648\u0627\u0644\u062d\u0646\u062c\u0631\u0629\u060c \u0648\u0633\u064a\u0644\u0627\u0646 \u0627\u0644\u0639\u064a\u0646\u064a\u0646", "\u0641\u0642\u062f\u0627\u0646 \u0627\u0644\u0630\u0627\u0643\u0631\u0629", "\u062a\u0648\u0642\u0641 \u0627\u0644\u062a\u0646\u0641\u0633"], "\u062a\u0647\u064a\u062c \u0634\u062f\u064a\u062f\u060c \u062d\u0631\u0642\u0627\u0646 \u0641\u064a \u0627\u0644\u0623\u0646\u0641 \u0648\u0627\u0644\u062d\u0646\u062c\u0631\u0629\u060c \u0648\u0633\u064a\u0644\u0627\u0646 \u0627\u0644\u0639\u064a\u0646\u064a\u0646", "\u0647\u0630\u0627 \u0627\u0644\u0639\u0631\u0636 \u0645\u0632\u0639\u062c \u062c\u062f\u0627\u064b \u0648\u0644\u0643\u0646\u0647 \u064a\u0642\u0644 \u062a\u062f\u0631\u064a\u062c\u064a\u0627\u064b \u0628\u0639\u062f \u0639\u062f\u0629 \u0623\u064a\u0627\u0645 \u0645\u0646 \u0627\u0644\u0627\u0633\u062a\u062e\u062f\u0627\u0645 \u0627\u0644\u0645\u062a\u0648\u0627\u0635\u0644."], ["\u0623\u062f\u0627\u0629 \u0627\u0644\u0627\u0633\u062a\u0646\u0634\u0627\u0642 (Inhaler) \u062a\u0648\u0641\u0631 \u0645\u064a\u0632\u0629 \u0641\u0631\u064a\u062f\u0629 \u0644\u0644\u0645\u062f\u062e\u0646\u064a\u0646 \u0645\u0642\u0627\u0631\u0646\u0629 \u0628\u0628\u0627\u0642\u064a \u0627\u0644\u0628\u062f\u0627\u0626\u0644\u060c \u0645\u0627 \u0647\u064a\u061f", ["\u0623\u0646\u0647\u0627 \u0627\u0644\u0623\u0631\u062e\u0635", "\u062a\u062d\u0627\u0643\u064a \u0627\u0644\u062d\u0631\u0643\u0629 \u0627\u0644\u0633\u0644\u0648\u0643\u064a\u0629 \u0644\u0644\u064a\u062f \u0625\u0644\u0649 \u0627\u0644\u0641\u0645 (Hand-to-mouth action) \u0627\u0644\u062a\u064a \u0627\u0639\u062a\u0627\u062f \u0639\u0644\u064a\u0647\u0627 \u0627\u0644\u0645\u062f\u062e\u0646", "\u0644\u0627 \u062a\u062d\u062a\u0648\u064a \u0639\u0644\u0649 \u0646\u064a\u0643\u0648\u062a\u064a\u0646", "\u0631\u0627\u0626\u062d\u062a\u0647\u0627 \u0645\u062b\u0644 \u0627\u0644\u0641\u0631\u0627\u0648\u0644\u0629"], "\u062a\u062d\u0627\u0643\u064a \u0627\u0644\u062d\u0631\u0643\u0629 \u0627\u0644\u0633\u0644\u0648\u0643\u064a\u0629 \u0644\u0644\u064a\u062f \u0625\u0644\u0649 \u0627\u0644\u0641\u0645 (Hand-to-mouth action) \u0627\u0644\u062a\u064a \u0627\u0639\u062a\u0627\u062f \u0639\u0644\u064a\u0647\u0627 \u0627\u0644\u0645\u062f\u062e\u0646", "\u062a\u0641\u064a\u062f \u0627\u0644\u0645\u0631\u0636\u0649 \u0627\u0644\u0630\u064a\u0646 \u064a\u0641\u062a\u0642\u062f\u0648\u0646 \u0637\u0642\u0648\u0633 \u0627\u0644\u062a\u062f\u062e\u064a\u0646 \u0627\u0644\u0641\u064a\u0632\u064a\u0627\u0626\u064a\u0629."], ["\u0645\u0627 \u0647\u064a \u0627\u0644\u0645\u062f\u0629 \u0627\u0644\u0632\u0645\u0646\u064a\u0629 \u0627\u0644\u0646\u0645\u0648\u0630\u062c\u064a\u0629 \u0648\u0627\u0644\u0645\u0648\u0635\u0649 \u0628\u0647\u0627 \u0644\u0643\u0648\u0631\u0633 \u0627\u0644\u0639\u0644\u0627\u062c \u0628\u0628\u062f\u0627\u0626\u0644 \u0627\u0644\u0646\u064a\u0643\u0648\u062a\u064a\u0646 \u0644\u0636\u0645\u0627\u0646 \u0627\u0644\u0646\u062c\u0627\u062d\u061f", ["3 \u0623\u064a\u0627\u0645", "\u0645\u0646 8 \u0625\u0644\u0649 12 \u0623\u0633\u0628\u0648\u0639\u0627\u064b\u060c \u0645\u0639 \u062a\u0642\u0644\u064a\u0644 \u0627\u0644\u062c\u0631\u0639\u0629 \u062a\u062f\u0631\u064a\u062c\u064a\u0627\u064b", "\u0633\u0646\u0629 \u0643\u0627\u0645\u0644\u0629", "\u0623\u0633\u0628\u0648\u0639 \u0648\u0627\u062d\u062f"], "\u0645\u0646 8 \u0625\u0644\u0649 12 \u0623\u0633\u0628\u0648\u0639\u0627\u064b\u060c \u0645\u0639 \u062a\u0642\u0644\u064a\u0644 \u0627\u0644\u062c\u0631\u0639\u0629 \u062a\u062f\u0631\u064a\u062c\u064a\u0627\u064b", "\u0647\u0630\u0627 \u0627\u0644\u0648\u0642\u062a \u0643\u0627\u0641\u064d \u0644\u0625\u0639\u0627\u062f\u0629 \u0628\u0631\u0645\u062c\u0629 \u0627\u0644\u062f\u0645\u0627\u063a \u0648\u0627\u0644\u062a\u062e\u0644\u0635 \u0645\u0646 \u0627\u0644\u0627\u0639\u062a\u0645\u0627\u062f \u0627\u0644\u0641\u0633\u064a\u0648\u0644\u0648\u062c\u064a."], ["\u0627\u0644\u0628\u064a\u0626\u0629 \u0627\u0644\u0637\u0628\u064a\u0639\u064a\u0629 \u0644\u0644\u0645\u0647\u0628\u0644 \u0627\u0644\u0633\u0644\u064a\u0645 \u062a\u062a\u0645\u064a\u0632 \u0628\u0623\u0646\u0647\u0627\u061f", ["\u0642\u0644\u0648\u064a\u0629 \u062c\u062f\u0627\u064b", "\u062d\u0645\u0636\u064a\u0629 (Acidic) \u0644\u0644\u062d\u0645\u0627\u064a\u0629 \u0645\u0646 \u0645\u0633\u0628\u0628\u0627\u062a \u0627\u0644\u0623\u0645\u0631\u0627\u0636", "\u0645\u062a\u0639\u0627\u062f\u0644\u0629 \u062a\u0645\u0627\u0645\u0627\u064b", "\u0644\u0627 \u062a\u062d\u062a\u0648\u064a \u0639\u0644\u0649 \u0628\u0643\u062a\u064a\u0631\u064a\u0627 \u0625\u0637\u0644\u0627\u0642\u0627\u064b"], "\u062d\u0645\u0636\u064a\u0629 (Acidic) \u0644\u0644\u062d\u0645\u0627\u064a\u0629 \u0645\u0646 \u0645\u0633\u0628\u0628\u0627\u062a \u0627\u0644\u0623\u0645\u0631\u0627\u0636", "\u062a\u0641\u0631\u0632 \u0639\u0635\u064a\u0627\u062a \u0644\u0627\u0643\u062a\u0648\u0628\u0627\u0633\u064a\u0644\u0633 \u062d\u0645\u0636 \u0627\u0644\u0644\u0627\u0643\u062a\u064a\u0643 \u0644\u0644\u062d\u0641\u0627\u0638 \u0639\u0644\u0649 \u0647\u0630\u0627 \u0627\u0644\u062a\u0648\u0627\u0632\u0646."], ["\u062a\u0634\u062a\u0643\u064a \u0645\u0631\u064a\u0636\u0629 \u0645\u0646 \u0625\u0641\u0631\u0627\u0632\u0627\u062a \u0628\u064a\u0636\u0627\u0621 \u0633\u0645\u064a\u0643\u0629 \u0645\u062a\u0643\u062a\u0644\u0629 \u062a\u0634\u0628\u0647 (\u0627\u0644\u062c\u0628\u0646 \u0627\u0644\u0642\u0631\u064a\u0634) \u0645\u0639 \u062d\u0643\u0629 \u0634\u062f\u064a\u062f\u0629. \u0645\u0627 \u0647\u0648 \u0627\u0644\u062a\u0634\u062e\u064a\u0635 \u0627\u0644\u0645\u0631\u062c\u062d\u061f", ["\u0627\u0644\u062a\u0647\u0627\u0628 \u0627\u0644\u0645\u0647\u0628\u0644 \u0627\u0644\u0628\u0643\u062a\u064a\u0631\u064a (BV)", "\u0639\u062f\u0648\u0649 \u0641\u0637\u0631\u064a\u0629 / \u0627\u0644\u062e\u0645\u064a\u0631\u0629 (Thrush / Candidiasis)", "\u062f\u0627\u0621 \u0627\u0644\u0645\u0634\u0639\u0631\u0627\u062a (Trichomoniasis)", "\u0633\u064a\u0644\u0627\u0646"], "\u0639\u062f\u0648\u0649 \u0641\u0637\u0631\u064a\u0629 / \u0627\u0644\u062e\u0645\u064a\u0631\u0629 (Thrush / Candidiasis)", "\u0627\u0644\u0645\u0644\u0645\u0633 \u0627\u0644\u0645\u062a\u0643\u062a\u0644 \u0648\u0627\u0644\u062d\u0643\u0629 \u0627\u0644\u0634\u062f\u064a\u062f\u0629 \u0647\u0645\u0627 \u0627\u0644\u0639\u0644\u0627\u0645\u062a\u0627\u0646 \u0627\u0644\u0645\u0645\u064a\u0632\u062a\u0627\u0646."], ["\u0625\u0641\u0631\u0627\u0632\u0627\u062a \u0645\u0647\u0628\u0644\u064a\u0629 \u0631\u0645\u0627\u062f\u064a\u0629 \u0623\u0648 \u0628\u064a\u0636\u0627\u0621 \u0631\u0642\u064a\u0642\u0629 \u0645\u0635\u062d\u0648\u0628\u0629 \u0628\u0631\u0627\u0626\u062d\u0629 \u0643\u0631\u064a\u0647\u0629 \u0646\u0641\u0627\u0630\u0629 \u062a\u0634\u0628\u0647 (\u0631\u0627\u0626\u062d\u0629 \u0627\u0644\u0633\u0645\u0643)\u060c \u062e\u0627\u0635\u0629 \u0628\u0639\u062f \u063a\u0633\u0644 \u0627\u0644\u0645\u0646\u0637\u0642\u0629 \u0628\u0627\u0644\u0635\u0627\u0628\u0648\u0646. \u0627\u0644\u062a\u0634\u062e\u064a\u0635\u061f", ["\u0627\u0644\u062a\u0647\u0627\u0628 \u0627\u0644\u0645\u0647\u0628\u0644 \u0627\u0644\u0628\u0643\u062a\u064a\u0631\u064a (BV)", "\u0639\u062f\u0648\u0649 \u0627\u0644\u0641\u0637\u0631\u064a\u0627\u062a", "\u0625\u0641\u0631\u0627\u0632\u0627\u062a \u0637\u0628\u064a\u0639\u064a\u0629", "\u062d\u0633\u0627\u0633\u064a\u0629"], "\u0627\u0644\u062a\u0647\u0627\u0628 \u0627\u0644\u0645\u0647\u0628\u0644 \u0627\u0644\u0628\u0643\u062a\u064a\u0631\u064a (BV)", "\u0627\u0644\u0631\u0627\u0626\u062d\u0629 \u0627\u0644\u0633\u0645\u0643\u064a\u0629 \u062a\u0646\u062a\u062c \u0639\u0646 \u062a\u0637\u0627\u064a\u0631 \u0627\u0644\u0623\u0645\u064a\u0646\u0627\u062a \u0641\u064a \u0627\u0644\u0628\u064a\u0626\u0629 \u0627\u0644\u0642\u0644\u0648\u064a\u0629 (\u0645\u062b\u0644 \u0648\u0642\u062a \u0627\u0644\u063a\u0633\u064a\u0644)."], ["\u0625\u0641\u0631\u0627\u0632\u0627\u062a \u062e\u0636\u0631\u0627\u0621 \u0645\u0635\u0641\u0631\u0629\u060c \u0631\u063a\u0648\u064a\u0629 (Frothy)\u060c \u0645\u0635\u062d\u0648\u0628\u0629 \u0628\u0623\u0644\u0645 \u0623\u062b\u0646\u0627\u0621 \u0627\u0644\u062a\u0628\u0648\u0644 \u0648\u0627\u0644\u062c\u0645\u0627\u0639. \u0627\u0644\u062a\u0634\u062e\u064a\u0635 \u0627\u0644\u0645\u062d\u062a\u0645\u0644\u061f", ["\u0641\u0637\u0631\u064a\u0627\u062a", "\u062f\u0627\u0621 \u0627\u0644\u0645\u0634\u0639\u0631\u0627\u062a (Trichomoniasis)", "\u0627\u0644\u062a\u0647\u0627\u0628 \u0627\u0644\u0645\u0647\u0628\u0644 \u0627\u0644\u0628\u0643\u062a\u064a\u0631\u064a", "\u0627\u0644\u062a\u0647\u0627\u0628 \u0627\u0644\u062c\u064a\u0648\u0628"], "\u062f\u0627\u0621 \u0627\u0644\u0645\u0634\u0639\u0631\u0627\u062a (Trichomoniasis)", "\u0647\u0630\u0647 \u0639\u062f\u0648\u0649 \u0645\u0646\u0642\u0648\u0644\u0629 \u062c\u0646\u0633\u064a\u0627\u064b (STI) \u062a\u062a\u0637\u0644\u0628 \u0639\u0644\u0627\u062c \u0627\u0644\u0634\u0631\u064a\u0643\u064a\u0646."], ["\u0623\u064a \u0645\u0646 \u0627\u0644\u062d\u0627\u0644\u0627\u062a \u0627\u0644\u062b\u0644\u0627\u062b \u0627\u0644\u0633\u0627\u0628\u0642\u0629 (\u0627\u0644\u0641\u0637\u0631\u064a\u0627\u062a\u060c \u0627\u0644\u0628\u0643\u062a\u064a\u0631\u064a\u060c \u0627\u0644\u0645\u0634\u0639\u0631\u0627\u062a) \u064a\u0645\u0643\u0646 \u0644\u0644\u0635\u064a\u062f\u0644\u064a \u0639\u0644\u0627\u062c\u0647\u0627 \u0628\u0623\u062f\u0648\u064a\u0629 \u0627\u0644\u0640 OTC \u062f\u0648\u0646 \u0631\u0648\u0634\u062a\u0629 \u0637\u0628\u064a\u0629\u061f", ["\u0627\u0644\u062a\u0647\u0627\u0628 \u0627\u0644\u0645\u0647\u0628\u0644 \u0627\u0644\u0628\u0643\u062a\u064a\u0631\u064a", "\u062f\u0627\u0621 \u0627\u0644\u0645\u0634\u0639\u0631\u0627\u062a", "\u0639\u062f\u0648\u0649 \u0627\u0644\u0641\u0637\u0631\u064a\u0627\u062a (Thrush) \u0641\u0642\u0637", "\u062c\u0645\u064a\u0639\u0647\u0627"], "\u0639\u062f\u0648\u0649 \u0627\u0644\u0641\u0637\u0631\u064a\u0627\u062a (Thrush) \u0641\u0642\u0637", "\u0627\u0644\u0627\u0644\u062a\u0647\u0627\u0628\u0627\u062a \u0627\u0644\u0628\u0643\u062a\u064a\u0631\u064a\u0629 \u0648\u0627\u0644\u0645\u0646\u0642\u0648\u0644\u0629 \u062c\u0646\u0633\u064a\u0627\u064b \u062a\u062a\u0637\u0644\u0628 \u0645\u0636\u0627\u062f\u0627\u062a \u062d\u064a\u0648\u064a\u0629 \u0628\u0648\u0635\u0641\u0629 \u0637\u0628\u064a\u0629."], ["\u0633\u064a\u062f\u0629 \u062a\u0628\u0644\u063a \u0645\u0646 \u0627\u0644\u0639\u0645\u0631 60 \u0639\u0627\u0645\u0627\u064b (\u0628\u0639\u062f \u0627\u0646\u0642\u0637\u0627\u0639 \u0627\u0644\u0637\u0645\u062b) \u062a\u0634\u062a\u0643\u064a \u0645\u0646 \u0625\u0641\u0631\u0627\u0632\u0627\u062a \u0648\u062d\u0643\u0629 \u0648\u062c\u0641\u0627\u0641\u060c \u0627\u0644\u0625\u062c\u0631\u0627\u0621 \u0627\u0644\u0635\u062d\u064a\u062d \u0641\u064a \u0627\u0644\u0635\u064a\u062f\u0644\u064a\u0629\u061f", ["\u0628\u064a\u0639 \u0643\u0631\u064a\u0645 \u0641\u0644\u0648\u0643\u0648\u0646\u0627\u0632\u0648\u0644", "\u0625\u062d\u0627\u0644\u0629 \u0644\u0644\u0637\u0628\u064a\u0628 \u0644\u0644\u0627\u0634\u062a\u0628\u0627\u0647 \u0628\u0640 \u0627\u0644\u062a\u0647\u0627\u0628 \u0627\u0644\u0645\u0647\u0628\u0644 \u0627\u0644\u0636\u0645\u0648\u0631\u064a (Atrophic vaginitis) \u0623\u0648 \u0623\u0648\u0631\u0627\u0645", "\u0628\u064a\u0639 \u063a\u0633\u0648\u0644 \u0642\u0644\u0648\u064a", "\u0637\u0645\u0623\u0646\u062a\u0647\u0627 \u0628\u0623\u0646 \u0647\u0630\u0627 \u0637\u0628\u064a\u0639\u064a"], "\u0625\u062d\u0627\u0644\u0629 \u0644\u0644\u0637\u0628\u064a\u0628 \u0644\u0644\u0627\u0634\u062a\u0628\u0627\u0647 \u0628\u0640 \u0627\u0644\u062a\u0647\u0627\u0628 \u0627\u0644\u0645\u0647\u0628\u0644 \u0627\u0644\u0636\u0645\u0648\u0631\u064a (Atrophic vaginitis) \u0623\u0648 \u0623\u0648\u0631\u0627\u0645", "\u0646\u0642\u0635 \u0627\u0644\u0627\u0633\u062a\u0631\u0648\u062c\u064a\u0646 \u064a\u0633\u0628\u0628 \u062a\u0631\u0642\u0642 \u0627\u0644\u062c\u062f\u0627\u0631\u060c \u0648\u0644\u0627 \u062a\u064f\u0639\u0627\u0644\u062c \u0647\u0630\u0647 \u0627\u0644\u062d\u0627\u0644\u0627\u062a \u0628\u0640 OTC \u0641\u0643\u0631\u064a\u0627\u064b."], ["\u0644\u0645\u0627\u0630\u0627 \u063a\u0627\u0644\u0628\u0627\u064b \u0645\u0627 \u062a\u064f\u0635\u0627\u0628 \u0627\u0644\u0646\u0633\u0627\u0621 \u0628\u0639\u062f\u0648\u0649 \u0627\u0644\u0641\u0637\u0631\u064a\u0627\u062a (Thrush) \u0628\u0639\u062f \u062a\u0646\u0627\u0648\u0644 \u0643\u0648\u0631\u0633 \u0645\u0646 \u0627\u0644\u0645\u0636\u0627\u062f\u0627\u062a \u0627\u0644\u062d\u064a\u0648\u064a\u0629 \u0648\u0627\u0633\u0639\u0629 \u0627\u0644\u0637\u064a\u0641\u061f", ["\u0644\u0623\u0646 \u0627\u0644\u0645\u0636\u0627\u062f \u064a\u062d\u062a\u0648\u064a \u0639\u0644\u0649 \u0633\u0643\u0631", "\u0644\u0623\u0646 \u0627\u0644\u0645\u0636\u0627\u062f \u0627\u0644\u062d\u064a\u0648\u064a \u064a\u0642\u062a\u0644 \u0627\u0644\u0628\u0643\u062a\u064a\u0631\u064a\u0627 \u0627\u0644\u0646\u0627\u0641\u0639\u0629 (Lactobacilli) \u0627\u0644\u062a\u064a \u062a\u0645\u0646\u0639 \u0646\u0645\u0648 \u0627\u0644\u0641\u0637\u0631\u064a\u0627\u062a", "\u0644\u0623\u0646 \u0627\u0644\u0645\u0636\u0627\u062f \u064a\u0631\u0641\u0639 \u062d\u0631\u0627\u0631\u0629 \u0627\u0644\u062c\u0633\u0645", "\u0644\u0623\u0646 \u0627\u0644\u0645\u0636\u0627\u062f \u064a\u0646\u0642\u0644 \u0627\u0644\u0639\u062f\u0648\u0649"], "\u0644\u0623\u0646 \u0627\u0644\u0645\u0636\u0627\u062f \u0627\u0644\u062d\u064a\u0648\u064a \u064a\u0642\u062a\u0644 \u0627\u0644\u0628\u0643\u062a\u064a\u0631\u064a\u0627 \u0627\u0644\u0646\u0627\u0641\u0639\u0629 (Lactobacilli) \u0627\u0644\u062a\u064a \u062a\u0645\u0646\u0639 \u0646\u0645\u0648 \u0627\u0644\u0641\u0637\u0631\u064a\u0627\u062a", "\u064a\u064f\u0641\u0642\u062f \u0627\u0644\u062a\u0648\u0627\u0632\u0646 \u0627\u0644\u0645\u064a\u0643\u0631\u0648\u0628\u064a \u0641\u064a \u0627\u0644\u0645\u0647\u0628\u0644."], ["\u0643\u064a\u0641 \u062a\u062a\u0641\u0627\u0639\u0644 \u0643\u0628\u0633\u0648\u0644\u0629 \u0627\u0644\u0641\u0644\u0648\u0643\u0648\u0646\u0627\u0632\u0648\u0644 \u0627\u0644\u0641\u0645\u0648\u064a\u0629 (Fluconazole) \u0627\u0644\u062a\u064a \u062a\u0628\u0627\u0639 \u0644\u0644\u0641\u0637\u0631\u064a\u0627\u062a \u0645\u0639 \u0627\u0644\u0623\u062f\u0648\u064a\u0629 \u0627\u0644\u0623\u062e\u0631\u0649\u060c \u0645\u062b\u0644 \u0623\u062f\u0648\u064a\u0629 \u0627\u0644\u0643\u0648\u0644\u064a\u0633\u062a\u0631\u0648\u0644 (Statins) \u0648\u0627\u0644\u0648\u0627\u0631\u0641\u0627\u0631\u064a\u0646\u061f", ["\u0644\u0627 \u062a\u062a\u0641\u0627\u0639\u0644 \u0623\u0628\u062f\u0627\u064b", "\u062a\u064f\u062b\u0628\u0637 \u0625\u0646\u0632\u064a\u0645\u0627\u062a \u0627\u0644\u0643\u0628\u062f (CYP450) \u0648\u062a\u0631\u0641\u0639 \u0645\u0633\u062a\u0648\u064a\u0627\u062a \u0647\u0630\u0647 \u0627\u0644\u0623\u062f\u0648\u064a\u0629 \u0644\u062d\u062f \u0627\u0644\u0633\u0645\u064a\u0629 (Toxicity)", "\u062a\u0628\u0637\u0644 \u0645\u0641\u0639\u0648\u0644\u0647\u0627 \u062a\u0645\u0627\u0645\u0627\u064b", "\u062a\u0633\u0628\u0628 \u062a\u0643\u0633\u0631\u0647\u0627 \u0627\u0644\u0633\u0631\u064a\u0639"], "\u062a\u064f\u062b\u0628\u0637 \u0625\u0646\u0632\u064a\u0645\u0627\u062a \u0627\u0644\u0643\u0628\u062f (CYP450) \u0648\u062a\u0631\u0641\u0639 \u0645\u0633\u062a\u0648\u064a\u0627\u062a \u0647\u0630\u0647 \u0627\u0644\u0623\u062f\u0648\u064a\u0629 \u0644\u062d\u062f \u0627\u0644\u0633\u0645\u064a\u0629 (Toxicity)", "\u064a\u062c\u0628 \u0627\u0644\u062d\u0630\u0631 \u0648\u0645\u0631\u0627\u062c\u0639\u0629 \u0627\u0644\u0623\u062f\u0648\u064a\u0629 \u0627\u0644\u0645\u0632\u0645\u0646\u0629 \u0644\u0644\u0645\u0631\u064a\u0636\u0629 \u0642\u0628\u0644 \u0648\u0635\u0641 \u0627\u0644\u0641\u0644\u0648\u0643\u0648\u0646\u0627\u0632\u0648\u0644."], ["\u0647\u0644 \u064a\u064f\u0633\u0645\u062d \u0644\u0644\u062d\u0627\u0645\u0644 \u0627\u0644\u062a\u064a \u062a\u0639\u0627\u0646\u064a \u0645\u0646 \u0639\u062f\u0648\u0649 \u0627\u0644\u0641\u0637\u0631\u064a\u0627\u062a \u0628\u062a\u0646\u0627\u0648\u0644 \u0643\u0628\u0633\u0648\u0644\u0629 \u0641\u0644\u0648\u0643\u0648\u0646\u0627\u0632\u0648\u0644 \u0627\u0644\u0641\u0645\u0648\u064a\u0629 (Fluconazole 150mg)\u061f", ["\u0646\u0639\u0645\u060c \u0647\u064a \u0622\u0645\u0646\u0629 \u062c\u062f\u0627\u064b", "\u0644\u0627\u060c \u064a\u064f\u0645\u0646\u0639 \u062a\u0645\u0627\u0645\u0627\u064b \u0644\u062e\u0637\u0631\u0647\u0627 \u0627\u0644\u062c\u0647\u0627\u0632\u064a \u0639\u0644\u0649 \u0627\u0644\u062c\u0646\u064a\u0646\u060c \u0648\u064a\u064f\u0641\u0636\u0644 \u0627\u0644\u0639\u0644\u0627\u062c \u0627\u0644\u0645\u0648\u0636\u0639\u064a \u062a\u062d\u062a \u0625\u0634\u0631\u0627\u0641 \u0637\u0628\u064a", "\u0646\u0639\u0645\u060c \u0648\u0644\u0643\u0646 \u0646\u0635\u0641 \u0627\u0644\u062c\u0631\u0639\u0629", "\u0646\u0639\u0645\u060c \u0641\u064a \u0627\u0644\u0634\u0647\u0631 \u0627\u0644\u062a\u0627\u0633\u0639 \u0641\u0642\u0637"], "\u0644\u0627\u060c \u064a\u064f\u0645\u0646\u0639 \u062a\u0645\u0627\u0645\u0627\u064b \u0644\u062e\u0637\u0631\u0647\u0627 \u0627\u0644\u062c\u0647\u0627\u0632\u064a \u0639\u0644\u0649 \u0627\u0644\u062c\u0646\u064a\u0646\u060c \u0648\u064a\u064f\u0641\u0636\u0644 \u0627\u0644\u0639\u0644\u0627\u062c \u0627\u0644\u0645\u0648\u0636\u0639\u064a \u062a\u062d\u062a \u0625\u0634\u0631\u0627\u0641 \u0637\u0628\u064a", "\u0627\u0644\u0627\u0645\u062a\u0635\u0627\u0635 \u0627\u0644\u062c\u0647\u0627\u0632\u064a \u0644\u0645\u0636\u0627\u062f\u0627\u062a \u0627\u0644\u0641\u0637\u0631\u064a\u0627\u062a \u064a\u0645\u062b\u0644 \u062e\u0637\u0631\u0627\u064b."], ["\u0645\u0631\u064a\u0636\u0629 \u062a\u0623\u062a\u064a \u0644\u0644\u0635\u064a\u062f\u0644\u064a\u0629 \u062a\u0634\u062a\u0643\u064a \u0645\u0646 \u0625\u0641\u0631\u0627\u0632\u0627\u062a \u0648\u062d\u0643\u0629 \u0644\u0623\u0648\u0644 \u0645\u0631\u0629 \u0641\u064a \u062d\u064a\u0627\u062a\u0647\u0627 (First-time presentation)\u060c \u0627\u0644\u0625\u062c\u0631\u0627\u0621\u061f", ["\u0628\u064a\u0639 \u0643\u0628\u0633\u0648\u0644\u0629 \u0648\u0643\u0631\u064a\u0645", "\u0625\u062d\u0627\u0644\u0629 \u0644\u0644\u0637\u0628\u064a\u0628 \u0644\u0644\u062d\u0635\u0648\u0644 \u0639\u0644\u0649 \u062a\u0634\u062e\u064a\u0635 \u062f\u0642\u064a\u0642 \u0645\u0624\u0643\u062f", "\u0646\u0635\u062d\u0647\u0627 \u0628\u062a\u062c\u0627\u0647\u0644 \u0627\u0644\u0623\u0645\u0631", "\u063a\u0633\u0644 \u0627\u0644\u0645\u0646\u0637\u0642\u0629 \u0628\u0645\u0627\u0621 \u0633\u0627\u062e\u0646"], "\u0625\u062d\u0627\u0644\u0629 \u0644\u0644\u0637\u0628\u064a\u0628 \u0644\u0644\u062d\u0635\u0648\u0644 \u0639\u0644\u0649 \u062a\u0634\u062e\u064a\u0635 \u062f\u0642\u064a\u0642 \u0645\u0624\u0643\u062f", "\u0644\u0627 \u064a\u0645\u0643\u0646 \u0644\u0644\u0635\u064a\u062f\u0644\u064a \u062a\u0634\u062e\u064a\u0635 \u0627\u0644\u0641\u0637\u0631\u064a\u0627\u062a \u0648\u0635\u0631\u0641 \u0627\u0644\u062f\u0648\u0627\u0621 \u0641\u064a \u0627\u0644\u062d\u0644\u0642\u0629 \u0627\u0644\u0623\u0648\u0644\u0649 (First episode)."], ["\u0638\u0647\u0648\u0631 \u0625\u0641\u0631\u0627\u0632\u0627\u062a \u0645\u062f\u0645\u0645\u0629 (Blood-stained) \u0623\u0648 \u0646\u0632\u064a\u0641 \u063a\u064a\u0631 \u0645\u0646\u062a\u0638\u0645 \u0628\u064a\u0646 \u0641\u062a\u0631\u0627\u062a \u0627\u0644\u062f\u0648\u0631\u0629 \u0627\u0644\u0634\u0647\u0631\u064a\u0629 \u064a\u064f\u0639\u062a\u0628\u0631\u061f", ["\u0623\u0645\u0631 \u0637\u0628\u064a\u0639\u064a \u0628\u0633\u0628\u0628 \u0627\u0644\u062a\u0648\u062a\u0631", "\u0639\u0644\u0627\u0645\u0629 \u062e\u0637\u0631 \u062d\u0645\u0631\u0627\u0621 (Red Flag) \u062a\u0633\u062a\u062f\u0639\u064a \u0627\u0644\u0625\u062d\u0627\u0644\u0629 \u0627\u0644\u0641\u0648\u0631\u064a\u0629 \u0644\u0627\u0633\u062a\u0628\u0639\u0627\u062f \u0623\u0648\u0631\u0627\u0645 \u0639\u0646\u0642 \u0627\u0644\u0631\u062d\u0645 \u0623\u0648 \u0627\u0644\u062a\u0647\u0627\u0628\u0627\u062a \u0627\u0644\u062d\u0648\u0636", "\u0639\u0644\u0627\u0645\u0629 \u0639\u0644\u0649 \u0627\u0644\u0641\u0637\u0631\u064a\u0627\u062a", "\u0628\u0633\u0628\u0628 \u062a\u0646\u0627\u0648\u0644 \u0627\u0644\u0623\u0644\u064a\u0627\u0641"], "\u0639\u0644\u0627\u0645\u0629 \u062e\u0637\u0631 \u062d\u0645\u0631\u0627\u0621 (Red Flag) \u062a\u0633\u062a\u062f\u0639\u064a \u0627\u0644\u0625\u062d\u0627\u0644\u0629 \u0627\u0644\u0641\u0648\u0631\u064a\u0629 \u0644\u0627\u0633\u062a\u0628\u0639\u0627\u062f \u0623\u0648\u0631\u0627\u0645 \u0639\u0646\u0642 \u0627\u0644\u0631\u062d\u0645 \u0623\u0648 \u0627\u0644\u062a\u0647\u0627\u0628\u0627\u062a \u0627\u0644\u062d\u0648\u0636", "\u0623\u064a \u062f\u0645\u0627\u0621 \u063a\u064a\u0631 \u0645\u0628\u0631\u0631\u0629 \u0641\u064a \u0627\u0644\u0645\u0646\u0637\u0642\u0629 \u0627\u0644\u062a\u0646\u0627\u0633\u0644\u064a\u0629 \u0647\u064a \u0639\u0644\u0627\u0645\u0629 \u062e\u0637\u0631 \u0642\u0635\u0648\u0649."], ["\u0644\u0645\u0627\u0630\u0627 \u064a\u064f\u0646\u0635\u062d \u0628\u0648\u0636\u0639 \u0627\u0644\u062a\u062d\u0627\u0645\u064a\u0644 \u0627\u0644\u0645\u0647\u0628\u0644\u064a\u0629 (Pessaries) \u0627\u0644\u062e\u0627\u0635\u0629 \u0628\u0639\u0644\u0627\u062c \u0627\u0644\u0641\u0637\u0631\u064a\u0627\u062a \u0644\u064a\u0644\u0627\u064b \u0642\u0628\u0644 \u0627\u0644\u0646\u0648\u0645\u061f", ["\u0644\u0623\u0646 \u0627\u0644\u0641\u0637\u0631\u064a\u0627\u062a \u062a\u0646\u0634\u0637 \u0644\u064a\u0644\u0627\u064b \u0641\u0642\u0637", "\u0644\u0636\u0645\u0627\u0646 \u0628\u0642\u0627\u0621 \u0627\u0644\u062f\u0648\u0627\u0621 \u0641\u062a\u0631\u0629 \u0623\u0637\u0648\u0644 \u0641\u064a \u0627\u0644\u0645\u0647\u0628\u0644 \u0628\u0641\u0639\u0644 \u0627\u0644\u062c\u0627\u0630\u0628\u064a\u0629 (\u0627\u0644\u0627\u0633\u062a\u0644\u0642\u0627\u0621) \u0648\u062a\u0642\u0644\u064a\u0644 \u062a\u0633\u0631\u0628\u0647", "\u0644\u0623\u0646\u0647\u0627 \u062a\u0633\u0628\u0628 \u0627\u0644\u0646\u0639\u0627\u0633 \u0627\u0644\u0634\u062f\u064a\u062f", "\u0644\u0623\u0646\u0647\u0627 \u062a\u062a\u0641\u0627\u0639\u0644 \u0645\u0639 \u0636\u0648\u0621 \u0627\u0644\u0634\u0645\u0633"], "\u0644\u0636\u0645\u0627\u0646 \u0628\u0642\u0627\u0621 \u0627\u0644\u062f\u0648\u0627\u0621 \u0641\u062a\u0631\u0629 \u0623\u0637\u0648\u0644 \u0641\u064a \u0627\u0644\u0645\u0647\u0628\u0644 \u0628\u0641\u0639\u0644 \u0627\u0644\u062c\u0627\u0630\u0628\u064a\u0629 (\u0627\u0644\u0627\u0633\u062a\u0644\u0642\u0627\u0621) \u0648\u062a\u0642\u0644\u064a\u0644 \u062a\u0633\u0631\u0628\u0647", "\u0627\u0644\u062d\u0631\u0643\u0629 \u0648\u0627\u0644\u0648\u0642\u0648\u0641 \u064a\u062a\u0633\u0628\u0628\u0627\u0646 \u0641\u064a \u062e\u0631\u0648\u062c \u0627\u0644\u062f\u0648\u0627\u0621 \u0642\u0628\u0644 \u0627\u0644\u0627\u0633\u062a\u0641\u0627\u062f\u0629 \u0645\u0646\u0647."], ["\u0643\u0631\u064a\u0645\u0627\u062a \u0648\u062a\u062d\u0627\u0645\u064a\u0644 \u0645\u0636\u0627\u062f\u0627\u062a \u0627\u0644\u0641\u0637\u0631\u064a\u0627\u062a \u0627\u0644\u0645\u0648\u0636\u0639\u064a\u0629 (\u0645\u062b\u0644 Clotrimazole) \u0644\u0647\u0627 \u062a\u0623\u062b\u064a\u0631 \u0633\u0644\u0628\u064a \u0645\u0647\u0645 \u0639\u0644\u0649 \u0648\u0633\u0627\u0626\u0644 \u0645\u0646\u0639 \u0627\u0644\u062d\u0645\u0644\u060c \u0645\u0627 \u0647\u0648\u061f", ["\u062a\u0633\u0628\u0628 \u062d\u0645\u0644 \u0627\u0644\u062a\u0648\u0627\u0626\u0645", "\u0627\u0644\u0632\u064a\u0648\u062a \u0627\u0644\u0645\u0648\u062c\u0648\u062f\u0629 \u0641\u064a \u0642\u0627\u0639\u062f\u0629 \u0627\u0644\u0643\u0631\u064a\u0645 \u062a\u0636\u0639\u0641 \u0648\u062a\u0645\u0632\u0642 \u0627\u0644\u0648\u0627\u0642\u064a \u0627\u0644\u0630\u0643\u0631\u064a \u0627\u0644\u0645\u0637\u0627\u0637\u064a (Latex Condoms)", "\u062a\u0645\u0646\u0639 \u0639\u0645\u0644 \u062d\u0628\u0648\u0628 \u0645\u0646\u0639 \u0627\u0644\u062d\u0645\u0644 \u0627\u0644\u0641\u0645\u0648\u064a\u0629", "\u062a\u062c\u0639\u0644 \u0627\u0644\u0648\u0627\u0642\u064a \u0627\u0644\u0630\u0643\u0631\u064a \u0623\u0635\u0644\u0628"], "\u0627\u0644\u0632\u064a\u0648\u062a \u0627\u0644\u0645\u0648\u062c\u0648\u062f\u0629 \u0641\u064a \u0642\u0627\u0639\u062f\u0629 \u0627\u0644\u0643\u0631\u064a\u0645 \u062a\u0636\u0639\u0641 \u0648\u062a\u0645\u0632\u0642 \u0627\u0644\u0648\u0627\u0642\u064a \u0627\u0644\u0630\u0643\u0631\u064a \u0627\u0644\u0645\u0637\u0627\u0637\u064a (Latex Condoms)", "\u064a\u062c\u0628 \u062a\u062d\u0630\u064a\u0631 \u0627\u0644\u0632\u0648\u062c\u064a\u0646 \u0645\u0646 \u0647\u0630\u0627 \u0627\u0644\u062e\u0637\u0631 \u0644\u0645\u0646\u0639 \u0627\u0644\u062d\u0645\u0644 \u063a\u064a\u0631 \u0627\u0644\u0645\u062e\u0637\u0637 \u0644\u0647."], ["\u062f\u0648\u0627\u0621 \u0645\u064a\u062a\u0631\u0648\u0646\u064a\u062f\u0627\u0632\u0648\u0644 (Metronidazole) \u0627\u0644\u0645\u0633\u062a\u062e\u062f\u0645 \u0644\u0639\u0644\u0627\u062c \u0627\u0644\u062a\u0647\u0627\u0628 \u0627\u0644\u0645\u0647\u0628\u0644 \u0627\u0644\u0628\u0643\u062a\u064a\u0631\u064a (BV)\u060c \u0644\u0647 \u062a\u062f\u0627\u062e\u0644 \u062f\u0648\u0627\u0626\u064a \u0639\u0646\u064a\u0641 \u064a\u0624\u062f\u064a \u0625\u0644\u0649 \u0642\u064a\u0621 \u0634\u062f\u064a\u062f \u0648\u062e\u0641\u0642\u0627\u0646 \u0645\u0639\u061f", ["\u0627\u0644\u062d\u0644\u064a\u0628", "\u0627\u0644\u0643\u062d\u0648\u0644\u064a\u0627\u062a (\u062a\u0641\u0627\u0639\u0644 \u0634\u0628\u064a\u0647 \u0628\u0627\u0644\u062f\u064a\u0633\u0644\u0641\u064a\u0631\u0627\u0645 Disulfiram-like reaction)", "\u0639\u0635\u064a\u0631 \u0627\u0644\u062c\u0631\u064a\u0628 \u0641\u0631\u0648\u062a", "\u0627\u0644\u0628\u0646\u0627\u062f\u0648\u0644"], "\u0627\u0644\u0643\u062d\u0648\u0644\u064a\u0627\u062a (\u062a\u0641\u0627\u0639\u0644 \u0634\u0628\u064a\u0647 \u0628\u0627\u0644\u062f\u064a\u0633\u0644\u0641\u064a\u0631\u0627\u0645 Disulfiram-like reaction)", "\u064a\u062c\u0628 \u0627\u0644\u0627\u0645\u062a\u0646\u0627\u0639 \u0639\u0646 \u0623\u064a \u0643\u062d\u0648\u0644 \u0637\u0648\u0627\u0644 \u0641\u062a\u0631\u0629 \u0627\u0644\u0639\u0644\u0627\u062c \u0648\u062d\u062a\u0649 \u0628\u0639\u062f\u0647 \u0628\u064a\u0648\u0645\u064a\u0646."], ["\u0645\u0627 \u0647\u0648 \u0627\u0644\u0631\u0623\u064a \u0627\u0644\u0639\u0644\u0645\u064a \u0627\u0644\u0645\u0639\u062a\u0645\u062f \u0644\u0644\u0648\u0642\u0627\u064a\u0629 \u0628\u0634\u0623\u0646 \u0645\u0645\u0627\u0631\u0633\u0629 '\u0627\u0644\u062f\u0634 \u0627\u0644\u0645\u0647\u0628\u0644\u064a' (Vaginal Douching) \u0644\u062a\u0646\u0638\u064a\u0641 \u0627\u0644\u0645\u0647\u0628\u0644 \u0645\u0646 \u0627\u0644\u062f\u0627\u062e\u0644\u061f", ["\u0645\u0641\u064a\u062f \u062c\u062f\u0627\u064b \u064a\u0648\u0645\u064a\u0627\u064b", "\u0636\u0627\u0631 \u062c\u062f\u0627\u064b\u061b \u0644\u0623\u0646\u0647 \u064a\u063a\u0633\u0644 \u0648\u064a\u0642\u062a\u0644 \u0627\u0644\u0628\u0643\u062a\u064a\u0631\u064a\u0627 \u0627\u0644\u0646\u0627\u0641\u0639\u0629 \u0648\u064a\u062e\u0644 \u0628\u062f\u0631\u062c\u0629 \u0627\u0644\u0640 pH \u0645\u0645\u0627 \u064a\u0645\u0647\u062f \u0644\u0644\u0627\u0644\u062a\u0647\u0627\u0628\u0627\u062a", "\u0645\u0641\u064a\u062f \u0628\u0639\u062f \u0627\u0644\u062f\u0648\u0631\u0629 \u0627\u0644\u0634\u0647\u0631\u064a\u0629 \u0641\u0642\u0637", "\u064a\u062c\u0628 \u0627\u0633\u062a\u062e\u062f\u0627\u0645\u0647 \u0645\u0639 \u0627\u0644\u0635\u0627\u0628\u0648\u0646 \u0627\u0644\u0642\u0644\u0648\u064a"], "\u0636\u0627\u0631 \u062c\u062f\u0627\u064b\u061b \u0644\u0623\u0646\u0647 \u064a\u063a\u0633\u0644 \u0648\u064a\u0642\u062a\u0644 \u0627\u0644\u0628\u0643\u062a\u064a\u0631\u064a\u0627 \u0627\u0644\u0646\u0627\u0641\u0639\u0629 \u0648\u064a\u062e\u0644 \u0628\u062f\u0631\u062c\u0629 \u0627\u0644\u0640 pH \u0645\u0645\u0627 \u064a\u0645\u0647\u062f \u0644\u0644\u0627\u0644\u062a\u0647\u0627\u0628\u0627\u062a", "\u0627\u0644\u0645\u0647\u0628\u0644 \u064a\u0646\u0638\u0641 \u0646\u0641\u0633\u0647 \u0630\u0627\u062a\u064a\u0627\u064b \u0648\u0644\u0627 \u064a\u062d\u062a\u0627\u062c \u0625\u0644\u0649 \u063a\u0633\u064a\u0644 \u062f\u0627\u062e\u0644\u064a."], ["\u0645\u0627 \u0647\u0648 \u062f\u0648\u0627\u0621 \u0627\u0644\u062c\u064a\u0644 \u0627\u0644\u0623\u0648\u0644 \u0627\u0644\u0645\u0636\u0627\u062f \u0644\u0644\u0647\u064a\u0633\u062a\u0627\u0645\u064a\u0646 (H1-antagonist) \u0627\u0644\u0630\u064a \u064a\u0628\u0627\u0639 \u0643\u0645\u0646\u0648\u0645 OTC \u0642\u0635\u064a\u0631 \u0627\u0644\u0645\u062f\u0649\u061f", ["\u0644\u0648\u0631\u0627\u062a\u0627\u062f\u064a\u0646", "\u0633\u064a\u062a\u0631\u064a\u0632\u064a\u0646", "\u062f\u0627\u064a\u0641\u064a\u0646\u0647\u064a\u062f\u0631\u0627\u0645\u064a\u0646 (Diphenhydramine)", "\u0628\u0627\u0631\u0627\u0633\u064a\u062a\u0627\u0645\u0648\u0644"], "\u062f\u0627\u064a\u0641\u064a\u0646\u0647\u064a\u062f\u0631\u0627\u0645\u064a\u0646 (Diphenhydramine)", "\u064a\u0639\u0628\u0631 \u062d\u0627\u062c\u0632 \u0627\u0644\u062f\u0645\u0627\u063a \u0648\u064a\u0633\u0628\u0628 \u0627\u0644\u0646\u0639\u0627\u0633 \u0627\u0644\u0642\u0648\u064a."], ["\u0644\u0645\u0627\u0630\u0627 \u064a\u064f\u0639\u062a\u0628\u0631 \u0627\u0644\u062f\u0627\u064a\u0641\u064a\u0646\u0647\u064a\u062f\u0631\u0627\u0645\u064a\u0646 \u062e\u0637\u064a\u0631\u0627\u064b \u0648\u0645\u0645\u0646\u0648\u0639\u0627\u064b \u0641\u064a \u0643\u0628\u0627\u0631 \u0627\u0644\u0633\u0646 (Beers Criteria)\u061f", ["\u064a\u0633\u0628\u0628 \u0627\u0644\u0623\u0631\u0642 \u0641\u0642\u0637", "\u062e\u0635\u0627\u0626\u0635\u0647 \u0627\u0644\u0642\u0648\u064a\u0629 \u0627\u0644\u0645\u0636\u0627\u062f\u0629 \u0644\u0644\u0643\u0648\u0644\u064a\u0646 \u062a\u0633\u0628\u0628 \u0627\u0631\u062a\u0628\u0627\u0643\u0627\u064b \u0634\u062f\u064a\u062f\u0627\u064b\u060c \u062c\u0641\u0627\u0641\u0627\u064b\u060c \u062e\u0637\u0631 \u0627\u0644\u0633\u0642\u0648\u0637\u060c \u0648\u0627\u062d\u062a\u0628\u0627\u0633 \u0627\u0644\u0628\u0648\u0644", "\u064a\u0631\u0641\u0639 \u0627\u0644\u0636\u063a\u0637", "\u064a\u0633\u0628\u0628 \u0625\u0633\u0647\u0627\u0644 \u0634\u062f\u064a\u062f"], "\u062e\u0635\u0627\u0626\u0635\u0647 \u0627\u0644\u0642\u0648\u064a\u0629 \u0627\u0644\u0645\u0636\u0627\u062f\u0629 \u0644\u0644\u0643\u0648\u0644\u064a\u0646 \u062a\u0633\u0628\u0628 \u0627\u0631\u062a\u0628\u0627\u0643\u0627\u064b \u0634\u062f\u064a\u062f\u0627\u064b\u060c \u062c\u0641\u0627\u0641\u0627\u064b\u060c \u062e\u0637\u0631 \u0627\u0644\u0633\u0642\u0648\u0637\u060c \u0648\u0627\u062d\u062a\u0628\u0627\u0633 \u0627\u0644\u0628\u0648\u0644", "\u0643\u0628\u0627\u0631 \u0627\u0644\u0633\u0646 \u062d\u0633\u0627\u0633\u0648\u0646 \u062c\u062f\u0627\u064b \u0644\u0647\u0630\u0647 \u0627\u0644\u0622\u062b\u0627\u0631 \u0627\u0644\u062c\u0627\u0646\u0628\u064a\u0629."], ["\u0645\u0627 \u0647\u0648 \u0627\u0644\u0639\u0644\u0627\u062c \u0627\u0644\u0630\u0647\u0628\u064a \u0648\u0627\u0644\u0623\u0633\u0627\u0633\u064a (\u063a\u064a\u0631 \u0627\u0644\u062f\u0648\u0627\u0626\u064a) \u0644\u0639\u0644\u0627\u062c \u0627\u0644\u0623\u0631\u0642 \u0627\u0644\u0645\u0632\u0645\u0646 \u0648\u0625\u0639\u0627\u062f\u0629 \u0628\u0631\u0645\u062c\u0629 \u0627\u0644\u062f\u0645\u0627\u063a\u061f", ["\u0627\u0644\u0639\u0644\u0627\u062c \u0627\u0644\u0645\u0639\u0631\u0641\u064a \u0627\u0644\u0633\u0644\u0648\u0643\u064a \u0644\u0644\u0623\u0631\u0642 (CBT-I)", "\u0634\u0631\u0628 \u0627\u0644\u062d\u0644\u064a\u0628 \u0627\u0644\u062f\u0627\u0641\u0626", "\u0627\u0644\u062a\u0646\u0648\u064a\u0645 \u0627\u0644\u0645\u063a\u0646\u0627\u0637\u064a\u0633\u064a", "\u0627\u0644\u0643\u064a \u0628\u0627\u0644\u0646\u0627\u0631"], "\u0627\u0644\u0639\u0644\u0627\u062c \u0627\u0644\u0645\u0639\u0631\u0641\u064a \u0627\u0644\u0633\u0644\u0648\u0643\u064a \u0644\u0644\u0623\u0631\u0642 (CBT-I)", "\u064a\u0639\u0627\u0644\u062c \u062c\u0630\u0648\u0631 \u0627\u0644\u0645\u0634\u0643\u0644\u0629 \u0648\u064a\u0631\u0628\u0637 \u0627\u0644\u0633\u0631\u064a\u0631 \u0628\u0627\u0644\u0646\u0648\u0645 \u0641\u0642\u0637 \u0648\u0644\u064a\u0633 \u0628\u0627\u0644\u062a\u0641\u0643\u064a\u0631 \u0648\u0627\u0644\u0642\u0644\u0642."], ["\u0638\u0627\u0647\u0631\u0629 '\u0627\u0644\u0627\u0633\u062a\u062b\u0627\u0631\u0629 \u0627\u0644\u062a\u0646\u0627\u0642\u0636\u064a\u0629' (Paradoxical excitation) \u0639\u0646\u062f \u0625\u0639\u0637\u0627\u0621 \u0627\u0644\u062f\u0627\u064a\u0641\u064a\u0646\u0647\u064a\u062f\u0631\u0627\u0645\u064a\u0646 \u0644\u0628\u0639\u0636 \u0627\u0644\u0623\u0637\u0641\u0627\u0644 \u062a\u0639\u0646\u064a\u061f", ["\u0627\u0644\u0646\u0648\u0645 \u0644\u0645\u062f\u0629 \u064a\u0648\u0645\u064a\u0646 \u0645\u062a\u0648\u0627\u0635\u0644\u064a\u0646", "\u0628\u062f\u0644\u0627\u064b \u0645\u0646 \u0623\u0646 \u064a\u0646\u0627\u0645 \u0627\u0644\u0637\u0641\u0644\u060c \u064a\u0635\u0628\u062d \u0645\u0641\u0631\u0637 \u0627\u0644\u0646\u0634\u0627\u0637\u060c \u0648\u0645\u062a\u0647\u064a\u062c\u0627\u064b\u060c \u0648\u0639\u0635\u0628\u064a\u0627\u064b \u062c\u062f\u0627\u064b", "\u064a\u0641\u0642\u062f \u062d\u0627\u0633\u0629 \u0627\u0644\u0634\u0645", "\u064a\u0635\u0627\u0628 \u0628\u0627\u0644\u0634\u0644\u0644"], "\u0628\u062f\u0644\u0627\u064b \u0645\u0646 \u0623\u0646 \u064a\u0646\u0627\u0645 \u0627\u0644\u0637\u0641\u0644\u060c \u064a\u0635\u0628\u062d \u0645\u0641\u0631\u0637 \u0627\u0644\u0646\u0634\u0627\u0637\u060c \u0648\u0645\u062a\u0647\u064a\u062c\u0627\u064b\u060c \u0648\u0639\u0635\u0628\u064a\u0627\u064b \u062c\u062f\u0627\u064b", "\u0647\u0630\u0627 \u062a\u0641\u0627\u0639\u0644 \u0639\u0643\u0633\u064a \u0645\u0639\u0631\u0648\u0641 \u064a\u0645\u0646\u0639 \u0627\u0633\u062a\u062e\u062f\u0627\u0645\u0647 \u0644\u062a\u0646\u0648\u064a\u0645 \u0627\u0644\u0623\u0637\u0641\u0627\u0644 \u0644\u0644\u0631\u0627\u062d\u0629."], ["\u0647\u0631\u0645\u0648\u0646 \u0627\u0644\u0645\u064a\u0644\u0627\u062a\u0648\u0646\u064a\u0646 (Melatonin) \u064a\u0643\u0648\u0646 \u0645\u0641\u064a\u062f\u0627\u064b \u062c\u062f\u0627\u064b \u0648\u0641\u0639\u0627\u0644\u0627\u064b \u0641\u064a \u0623\u064a \u0646\u0648\u0639 \u0645\u0646 \u0627\u0636\u0637\u0631\u0627\u0628\u0627\u062a \u0627\u0644\u0646\u0648\u0645\u061f", ["\u0623\u0631\u0642 \u0627\u0644\u0623\u0644\u0645 \u0627\u0644\u0639\u0636\u0644\u064a", "\u0627\u0636\u0637\u0631\u0627\u0628\u0627\u062a \u0627\u0644\u0633\u0627\u0639\u0629 \u0627\u0644\u0628\u064a\u0648\u0644\u0648\u062c\u064a\u0629 (\u0645\u062b\u0644 Jet Lag \u0648\u0627\u062e\u062a\u0644\u0627\u0641 \u0646\u0648\u0628\u0627\u062a \u0627\u0644\u0639\u0645\u0644)", "\u0623\u0631\u0642 \u0627\u0644\u062c\u0648\u0639", "\u0627\u0646\u0642\u0637\u0627\u0639 \u0627\u0644\u0646\u0641\u0633 \u0627\u0644\u0627\u0646\u0633\u062f\u0627\u062f\u064a"], "\u0627\u0636\u0637\u0631\u0627\u0628\u0627\u062a \u0627\u0644\u0633\u0627\u0639\u0629 \u0627\u0644\u0628\u064a\u0648\u0644\u0648\u062c\u064a\u0629 (\u0645\u062b\u0644 Jet Lag \u0648\u0627\u062e\u062a\u0644\u0627\u0641 \u0646\u0648\u0628\u0627\u062a \u0627\u0644\u0639\u0645\u0644)", "\u0647\u0630\u0627 \u0627\u0644\u0647\u0631\u0645\u0648\u0646 \u0647\u0648 \u0645\u0627 \u064a\u0641\u0631\u0632\u0647 \u0627\u0644\u062f\u0645\u0627\u063a \u0641\u064a \u0627\u0644\u0638\u0644\u0627\u0645 \u0644\u0625\u062e\u0628\u0627\u0631 \u0627\u0644\u062c\u0633\u0645 \u0628\u0648\u0642\u062a \u0627\u0644\u0646\u0648\u0645."], ["\u0645\u0627 \u0647\u064a \u0627\u0644\u0639\u0634\u0628\u0629 \u0627\u0644\u0637\u0628\u064a\u0639\u064a\u0629 \u0627\u0644\u062a\u064a \u062a\u0639\u062a\u0628\u0631 \u0627\u0644\u062e\u0637 \u0627\u0644\u0623\u0648\u0644 \u0648\u0627\u0644\u0623\u0643\u062b\u0631 \u0623\u0645\u0627\u0646\u0627\u064b \u0644\u063a\u062b\u064a\u0627\u0646 \u0627\u0644\u0635\u0628\u0627\u062d \u0627\u0644\u062e\u0641\u064a\u0641 \u0639\u0646\u062f \u0627\u0644\u062d\u0648\u0627\u0645\u0644\u061f", ["\u0627\u0644\u0646\u0639\u0646\u0627\u0639", "\u0627\u0644\u0632\u0646\u062c\u0628\u064a\u0644 (Ginger)", "\u0627\u0644\u0643\u0627\u0645\u0648\u0645\u064a\u0644", "\u0627\u0644\u0642\u0631\u0641\u0629"], "\u0627\u0644\u0632\u0646\u062c\u0628\u064a\u0644 (Ginger)", "\u0623\u062b\u0628\u062a\u062a \u0627\u0644\u062f\u0631\u0627\u0633\u0627\u062a \u0641\u0639\u0627\u0644\u064a\u062a\u0647 \u0648\u0623\u0645\u0627\u0646\u0647 \u0627\u0644\u062a\u0627\u0645 \u0639\u0644\u0649 \u0627\u0644\u062c\u0646\u064a\u0646."], ["\u0623\u062f\u0648\u064a\u0629 \u062f\u0648\u0627\u0631 \u0627\u0644\u062d\u0631\u0643\u0629 (Motion Sickness) \u0645\u062b\u0644 \u0627\u0644\u0645\u064a\u0643\u0644\u064a\u0632\u064a\u0646\u060c \u0643\u064a\u0641 \u062a\u0639\u0645\u0644 \u0648\u0644\u0645\u0627\u0630\u0627 \u062a\u0633\u0628\u0628 \u0627\u0644\u0646\u0639\u0627\u0633\u061f", ["\u062a\u062b\u0628\u0637 \u062d\u0645\u0636 \u0627\u0644\u0645\u0639\u062f\u0629", "\u062a\u062b\u0628\u0637 \u0645\u0633\u062a\u0642\u0628\u0644\u0627\u062a \u0627\u0644\u0647\u064a\u0633\u062a\u0627\u0645\u064a\u0646 \u0641\u064a \u0645\u0631\u0643\u0632 \u0627\u0644\u062a\u0648\u0627\u0632\u0646 \u0641\u064a \u0627\u0644\u062f\u0645\u0627\u063a (Vestibular system) \u0648\u062a\u0639\u0628\u0631 \u062d\u0627\u062c\u0632 \u0627\u0644\u062f\u0645\u0627\u063a", "\u062a\u0633\u0631\u0639 \u062d\u0631\u0643\u0629 \u0627\u0644\u0623\u0645\u0639\u0627\u0621", "\u062a\u0648\u0633\u0639 \u0627\u0644\u0634\u0631\u0627\u064a\u064a\u0646"], "\u062a\u062b\u0628\u0637 \u0645\u0633\u062a\u0642\u0628\u0644\u0627\u062a \u0627\u0644\u0647\u064a\u0633\u062a\u0627\u0645\u064a\u0646 \u0641\u064a \u0645\u0631\u0643\u0632 \u0627\u0644\u062a\u0648\u0627\u0632\u0646 \u0641\u064a \u0627\u0644\u062f\u0645\u0627\u063a (Vestibular system) \u0648\u062a\u0639\u0628\u0631 \u062d\u0627\u062c\u0632 \u0627\u0644\u062f\u0645\u0627\u063a", "\u064a\u062c\u0628 \u062a\u0646\u0627\u0648\u0644\u0647\u0627 \u0642\u0628\u0644 \u0627\u0644\u0633\u0641\u0631 \u0628\u0646\u0635\u0641 \u0633\u0627\u0639\u0629 \u0644\u062a\u0639\u0645\u0644 \u0643\u0648\u0642\u0627\u064a\u0629."], ["\u0644\u0645\u0627\u0630\u0627 \u064a\u062c\u0628 \u0623\u0646 \u062a\u064f\u0639\u0637\u0649 \u0623\u062f\u0648\u064a\u0629 \u062f\u0648\u0627\u0631 \u0627\u0644\u062d\u0631\u0643\u0629 \u0642\u0628\u0644 \u0628\u062f\u0621 \u0627\u0644\u0633\u0641\u0631 \u0628\u0640 30-60 \u062f\u0642\u064a\u0642\u0629 \u0639\u0644\u0649 \u0627\u0644\u0623\u0642\u0644\u061f", ["\u0644\u0623\u0646\u0647\u0627 \u062a\u062d\u062a\u0627\u062c \u0647\u0630\u0627 \u0627\u0644\u0648\u0642\u062a \u0644\u062a\u0647\u0636\u0645 \u0627\u0644\u0623\u0643\u0644", "\u0644\u0623\u0646\u0647\u0627 \u0648\u0642\u0627\u0626\u064a\u0629 (Prophylactic) \u0648\u062a\u0639\u0645\u0644 \u0628\u0643\u0641\u0627\u0621\u0629 \u0642\u0628\u0644 \u062a\u062d\u0641\u064a\u0632 \u0645\u0631\u0643\u0632 \u0627\u0644\u0642\u064a\u0621\u060c \u0648\u062a\u0641\u0642\u062f \u0645\u0639\u0638\u0645 \u0642\u064a\u0645\u062a\u0647\u0627 \u0625\u0630\u0627 \u0628\u062f\u0623 \u0627\u0644\u0642\u064a\u0621 \u0641\u0639\u0644\u064a\u0627\u064b", "\u0644\u0623\u0646\u0647\u0627 \u062a\u0633\u0628\u0628 \u0627\u0644\u0647\u0644\u0648\u0633\u0629", "\u0644\u0623\u0646\u0647\u0627 \u064a\u062c\u0628 \u0623\u0646 \u062a\u062e\u0644\u0637 \u0628\u0627\u0644\u0644\u0639\u0627\u0628"], "\u0644\u0623\u0646\u0647\u0627 \u0648\u0642\u0627\u0626\u064a\u0629 (Prophylactic) \u0648\u062a\u0639\u0645\u0644 \u0628\u0643\u0641\u0627\u0621\u0629 \u0642\u0628\u0644 \u062a\u062d\u0641\u064a\u0632 \u0645\u0631\u0643\u0632 \u0627\u0644\u0642\u064a\u0621\u060c \u0648\u062a\u0641\u0642\u062f \u0645\u0639\u0638\u0645 \u0642\u064a\u0645\u062a\u0647\u0627 \u0625\u0630\u0627 \u0628\u062f\u0623 \u0627\u0644\u0642\u064a\u0621 \u0641\u0639\u0644\u064a\u0627\u064b", "\u0628\u0645\u062c\u0631\u062f \u0628\u062f\u0621 \u0627\u0644\u0642\u064a\u0621\u060c \u064a\u0643\u0648\u0646 \u0627\u0644\u062f\u0645\u0627\u063a \u0642\u062f \u0623\u0637\u0644\u0642 \u0627\u0644\u0625\u0634\u0627\u0631\u0629 \u0628\u0627\u0644\u0641\u0639\u0644."], ["\u0637\u0641\u0644 \u0639\u0645\u
