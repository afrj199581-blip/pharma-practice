4\u0627\u0633\u062a\u0644\u0642\u0627\u0621 \u0641\u064a \u063a\u0631\u0641\u0629 \u0645\u0638\u0644\u0645\u0629 \u0648\u0647\u0627\u062f\u0626\u0629."], ["\u062a\u063a\u064a\u0631\u0627\u062a \u0627\u0644\u0636\u063a\u0637 \u0627\u0644\u062c\u0648\u064a \u0648\u0627\u0644\u0627\u0631\u062a\u0641\u0627\u0639\u0627\u062a \u062a\u0639\u062a\u0628\u0631 \u0645\u062d\u0641\u0632\u0627\u064b \u0634\u0647\u064a\u0631\u0627\u064b \u0644\u0623\u064a \u0646\u0648\u0639 \u0645\u0646 \u0627\u0644\u0635\u062f\u0627\u0639\u061f", ["\u0627\u0644\u0635\u062f\u0627\u0639 \u0627\u0644\u0639\u0646\u0642\u0648\u062f\u064a", "\u0635\u062f\u0627\u0639 \u0627\u0644\u062a\u0648\u062a\u0631", "\u0646\u0632\u064a\u0641 \u0627\u0644\u0645\u062e", "\u0627\u0644\u0635\u062f\u0627\u0639 \u0627\u0644\u0627\u0631\u062a\u062f\u0627\u062f\u064a"], "\u0627\u0644\u0635\u062f\u0627\u0639 \u0627\u0644\u0639\u0646\u0642\u0648\u062f\u064a", "\u0627\u0644\u0628\u064a\u0626\u0629 \u0648\u0636\u063a\u0637 \u0627\u0644\u0647\u0648\u0627\u0621 \u0644\u0647\u0645\u0627 \u062a\u0623\u062b\u064a\u0631 \u0642\u0648\u064a \u0639\u0644\u0649 \u0647\u0630\u0627 \u0627\u0644\u0646\u0648\u0639."], ["\u0627\u0644\u0647\u0631\u0645\u0648\u0646 \u0627\u0644\u0645\u0631\u062a\u0628\u0637 \u0628\u0642\u0648\u0629 \u0641\u064a \u062a\u062d\u0641\u064a\u0632 \u0627\u0644\u0635\u062f\u0627\u0639 \u0627\u0644\u0646\u0635\u0641\u064a \u0644\u062f\u0649 \u0627\u0644\u0646\u0633\u0627\u0621 (\u062e\u0627\u0635\u0629 \u0645\u0639 \u0627\u0644\u062f\u0648\u0631\u0629 \u0627\u0644\u0634\u0647\u0631\u064a\u0629)\u061f", ["\u0627\u0644\u062a\u0633\u062a\u0648\u0633\u062a\u064a\u0631\u0648\u0646", "\u0627\u0644\u062b\u064a\u0631\u0648\u0643\u0633\u064a\u0646", "\u0627\u0644\u0625\u0633\u062a\u0631\u0648\u062c\u064a\u0646", "\u0627\u0644\u0623\u0646\u0633\u0648\u0644\u064a\u0646"], "\u0627\u0644\u0625\u0633\u062a\u0631\u0648\u062c\u064a\u0646", "\u062a\u0642\u0644\u0628\u0627\u062a \u0627\u0644\u0625\u0633\u062a\u0631\u0648\u062c\u064a\u0646 \u062a\u062d\u0641\u0632 \u0646\u0648\u0628\u0627\u062a \u0627\u0644\u0635\u062f\u0627\u0639 \u0627\u0644\u0646\u0635\u0641\u064a."], ["\u0645\u0631\u064a\u0636 \u064a\u0634\u0643\u0648 \u0645\u0646 \u0635\u062f\u0627\u0639 \u0645\u0639 \u062d\u0645\u0649 \u0648\u062a\u064a\u0628\u0633 \u0641\u064a \u0627\u0644\u0631\u0642\u0628\u0629\u060c \u0645\u0627 \u0647\u0648 \u0627\u0644\u0625\u062c\u0631\u0627\u0621\u061f", ["\u0648\u0635\u0641 \u0628\u0627\u0631\u0627\u0633\u064a\u062a\u0627\u0645\u0648\u0644", "\u0646\u0635\u062d\u0647 \u0628\u0627\u0644\u0631\u0627\u062d\u0629", "\u0625\u062d\u0627\u0644\u0629 \u0641\u0648\u0631\u064a\u0629 \u0644\u0644\u0627\u0634\u062a\u0628\u0627\u0647 \u0628\u0627\u0644\u062a\u0647\u0627\u0628 \u0627\u0644\u0633\u062d\u0627\u064a\u0627 (Meningitis)", "\u0635\u0631\u0641 \u0645\u0636\u0627\u062f \u062d\u064a\u0648\u064a"], "\u0625\u062d\u0627\u0644\u0629 \u0641\u0648\u0631\u064a\u0629 \u0644\u0644\u0627\u0634\u062a\u0628\u0627\u0647 \u0628\u0627\u0644\u062a\u0647\u0627\u0628 \u0627\u0644\u0633\u062d\u0627\u064a\u0627 (Meningitis)", "\u0647\u0630\u0627 \u0627\u0644\u062b\u0627\u0644\u0648\u062b (\u062d\u0645\u0649\u060c \u0635\u062f\u0627\u0639\u060c \u062a\u064a\u0628\u0633) \u064a\u0633\u0645\u0649 \u062b\u0627\u0644\u0648\u062b \u0643\u064a\u0631\u0646\u064a\u063a \u0648\u0647\u0648 \u0637\u0627\u0631\u0626 \u0637\u0628\u064a."], ["\u0635\u062f\u0627\u0639 \u0627\u0644\u0631\u0639\u062f (Thunderclap) \u0627\u0644\u0630\u064a \u064a\u0628\u0644\u063a \u0630\u0631\u0648\u062a\u0647 \u0641\u064a \u062b\u0648\u0627\u0646\u064d \u064a\u0634\u064a\u0631 \u0625\u0644\u0649\u061f", ["\u0627\u0644\u062a\u0647\u0627\u0628 \u0627\u0644\u0634\u0631\u064a\u0627\u0646 \u0627\u0644\u0635\u062f\u063a\u064a", "\u0646\u0632\u064a\u0641 \u062a\u062d\u062a \u0627\u0644\u0639\u0646\u0643\u0628\u0648\u062a\u064a\u0629 (SAH)", "\u0635\u062f\u0627\u0639 \u0627\u0644\u062a\u0648\u062a\u0631 \u0627\u0644\u0634\u062f\u064a\u062f", "\u0627\u0644\u062a\u0647\u0627\u0628 \u0627\u0644\u062c\u064a\u0648\u0628"], "\u0646\u0632\u064a\u0641 \u062a\u062d\u062a \u0627\u0644\u0639\u0646\u0643\u0628\u0648\u062a\u064a\u0629 (SAH)", "\u0637\u0627\u0631\u0626 \u062c\u0631\u0627\u062d\u064a \u0639\u0635\u0628\u064a \u064a\u062a\u0637\u0644\u0628 \u062a\u0635\u0648\u064a\u0631 \u0645\u0642\u0637\u0639\u064a (CT) \u0641\u0648\u0631\u064a."], ["\u0623\u0644\u0645 \u0641\u0631\u0648\u0629 \u0627\u0644\u0631\u0623\u0633 \u0648\u0627\u0644\u0641\u0643 \u0639\u0646\u062f \u0627\u0644\u0645\u0636\u063a \u0644\u0645\u0631\u064a\u0636 \u0645\u0633\u0646 \u064a\u0634\u064a\u0631 \u0625\u0644\u0649\u061f", ["\u0623\u0644\u0645 \u0623\u0633\u0646\u0627\u0646", "\u0627\u0644\u062a\u0647\u0627\u0628 \u0627\u0644\u0634\u0631\u064a\u0627\u0646 \u0627\u0644\u0635\u062f\u063a\u064a (Giant Cell Arteritis)", "\u0635\u062f\u0627\u0639 \u0646\u0635\u0641\u064a", "\u062c\u0644\u0637\u0629 \u062f\u0645\u0627\u063a\u064a\u0629"], "\u0627\u0644\u062a\u0647\u0627\u0628 \u0627\u0644\u0634\u0631\u064a\u0627\u0646 \u0627\u0644\u0635\u062f\u063a\u064a (Giant Cell Arteritis)", "\u064a\u062a\u0637\u0644\u0628 \u0643\u0648\u0631\u062a\u064a\u0643\u0648\u0633\u062a\u064a\u0631\u0648\u064a\u062f \u0641\u0648\u0631\u064a \u0644\u0645\u0646\u0639 \u0627\u0644\u0639\u0645\u0649 \u0627\u0644\u062f\u0627\u0626\u0645."], ["\u0645\u0627 \u0647\u0648 \u0627\u0644\u0639\u0644\u0627\u062c \u0627\u0644\u0648\u0642\u0627\u0626\u064a (Prophylaxis) \u0627\u0644\u0645\u0641\u0636\u0644 \u0644\u0635\u062f\u0627\u0639 \u0627\u0644\u062a\u0648\u062a\u0631 \u0627\u0644\u0645\u0632\u0645\u0646\u061f", ["\u0633\u0648\u0645\u0627\u062a\u0631\u064a\u0628\u062a\u0627\u0646", "\u0628\u0631\u0648\u0628\u0631\u0627\u0646\u0648\u0644\u0648\u0644", "\u0623\u0645\u064a\u062a\u0631\u064a\u0628\u062a\u064a\u0644\u064a\u0646 (TCA)", "\u0628\u0627\u0631\u0627\u0633\u064a\u062a\u0627\u0645\u0648\u0644"], "\u0623\u0645\u064a\u062a\u0631\u064a\u0628\u062a\u064a\u0644\u064a\u0646 (TCA)", "\u0645\u0636\u0627\u062f \u0627\u0643\u062a\u0626\u0627\u0628 \u062b\u0644\u0627\u062b\u064a \u0627\u0644\u062d\u0644\u0642\u0627\u062a \u064a\u0642\u0644\u0644 \u0645\u0646 \u0645\u0633\u0627\u0631\u0627\u062a \u0627\u0644\u0623\u0644\u0645 \u0627\u0644\u0645\u0632\u0645\u0646."], ["\u0645\u062a\u0649 \u064a\u064f\u0645\u0646\u0639 \u0627\u0633\u062a\u062e\u062f\u0627\u0645 \u0627\u0644\u062a\u0631\u064a\u0628\u062a\u0627\u0646 (Triptans) \u0628\u0634\u0643\u0644 \u0645\u0637\u0644\u0642\u061f", ["\u0644\u0645\u0631\u0636\u0649 \u0627\u0644\u0631\u0628\u0648", "\u0644\u0645\u0631\u0636\u0649 \u0627\u0644\u0634\u0631\u0627\u064a\u064a\u0646 \u0627\u0644\u062a\u0627\u062c\u064a\u0629 \u0648\u0627\u0644\u0642\u0644\u0628 (CAD)", "\u0644\u0645\u0631\u0636\u0649 \u0627\u0644\u0633\u0643\u0631\u064a", "\u0644\u0645\u0631\u0636\u0649 \u0627\u0644\u0642\u0631\u062d\u0629"], "\u0644\u0645\u0631\u0636\u0649 \u0627\u0644\u0634\u0631\u0627\u064a\u064a\u0646 \u0627\u0644\u062a\u0627\u062c\u064a\u0629 \u0648\u0627\u0644\u0642\u0644\u0628 (CAD)", "\u0644\u0623\u0646\u0647\u0627 \u062a\u0633\u0628\u0628 \u062a\u0636\u064a\u0642 \u0627\u0644\u0623\u0648\u0639\u064a\u0629 \u0627\u0644\u062f\u0645\u0648\u064a\u0629 (Vasoconstriction) \u0648\u0642\u062f \u062a\u0633\u0628\u0628 \u0630\u0628\u062d\u0629 \u0635\u062f\u0631\u064a\u0629."], ["\u0627\u0633\u062a\u062e\u062f\u0627\u0645 \u0627\u0644\u0645\u0633\u0643\u0646\u0627\u062a \u0627\u0644\u0628\u0633\u064a\u0637\u0629 \u0644\u0623\u0643\u062b\u0631 \u0645\u0646 15 \u064a\u0648\u0645\u0627\u064b \u0641\u064a \u0627\u0644\u0634\u0647\u0631 \u064a\u0633\u0628\u0628\u061f", ["\u0634\u0641\u0627\u0621 \u062a\u0627\u0645", "\u0635\u062f\u0627\u0639 \u0627\u0644\u0625\u0641\u0631\u0627\u0637 \u0641\u064a \u0627\u0644\u0623\u062f\u0648\u064a\u0629 (MOH)", "\u0627\u0644\u062a\u0647\u0627\u0628 \u0627\u0644\u0634\u0631\u064a\u0627\u0646 \u0627\u0644\u0635\u062f\u063a\u064a", "\u0645\u0646\u0627\u0639\u0629 \u0636\u062f \u0627\u0644\u0623\u0644\u0645"], "\u0635\u062f\u0627\u0639 \u0627\u0644\u0625\u0641\u0631\u0627\u0637 \u0641\u064a \u0627\u0644\u0623\u062f\u0648\u064a\u0629 (MOH)", "\u0635\u062f\u0627\u0639 \u0627\u0631\u062a\u062f\u0627\u062f\u064a \u064a\u062a\u0637\u0644\u0628 \u0633\u062d\u0628 \u0627\u0644\u0645\u0633\u0643\u0646 \u0628\u0627\u0644\u062a\u062f\u0631\u064a\u062c."], ["\u0645\u0627 \u0647\u0648 \u0627\u0644\u0639\u0644\u0627\u062c \u0627\u0644\u0633\u0631\u064a\u0639 (\u0627\u0644\u062e\u0637 \u0627\u0644\u0623\u0648\u0644) \u0644\u0646\u0648\u0628\u0629 \u0627\u0644\u0635\u062f\u0627\u0639 \u0627\u0644\u0639\u0646\u0642\u0648\u062f\u064a \u0627\u0644\u062d\u0627\u062f\u0629\u061f", ["\u0623\u0642\u0631\u0627\u0635 \u0628\u0627\u0631\u0627\u0633\u064a\u062a\u0627\u0645\u0648\u0644", "\u062d\u0642\u0646 \u0633\u0648\u0645\u0627\u062a\u0631\u064a\u0628\u062a\u0627\u0646 \u062a\u062d\u062a \u0627\u0644\u062c\u0644\u062f \u0623\u0648 \u0628\u062e\u0627\u062e \u0623\u0646\u0641", "\u0623\u0642\u0631\u0627\u0635 \u0625\u064a\u0628\u0648\u0628\u0631\u0648\u0641\u064a\u0646", "\u0645\u0636\u0627\u062f \u062d\u064a\u0648\u064a"], "\u062d\u0642\u0646 \u0633\u0648\u0645\u0627\u062a\u0631\u064a\u0628\u062a\u0627\u0646 \u062a\u062d\u062a \u0627\u0644\u062c\u0644\u062f \u0623\u0648 \u0628\u062e\u0627\u062e \u0623\u0646\u0641", "\u0644\u0623\u0646 \u0627\u0644\u0646\u0648\u0628\u0629 \u062a\u0628\u0644\u063a \u0630\u0631\u0648\u062a\u0647\u0627 \u0628\u0633\u0631\u0639\u0629 \u0643\u0628\u064a\u0631\u0629 \u0648\u0627\u0644\u0623\u0642\u0631\u0627\u0635 \u0627\u0644\u0641\u0645\u0648\u064a\u0629 \u0628\u0637\u064a\u0626\u0629 \u062c\u062f\u0627\u064b."], ["\u0645\u0627 \u0647\u0648 \u0627\u0644\u0648\u0633\u064a\u0637 \u0627\u0644\u0643\u064a\u0645\u064a\u0627\u0626\u064a \u0627\u0644\u0623\u0633\u0627\u0633\u064a \u0627\u0644\u0645\u0633\u0624\u0648\u0644 \u0639\u0646 \u0623\u0639\u0631\u0627\u0636 \u0627\u0644\u0645\u0631\u062d\u0644\u0629 \u0627\u0644\u0645\u0628\u0643\u0631\u0629 \u0645\u0646 \u0627\u0644\u062d\u0633\u0627\u0633\u064a\u0629 (\u0627\u0644\u0639\u0637\u0633 \u0648\u0627\u0644\u062d\u0643\u0629)\u061f", ["\u0627\u0644\u0647\u064a\u0633\u062a\u0627\u0645\u064a\u0646", "\u0627\u0644\u0633\u064a\u0631\u0648\u062a\u0648\u0646\u064a\u0646", "\u0627\u0644\u0644\u0648\u0643\u0648\u062a\u0631\u064a\u064a\u0646", "\u0627\u0644\u062f\u0648\u0628\u0627\u0645\u064a\u0646"], "\u0627\u0644\u0647\u064a\u0633\u062a\u0627\u0645\u064a\u0646", "\u064a\u064f\u0641\u0631\u0632 \u0645\u0646 \u0627\u0644\u062e\u0644\u0627\u064a\u0627 \u0627\u0644\u0628\u062f\u064a\u0646\u0629 (Mast cells) \u0648\u064a\u0633\u0628\u0628 \u062a\u0641\u0627\u0639\u0644\u0627\u062a \u0641\u0648\u0631\u064a\u0629."], ["\u0645\u0627 \u0647\u0648 \u0627\u0644\u062c\u0633\u0645 \u0627\u0644\u0645\u0636\u0627\u062f \u0627\u0644\u0645\u0631\u062a\u0628\u0637 \u0628\u0627\u0644\u062a\u0647\u0627\u0628 \u0627\u0644\u0623\u0646\u0641 \u0627\u0644\u062a\u062d\u0633\u0633\u064a (Type 1)\u061f", ["IgG", "IgM", "IgE", "IgA"], "IgE", "\u064a\u062a\u0639\u0631\u0641 \u0639\u0644\u0649 \u0645\u0633\u0628\u0628\u0627\u062a \u0627\u0644\u062d\u0633\u0627\u0633\u064a\u0629 \u0648\u064a\u062d\u0641\u0632 \u0627\u0644\u062e\u0644\u0627\u064a\u0627 \u0627\u0644\u0628\u062f\u064a\u0646\u0629."], ["\u0627\u0644\u062a\u0647\u0627\u0628 \u0627\u0644\u0623\u0646\u0641 \u0627\u0644\u062d\u0631\u0643\u064a \u0627\u0644\u0648\u0639\u0627\u0626\u064a (Vasomotor NAR) \u064a\u062a\u0645 \u062a\u062d\u0641\u064a\u0632\u0647 \u0639\u0627\u062f\u0629 \u0628\u0648\u0627\u0633\u0637\u0629\u061f", ["\u062d\u0628\u0648\u0628 \u0627\u0644\u0644\u0642\u0627\u062d", "\u0627\u0644\u0642\u0637\u0637 \u0648\u0627\u0644\u0643\u0644\u0627\u0628", "\u062a\u063a\u064a\u0631\u0627\u062a \u062f\u0631\u062c\u0627\u062a \u0627\u0644\u062d\u0631\u0627\u0631\u0629 \u0648\u0627\u0644\u062f\u062e\u0627\u0646", "\u0627\u0644\u0641\u064a\u0631\u0648\u0633\u0627\u062a"], "\u062a\u063a\u064a\u0631\u0627\u062a \u062f\u0631\u062c\u0627\u062a \u0627\u0644\u062d\u0631\u0627\u0631\u0629 \u0648\u0627\u0644\u062f\u062e\u0627\u0646", "\u0641\u0631\u0637 \u062d\u0633\u0627\u0633\u064a\u0629 \u0641\u064a \u0627\u0644\u062c\u0647\u0627\u0632 \u0627\u0644\u0639\u0635\u0628\u064a \u0644\u0644\u0623\u0646\u0641 \u062f\u0648\u0646 \u0648\u062c\u0648\u062f \u062d\u0633\u0627\u0633\u064a\u0629 \u062d\u0642\u064a\u0642\u064a\u0629."], ["\u0627\u0644\u0627\u0633\u062a\u062e\u062f\u0627\u0645 \u0627\u0644\u0645\u0641\u0631\u0637 \u0644\u0628\u062e\u0627\u062e\u0627\u062a \u0625\u0632\u0627\u0644\u0629 \u0627\u0644\u0627\u062d\u062a\u0642\u0627\u0646 \u0627\u0644\u0645\u0648\u0636\u0639\u064a\u0629 (\u0645\u062b\u0644 \u0623\u0648\u062a\u0631\u064a\u0641\u064a\u0646) \u064a\u0633\u0628\u0628\u061f", ["\u0646\u0632\u064a\u0641 \u0645\u0633\u062a\u0645\u0631", "\u0627\u062d\u062a\u0642\u0627\u0646 \u0627\u0631\u062a\u062f\u0627\u062f\u064a (Rhinitis Medicamentosa)", "\u0641\u0642\u062f\u0627\u0646 \u0627\u0644\u0633\u0645\u0639", "\u0627\u0644\u062a\u0647\u0627\u0628 \u0628\u0643\u062a\u064a\u0631\u064a"], "\u0627\u062d\u062a\u0642\u0627\u0646 \u0627\u0631\u062a\u062f\u0627\u062f\u064a (Rhinitis Medicamentosa)", "\u064a\u062d\u062f\u062b \u0628\u0633\u0628\u0628 \u062a\u0631\u0627\u062c\u0639 \u0627\u0633\u062a\u062c\u0627\u0628\u0629 \u0627\u0644\u0645\u0633\u062a\u0642\u0628\u0644\u0627\u062a (Tachyphylaxis)."], ["\u0643\u064a\u0641 \u064a\u062c\u0628 \u0639\u0644\u0627\u062c \u0627\u062d\u062a\u0642\u0627\u0646 \u0627\u0644\u0623\u0646\u0641 \u0627\u0644\u0627\u0631\u062a\u062f\u0627\u062f\u064a (Medicamentosa)\u061f", ["\u0632\u064a\u0627\u062f\u0629 \u062c\u0631\u0639\u0629 \u0627\u0644\u0628\u062e\u0627\u062e", "\u0645\u0636\u0627\u062f \u062d\u064a\u0648\u064a", "\u0627\u0644\u062a\u0648\u0642\u0641 \u0627\u0644\u062a\u062f\u0631\u064a\u062c\u064a \u0648\u0627\u0633\u062a\u062e\u062f\u0627\u0645 \u0628\u062e\u0627\u062e \u0643\u0648\u0631\u062a\u064a\u0643\u0648\u0633\u062a\u064a\u0631\u0648\u064a\u062f", "\u062c\u0631\u0627\u062d\u0629 \u0641\u0648\u0631\u064a\u0629"], "\u0627\u0644\u062a\u0648\u0642\u0641 \u0627\u0644\u062a\u062f\u0631\u064a\u062c\u064a \u0648\u0627\u0633\u062a\u062e\u062f\u0627\u0645 \u0628\u062e\u0627\u062e \u0643\u0648\u0631\u062a\u064a\u0643\u0648\u0633\u062a\u064a\u0631\u0648\u064a\u062f", "\u0644\u062a\u0642\u0644\u064a\u0644 \u0627\u0644\u0627\u0644\u062a\u0647\u0627\u0628 \u0648\u062a\u062e\u0644\u064a\u0635 \u0627\u0644\u0623\u0646\u0641 \u0645\u0646 \u0627\u0644\u0625\u062f\u0645\u0627\u0646 \u0627\u0644\u0645\u0648\u0636\u0639\u064a."], ["\u0645\u0627 \u0627\u0644\u0630\u064a \u064a\u0645\u064a\u0632 \u0625\u0641\u0631\u0627\u0632\u0627\u062a \u0627\u0644\u062a\u0647\u0627\u0628 \u0627\u0644\u0623\u0646\u0641 \u0627\u0644\u0641\u064a\u0631\u0648\u0633\u064a/\u0627\u0644\u0628\u0643\u062a\u064a\u0631\u064a (Infective) \u0639\u0646 \u0627\u0644\u062a\u062d\u0633\u0633\u064a\u061f", ["\u0634\u0641\u0627\u0641\u0629 \u0648\u0645\u0627\u0626\u064a\u0629", "\u062c\u0627\u0641\u0629 \u062a\u0645\u0627\u0645\u0627\u064b", "\u0633\u0645\u064a\u0643\u0629 \u0648\u0645\u0644\u0648\u0646\u0629 (Mucopurulent)", "\u0645\u062f\u0645\u0645\u0629 \u062f\u0627\u0626\u0645\u0627\u064b"], "\u0633\u0645\u064a\u0643\u0629 \u0648\u0645\u0644\u0648\u0646\u0629 (Mucopurulent)", "\u0628\u0633\u0628\u0628 \u0648\u062c\u0648\u062f \u0643\u0631\u064a\u0627\u062a \u0627\u0644\u062f\u0645 \u0627\u0644\u0628\u064a\u0636\u0627\u0621 \u0627\u0644\u0645\u064a\u062a\u0629 \u0648\u0627\u0644\u0628\u0643\u062a\u064a\u0631\u064a\u0627."], ["\u0623\u064a \u0645\u0646 \u0627\u0644\u062e\u0644\u0627\u064a\u0627 \u0627\u0644\u0645\u0646\u0627\u0639\u064a\u0629 \u062a\u062a\u062c\u0645\u0639 \u0641\u064a \u0627\u0644\u0645\u0631\u062d\u0644\u0629 \u0627\u0644\u0645\u062a\u0623\u062e\u0631\u0629 \u0648\u062a\u0633\u0628\u0628 \u0627\u0644\u0627\u062d\u062a\u0642\u0627\u0646 \u0627\u0644\u0639\u0646\u064a\u062f \u0627\u0644\u0645\u0633\u062a\u0645\u0631\u061f", ["\u0643\u0631\u064a\u0627\u062a \u0627\u0644\u062f\u0645 \u0627\u0644\u062d\u0645\u0631\u0627\u0621", "\u0627\u0644\u062e\u0644\u0627\u064a\u0627 \u0627\u0644\u0644\u064a\u0645\u0641\u0627\u0648\u064a\u0629", "\u0627\u0644\u064a\u0648\u0632\u064a\u0646\u064a\u0627\u062a (Eosinophils)", "\u0627\u0644\u0635\u0641\u0627\u0626\u062d \u0627\u0644\u062f\u0645\u0648\u064a\u0629"], "\u0627\u0644\u064a\u0648\u0632\u064a\u0646\u064a\u0627\u062a (Eosinophils)", "\u062a\u0641\u0631\u0632 \u0628\u0631\u0648\u062a\u064a\u0646\u0627\u062a \u0633\u0627\u0645\u0629 \u0648\u062a\u0633\u0628\u0628 \u0627\u0644\u062a\u0647\u0627\u0628 \u0645\u0632\u0645\u0646 \u0648\u062a\u0636\u062e\u0645 \u0641\u064a \u0627\u0644\u0623\u0646\u0633\u062c\u0629."], ["\u0645\u0627 \u0647\u0648 \u0627\u0644\u0645\u0639\u0646\u0649 \u0627\u0644\u0637\u0628\u064a \u0644\u0645\u0635\u0637\u0644\u062d 'Hyposmia' \u0627\u0644\u0630\u064a \u064a\u0631\u0627\u0641\u0642 \u0627\u0644\u062a\u0647\u0627\u0628 \u0627\u0644\u0623\u0646\u0641\u061f", ["\u0632\u064a\u0627\u062f\u0629 \u0627\u0644\u062a\u062f\u0645\u064a\u0639", "\u0641\u0642\u062f\u0627\u0646 \u0623\u0648 \u0636\u0639\u0641 \u062d\u0627\u0633\u0629 \u0627\u0644\u0634\u0645", "\u0623\u0644\u0645 \u0627\u0644\u0623\u0630\u0646", "\u0627\u0644\u0639\u0637\u0633 \u0627\u0644\u0645\u0633\u062a\u0645\u0631"], "\u0641\u0642\u062f\u0627\u0646 \u0623\u0648 \u0636\u0639\u0641 \u062d\u0627\u0633\u0629 \u0627\u0644\u0634\u0645", "\u064a\u062d\u062f\u062b \u0628\u0633\u0628\u0628 \u0627\u0644\u062a\u0648\u0631\u0645 \u0627\u0644\u0630\u064a \u064a\u0633\u062f \u0645\u0633\u062a\u0642\u0628\u0644\u0627\u062a \u0627\u0644\u0634\u0645 \u0641\u064a \u0633\u0642\u0641 \u0627\u0644\u0623\u0646\u0641."], ["\u0644\u0645\u0627\u0630\u0627 \u064a\u0645\u0646\u0639 \u0627\u0633\u062a\u062e\u062f\u0627\u0645 \u0627\u0644\u062c\u064a\u0644 \u0627\u0644\u0623\u0648\u0644 \u0645\u0646 \u0645\u0636\u0627\u062f\u0627\u062a \u0627\u0644\u0647\u064a\u0633\u062a\u0627\u0645\u064a\u0646 (\u0645\u062b\u0644 \u0627\u0644\u062f\u0627\u064a\u0641\u064a\u0646\u0647\u064a\u062f\u0631\u0627\u0645\u064a\u0646) \u0644\u0643\u0628\u0627\u0631 \u0627\u0644\u0633\u0646\u061f", ["\u062a\u0633\u0628\u0628 \u0627\u0644\u0633\u0643\u0631\u064a", "\u062a\u0639\u0628\u0631 \u062d\u0627\u062c\u0632 \u0627\u0644\u062f\u0645\u0627\u063a \u0648\u062a\u0633\u0628\u0628 \u0627\u0644\u0646\u0639\u0627\u0633 \u0627\u0644\u0634\u062f\u064a\u062f \u0648\u062e\u0637\u0631 \u0627\u0644\u0633\u0642\u0648\u0637", "\u062a\u0633\u0628\u0628 \u0627\u0644\u0625\u0633\u0647\u0627\u0644", "\u0644\u0627 \u062a\u0645\u062a\u0635 \u062c\u064a\u062f\u0627\u064b"], "\u062a\u0639\u0628\u0631 \u062d\u0627\u062c\u0632 \u0627\u0644\u062f\u0645\u0627\u063a \u0648\u062a\u0633\u0628\u0628 \u0627\u0644\u0646\u0639\u0627\u0633 \u0627\u0644\u0634\u062f\u064a\u062f \u0648\u062e\u0637\u0631 \u0627\u0644\u0633\u0642\u0648\u0637", "\u0644\u062f\u064a\u0647\u0627 \u062a\u0623\u062b\u064a\u0631\u0627\u062a \u0642\u0648\u064a\u0629 \u0645\u0636\u0627\u062f\u0629 \u0644\u0644\u0643\u0648\u0644\u064a\u0646."], ["\u0645\u0627 \u0647\u0648 \u0627\u0644\u0639\u0644\u0627\u062c \u0627\u0644\u0630\u0647\u0628\u064a (Gold Standard) \u0644\u0644\u0645\u0631\u062d\u0644\u0629 \u0627\u0644\u0645\u062a\u0623\u062e\u0631\u0629 \u0648\u0627\u0644\u0627\u0644\u062a\u0647\u0627\u0628\u0627\u062a \u0627\u0644\u0645\u0632\u0645\u0646\u0629 \u0641\u064a \u0627\u0644\u0623\u0646\u0641\u061f", ["\u0645\u0636\u0627\u062f\u0627\u062a \u0627\u0644\u0627\u062d\u062a\u0642\u0627\u0646", "\u0628\u062e\u0627\u062e\u0627\u062a \u0627\u0644\u0643\u0648\u0631\u062a\u064a\u0643\u0648\u0633\u062a\u064a\u0631\u0648\u064a\u062f \u0627\u0644\u0623\u0646\u0641\u064a\u0629", "\u0627\u0644\u0628\u0627\u0631\u0627\u0633\u064a\u062a\u0627\u0645\u0648\u0644", "\u063a\u0633\u064a\u0644 \u0627\u0644\u0623\u0646\u0641"], "\u0628\u062e\u0627\u062e\u0627\u062a \u0627\u0644\u0643\u0648\u0631\u062a\u064a\u0643\u0648\u0633\u062a\u064a\u0631\u0648\u064a\u062f \u0627\u0644\u0623\u0646\u0641\u064a\u0629", "\u0644\u0623\u0646\u0647\u0627 \u062a\u0648\u0642\u0641 \u0627\u0644\u0634\u0644\u0627\u0644 \u0627\u0644\u0627\u0644\u062a\u0647\u0627\u0628\u064a \u0628\u0627\u0644\u0643\u0627\u0645\u0644 (\u0627\u0644\u0647\u064a\u0633\u062a\u0627\u0645\u064a\u0646 \u0648\u0627\u0644\u0644\u0648\u0643\u0648\u062a\u0631\u064a\u064a\u0646\u0627\u062a)."], ["\u0645\u062a\u0649 \u062a\u0635\u0644 \u0628\u062e\u0627\u062e\u0627\u062a \u0627\u0644\u0643\u0648\u0631\u062a\u064a\u0643\u0648\u0633\u062a\u064a\u0631\u0648\u064a\u062f (\u0645\u062b\u0644 \u0627\u0644\u0641\u0644\u0648\u062a\u064a\u0643\u0627\u0632\u0648\u0646) \u0625\u0644\u0649 \u0623\u0642\u0635\u0649 \u0641\u0639\u0627\u0644\u064a\u0629 \u0644\u0647\u0627\u061f", ["\u062e\u0644\u0627\u0644 15 \u062f\u0642\u064a\u0642\u0629", "\u062e\u0644\u0627\u0644 \u0633\u0627\u0639\u062a\u064a\u0646", "\u0645\u0646 3 \u0625\u0644\u0649 7 \u0623\u064a\u0627\u0645", "\u0628\u0639\u062f \u0634\u0647\u0631"], "\u0645\u0646 3 \u0625\u0644\u0649 7 \u0623\u064a\u0627\u0645", "\u064a\u062c\u0628 \u062a\u0648\u0639\u064a\u0629 \u0627\u0644\u0645\u0631\u064a\u0636 \u0628\u0627\u0644\u0627\u0633\u062a\u0645\u0631\u0627\u0631 \u0641\u064a \u0627\u0644\u0627\u0633\u062a\u062e\u062f\u0627\u0645 \u0648\u0639\u062f\u0645 \u0627\u0644\u062a\u0648\u0642\u0641 \u0645\u0628\u0643\u0631\u0627\u064b."], ["\u062f\u0648\u0627\u0621 \u0645\u0648\u0646\u062a\u064a\u0644\u0648\u0643\u0627\u0633\u062a (Singulair) \u064a\u0646\u062a\u0645\u064a \u0625\u0644\u0649 \u0623\u064a \u0641\u0626\u0629\u061f", ["\u0645\u0636\u0627\u062f\u0627\u062a \u0627\u0644\u0647\u064a\u0633\u062a\u0627\u0645\u064a\u0646", "\u0627\u0644\u0643\u0648\u0631\u062a\u064a\u0632\u0648\u0646", "\u0645\u0636\u0627\u062f\u0627\u062a \u0645\u0633\u062a\u0642\u0628\u0644\u0627\u062a \u0627\u0644\u0644\u0648\u0643\u0648\u062a\u0631\u064a\u064a\u0646 (LTRA)", "\u0645\u0636\u0627\u062f\u0627\u062a \u0627\u0644\u0627\u062d\u062a\u0642\u0627\u0646"], "\u0645\u0636\u0627\u062f\u0627\u062a \u0645\u0633\u062a\u0642\u0628\u0644\u0627\u062a \u0627\u0644\u0644\u0648\u0643\u0648\u062a\u0631\u064a\u064a\u0646 (LTRA)", "\u0645\u0645\u062a\u0627\u0632 \u0644\u0644\u0645\u0631\u0636\u0649 \u0627\u0644\u0630\u064a\u0646 \u064a\u0639\u0627\u0646\u0648\u0646 \u0645\u0646 \u0627\u0644\u0631\u0628\u0648 \u0648\u0627\u0644\u062a\u0647\u0627\u0628 \u0627\u0644\u0623\u0646\u0641 \u0645\u0639\u0627\u064b."], ["\u0645\u0627 \u0647\u0648 \u0627\u0644\u062a\u062d\u0630\u064a\u0631 \u0627\u0644\u0635\u0646\u062f\u0648\u0642\u064a \u0627\u0644\u0623\u0633\u0648\u062f (Black Box Warning) \u0644\u062f\u0648\u0627\u0621 \u0645\u0648\u0646\u062a\u064a\u0644\u0648\u0643\u0627\u0633\u062a\u061f", ["\u0627\u0644\u0641\u0634\u0644 \u0627\u0644\u0643\u0644\u0648\u064a", "\u0623\u062d\u062f\u0627\u062b \u0646\u0641\u0633\u064a\u0629 \u0648\u0639\u0635\u0628\u064a\u0629 (\u062a\u063a\u064a\u0631\u0627\u062a \u0641\u064a \u0627\u0644\u0645\u0632\u0627\u062c\u060c \u0643\u0648\u0627\u0628\u064a\u0633)", "\u062a\u0644\u064a\u0641 \u0627\u0644\u0643\u0628\u062f", "\u0627\u0644\u0639\u0645\u0649"], "\u0623\u062d\u062f\u0627\u062b \u0646\u0641\u0633\u064a\u0629 \u0648\u0639\u0635\u0628\u064a\u0629 (\u062a\u063a\u064a\u0631\u0627\u062a \u0641\u064a \u0627\u0644\u0645\u0632\u0627\u062c\u060c \u0643\u0648\u0627\u0628\u064a\u0633)", "\u064a\u062c\u0628 \u0645\u0631\u0627\u0642\u0628\u0629 \u0627\u0644\u0645\u0631\u064a\u0636 \u0646\u0641\u0633\u064a\u0627\u064b."], ["\u0628\u062e\u0627\u062e \u0627\u0644\u0625\u064a\u0628\u0631\u0627\u062a\u0631\u0648\u0628\u064a\u0648\u0645 \u0628\u0631\u0648\u0645\u064a\u062f (Anticholinergic) \u0645\u062e\u0635\u0635 \u0644\u0639\u0644\u0627\u062c \u0623\u064a \u0639\u0631\u0636 \u062a\u062d\u062f\u064a\u062f\u0627\u064b\u061f", ["\u0627\u0644\u0627\u062d\u062a\u0642\u0627\u0646", "\u0627\u0644\u0639\u0637\u0633", "\u0633\u064a\u0644\u0627\u0646 \u0627\u0644\u0623\u0646\u0641 \u0627\u0644\u0645\u0627\u0626\u064a (Rhinorrhea)", "\u0641\u0642\u062f\u0627\u0646 \u0627\u0644\u0634\u0645"], "\u0633\u064a\u0644\u0627\u0646 \u0627\u0644\u0623\u0646\u0641 \u0627\u0644\u0645\u0627\u0626\u064a (Rhinorrhea)", "\u064a\u062c\u0641\u0641 \u0627\u0644\u0625\u0641\u0631\u0627\u0632\u0627\u062a \u0627\u0644\u0645\u0627\u0626\u064a\u0629 \u0639\u0628\u0631 \u063a\u0644\u0642 \u0627\u0644\u0645\u0633\u062a\u0642\u0628\u0644\u0627\u062a \u0627\u0644\u0643\u0648\u0644\u064a\u0646\u064a\u0629."], ["\u0645\u0627 \u0647\u0648 \u0627\u0644\u0647\u062f\u0641 \u0627\u0644\u0631\u0626\u064a\u0633\u064a \u0645\u0646 \u063a\u0633\u064a\u0644 \u0627\u0644\u0623\u0646\u0641 \u0628\u0645\u062d\u0644\u0648\u0644 \u0645\u0644\u062d\u064a (Saline irrigation)\u061f", ["\u0642\u062a\u0644 \u0627\u0644\u0628\u0643\u062a\u064a\u0631\u064a\u0627", "\u062a\u062e\u062f\u064a\u0631 \u0627\u0644\u0623\u0646\u0641", "\u063a\u0633\u0644 \u0627\u0644\u0623\u0646\u0641 \u0645\u0646 \u0645\u0633\u0628\u0628\u0627\u062a \u0627\u0644\u062d\u0633\u0627\u0633\u064a\u0629 \u0648\u0627\u0644\u0648\u0633\u0637\u0627\u0621 \u0627\u0644\u0627\u0644\u062a\u0647\u0627\u0628\u064a\u064a\u0646", "\u062a\u0648\u0633\u064a\u0639 \u0627\u0644\u0634\u0631\u0627\u064a\u064a\u0646"], "\u063a\u0633\u0644 \u0627\u0644\u0623\u0646\u0641 \u0645\u0646 \u0645\u0633\u0628\u0628\u0627\u062a \u0627\u0644\u062d\u0633\u0627\u0633\u064a\u0629 \u0648\u0627\u0644\u0648\u0633\u0637\u0627\u0621 \u0627\u0644\u0627\u0644\u062a\u0647\u0627\u0628\u064a\u064a\u0646", "\u0637\u0631\u064a\u0642\u0629 \u0641\u064a\u0632\u064a\u0627\u0626\u064a\u0629 \u0622\u0645\u0646\u0629 \u0644\u062a\u0639\u0632\u064a\u0632 \u0627\u0644\u062a\u0646\u0638\u064a\u0641 \u0627\u0644\u0645\u062e\u0627\u0637\u064a \u0627\u0644\u0647\u062f\u0628\u064a."], ["\u0645\u0627 \u0647\u064a \u0627\u0644\u0628\u0643\u062a\u064a\u0631\u064a\u0627 \u0627\u0644\u0623\u0643\u062b\u0631 \u062a\u0633\u0628\u064a\u0628\u0627\u064b \u0644\u0627\u0644\u062a\u0647\u0627\u0628\u0627\u062a \u0627\u0644\u062c\u0641\u0648\u0646 \u0627\u0644\u0645\u0648\u0636\u0639\u064a\u0629\u061f", ["Streptococcus", "Pseudomonas", "Staphylococcus", "E. coli"], "Staphylococcus", "\u0628\u0643\u062a\u064a\u0631\u064a\u0627 \u062a\u0639\u064a\u0634 \u0637\u0628\u064a\u0639\u064a\u0627\u064b \u0639\u0644\u0649 \u0627\u0644\u062c\u0644\u062f \u0648\u0642\u062f \u062a\u0633\u0628\u0628 \u0639\u062f\u0648\u0649 \u0639\u0646\u062f \u062a\u0631\u0627\u0643\u0645\u0647\u0627."], ["\u0627\u0646\u0633\u062f\u0627\u062f \u0623\u064a \u063a\u062f\u0629 \u064a\u0633\u0628\u0628 \u0627\u0644\u0643\u064a\u0633 \u0627\u0644\u062f\u0647\u0646\u064a (Chalazion)\u061f", ["\u0627\u0644\u063a\u062f\u0629 \u0627\u0644\u062f\u0645\u0639\u064a\u0629", "\u063a\u062f\u0629 \u0627\u0644\u0639\u0631\u0642", "\u063a\u062f\u0629 \u0645\u064a\u0628\u0648\u0645\u064a\u0627\u0646 (Meibomian)", "\u0627\u0644\u063a\u062f\u0629 \u0627\u0644\u0644\u0639\u0627\u0628\u064a\u0629"], "\u063a\u062f\u0629 \u0645\u064a\u0628\u0648\u0645\u064a\u0627\u0646 (Meibomian)", "\u0648\u0647\u064a \u0627\u0644\u0645\u0633\u0624\u0648\u0644\u0629 \u0639\u0646 \u0625\u0641\u0631\u0627\u0632 \u0627\u0644\u0637\u0628\u0642\u0629 \u0627\u0644\u0632\u064a\u062a\u064a\u0629 \u0645\u0646 \u0627\u0644\u062f\u0645\u0648\u0639."], ["\u0645\u0627 \u0647\u0648 \u0627\u0644\u0641\u0627\u0631\u0642 \u0627\u0644\u0623\u0633\u0627\u0633\u064a \u0628\u064a\u0646 \u0627\u0644\u0634\u062d\u0627\u0630 (Stye) \u0648\u0627\u0644\u0643\u064a\u0633 \u0627\u0644\u062f\u0647\u0646\u064a (Chalazion)\u061f", ["\u0643\u0644\u0627\u0647\u0645\u0627 \u063a\u064a\u0631 \u0645\u0624\u0644\u0645", "\u0627\u0644\u0634\u062d\u0627\u0630 \u0645\u0624\u0644\u0645 \u0648\u062d\u0627\u062f\u061b \u0627\u0644\u0643\u064a\u0633 \u0627\u0644\u062f\u0647\u0646\u064a \u063a\u064a\u0631 \u0645\u0624\u0644\u0645 \u0648\u0645\u0632\u0645\u0646", "\u0627\u0644\u0643\u064a\u0633 \u0627\u0644\u062f\u0647\u0646\u064a \u0645\u0639\u062f\u064a \u062c\u062f\u0627\u064b", "\u0627\u0644\u0634\u062d\u0627\u0630 \u064a\u062d\u062a\u0627\u062c \u062c\u0631\u0627\u062d\u0629 \u0641\u0648\u0631\u064a\u0629"], "\u0627\u0644\u0634\u062d\u0627\u0630 \u0645\u0624\u0644\u0645 \u0648\u062d\u0627\u062f\u061b \u0627\u0644\u0643\u064a\u0633 \u0627\u0644\u062f\u0647\u0646\u064a \u063a\u064a\u0631 \u0645\u0624\u0644\u0645 \u0648\u0645\u0632\u0645\u0646", "\u0627\u0644\u0634\u062d\u0627\u0630 \u0639\u0628\u0627\u0631\u0629 \u0639\u0646 \u0639\u062f\u0648\u0649 \u0628\u0643\u062a\u064a\u0631\u064a\u0629 \u0646\u0634\u0637\u0629."], ["\u0639\u0644\u0627\u0645\u0629 \u0627\u0644\u062e\u0637\u0631 \u0627\u0644\u0645\u0637\u0644\u0642\u0629 (Red Flag) \u0641\u064a \u0623\u0645\u0631\u0627\u0636 \u0627\u0644\u062c\u0641\u0648\u0646 \u0648\u0627\u0644\u0639\u064a\u0646 \u0627\u0644\u062a\u064a \u062a\u062a\u0637\u0644\u0628 \u0625\u062d\u0627\u0644\u0629 \u0641\u0648\u0631\u064a\u0629\u061f", ["\u062d\u0643\u0629 \u062e\u0641\u064a\u0641\u0629", "\u0625\u0641\u0631\u0627\u0632\u0627\u062a \u0645\u0627\u0626\u064a\u0629", "\u062a\u0634\u0648\u0634 \u0623\u0648 \u062a\u0631\u0627\u062c\u0639 \u0627\u0644\u0631\u0624\u064a\u0629", "\u0642\u0634\u0648\u0631 \u0635\u0628\u0627\u062d\u064a\u0629"], "\u062a\u0634\u0648\u0634 \u0623\u0648 \u062a\u0631\u0627\u062c\u0639 \u0627\u0644\u0631\u0624\u064a\u0629", "\u0623\u064a \u062e\u0637\u0631 \u064a\u0647\u062f\u062f \u0627\u0644\u0628\u0635\u0631 \u064a\u062a\u0637\u0644\u0628 \u062a\u0642\u064a\u064a\u0645\u0627\u064b \u0637\u0628\u064a\u0627\u064b \u0637\u0627\u0631\u0626\u0627\u064b."], ["\u0645\u0627 \u0647\u064a \u0627\u0644\u062e\u0637\u0648\u0629 \u0627\u0644\u0623\u0633\u0627\u0633\u064a\u0629 \u0641\u064a \u0627\u0644\u0631\u0648\u062a\u064a\u0646 \u0627\u0644\u064a\u0648\u0645\u064a \u0644\u0639\u0644\u0627\u062c \u0627\u0644\u062a\u0647\u0627\u0628 \u0627\u0644\u062c\u0641\u0648\u0646 \u0627\u0644\u0645\u0632\u0645\u0646\u061f", ["\u063a\u0633\u0644 \u0627\u0644\u0639\u064a\u0646 \u0628\u0627\u0644\u0643\u062d\u0648\u0644", "\u062a\u0646\u0638\u064a\u0641 \u062d\u0648\u0627\u0641 \u0627\u0644\u062c\u0641\u0648\u0646 \u0628\u0634\u0627\u0645\u0628\u0648 \u0623\u0637\u0641\u0627\u0644 \u0645\u062e\u0641\u0641", "\u0641\u0631\u0643 \u0627\u0644\u0642\u0631\u0646\u064a\u0629", "\u0627\u0633\u062a\u062e\u062f\u0627\u0645 \u0635\u0627\u0628\u0648\u0646 \u0645\u0636\u0627\u062f \u0644\u0644\u0628\u0643\u062a\u064a\u0631\u064a\u0627"], "\u062a\u0646\u0638\u064a\u0641 \u062d\u0648\u0627\u0641 \u0627\u0644\u062c\u0641\u0648\u0646 \u0628\u0634\u0627\u0645\u0628\u0648 \u0623\u0637\u0641\u0627\u0644 \u0645\u062e\u0641\u0641", "\u0644\u0623\u0646\u0647 \u0644\u0627 \u064a\u0633\u0628\u0628 \u062f\u0645\u0648\u0639\u0627\u064b \u0648\u064a\u0632\u064a\u0644 \u0627\u0644\u0642\u0634\u0648\u0631 \u0628\u0644\u0637\u0641."], ["\u0645\u0627 \u0647\u064a \u0627\u0644\u0645\u062f\u0629 \u0627\u0644\u0645\u0648\u0635\u0649 \u0628\u0647\u0627 \u0644\u0648\u0636\u0639 \u0627\u0644\u0643\u0645\u0627\u062f\u0627\u062a \u0627\u0644\u062f\u0627\u0641\u0626\u0629 \u0639\u0644\u0649 \u0627\u0644\u062c\u0641\u0646\u061f", ["\u062f\u0642\u064a\u0642\u0629 \u0648\u0627\u062d\u062f\u0629", "10-15 \u062f\u0642\u064a\u0642\u0629", "\u0633\u0627\u0639\u0629 \u0643\u0627\u0645\u0644\u0629", "30 \u062b\u0627\u0646\u064a\u0629"], "10-15 \u062f\u0642\u064a\u0642\u0629", "\u0647\u0630\u0627 \u0627\u0644\u0648\u0642\u062a \u0643\u0627\u0641\u064d \u0644\u0625\u0630\u0627\u0628\u0629 \u0627\u0644\u0632\u064a\u0648\u062a \u0627\u0644\u0645\u062a\u0635\u0644\u0628\u0629 \u0641\u064a \u0627\u0644\u063a\u062f\u062f \u0627\u0644\u0645\u0633\u062f\u0648\u062f\u0629."], ["\u0645\u0627\u0630\u0627 \u062a\u0646\u0635\u062d \u0645\u0631\u064a\u0636\u0629 \u0628\u062e\u0635\u0648\u0635 \u0645\u0633\u062a\u062d\u0636\u0631\u0627\u062a \u062a\u062c\u0645\u064a\u0644 \u0627\u0644\u0639\u064a\u0646 (\u0645\u062b\u0644 \u0627\u0644\u0645\u0627\u0633\u0643\u0627\u0631\u0627) \u0628\u0639\u062f \u0627\u0644\u062a\u0639\u0627\u0641\u064a \u0645\u0646 \u0627\u0644\u0639\u062f\u0648\u0649\u061f", ["\u063a\u0644\u064a\u0647\u0627 \u0628\u0627\u0644\u0645\u0627\u0621", "\u0645\u0634\u0627\u0631\u0643\u062a\u0647\u0627 \u0645\u0639 \u0623\u062e\u0648\u0627\u062a\u0647\u0627", "\u0627\u0644\u062a\u062e\u0644\u0635 \u0645\u0646\u0647\u0627 \u0648\u0634\u0631\u0627\u0621 \u062c\u062f\u064a\u062f\u0629", "\u0648\u0636\u0639\u0647\u0627 \u0641\u064a \u0627\u0644\u062b\u0644\u0627\u062c\u0629"], "\u0627\u0644\u062a\u062e\u0644\u0635 \u0645\u0646\u0647\u0627 \u0648\u0634\u0631\u0627\u0621 \u062c\u062f\u064a\u062f\u0629", "\u0644\u062a\u062c\u0646\u0628 \u0625\u0639\u0627\u062f\u0629 \u0627\u0644\u0639\u062f\u0648\u0649 \u0628\u0627\u0644\u0628\u0643\u062a\u064a\u0631\u064a\u0627 \u0627\u0644\u0639\u0627\u0644\u0642\u0629 \u0628\u0647\u0627."], ["\u0625\u0630\u0627 \u0643\u0627\u0646 \u0627\u0644\u0627\u062d\u0645\u0631\u0627\u0631 \u0645\u0645\u062a\u062f\u0627\u064b \u062d\u0648\u0644 \u0627\u0644\u0639\u064a\u0646 \u0648\u064a\u0634\u0645\u0644 \u0627\u0644\u062c\u0644\u062f \u0627\u0644\u0645\u062d\u064a\u0637\u060c \u0645\u0627 \u0647\u0648 \u0627\u0644\u062a\u0634\u062e\u064a\u0635 \u0627\u0644\u0645\u062d\u062a\u0645\u0644\u061f", ["\u062c\u0641\u0627\u0641 \u0639\u064a\u0646", "\u062d\u0633\u0627\u0633\u064a\u0629 \u0628\u0633\u064a\u0637\u0629", "\u0627\u0644\u062a\u0647\u0627\u0628 \u0627\u0644\u0646\u0633\u064a\u062c \u0627\u0644\u062e\u0644\u0648\u064a (Cellulitis - \u0625\u062d\u0627\u0644\u0629 \u0639\u0627\u062c\u0644\u0629)", "\u0643\u064a\u0633 \u062f\u0647\u0646\u064a"], "\u0627\u0644\u062a\u0647\u0627\u0628 \u0627\u0644\u0646\u0633\u064a\u062c \u0627\u0644\u062e\u0644\u0648\u064a (Cellulitis - \u0625\u062d\u0627\u0644\u0629 \u0639\u0627\u062c\u0644\u0629)", "\u0639\u062f\u0648\u0649 \u0628\u0643\u062a\u064a\u0631\u064a\u0629 \u062e\u0637\u064a\u0631\u0629 \u062a\u0646\u062a\u0634\u0631 \u0641\u064a \u0627\u0644\u0623\u0646\u0633\u062c\u0629 \u0627\u0644\u0639\u0645\u064a\u0642\u0629."], ["\u0644\u0645\u0627\u0630\u0627 \u064a\u064f\u0645\u0646\u0639 \u0645\u0646\u0639\u0627\u064b \u0628\u0627\u062a\u0627\u064b \u0641\u0642\u0639 \u0623\u0648 \u0639\u0635\u0631 \u0627\u0644\u062d\u0628\u0648\u0628 \u0641\u064a \u0627\u0644\u062c\u0641\u0648\u0646 (Popping)\u061f", ["\u064a\u0633\u0628\u0628 \u0641\u0642\u062f\u0627\u0646 \u0627\u0644\u0631\u0645\u0648\u0634", "\u064a\u062f\u0641\u0639 \u0627\u0644\u0628\u0643\u062a\u064a\u0631\u064a\u0627 \u0648\u0627\u0644\u0639\u062f\u0648\u0649 \u0625\u0644\u0649 \u0627\u0644\u0623\u0646\u0633\u062c\u0629 \u0627\u0644\u0639\u0645\u064a\u0642\u0629 \u0644\u0644\u0639\u064a\u0646", "\u064a\u0633\u0628\u0628 \u062c\u0641\u0627\u0641 \u0627\u0644\u0642\u0631\u0646\u064a\u0629", "\u064a\u063a\u064a\u0631 \u0644\u0648\u0646 \u0627\u0644\u0639\u064a\u0646"], "\u064a\u062f\u0641\u0639 \u0627\u0644\u0628\u0643\u062a\u064a\u0631\u064a\u0627 \u0648\u0627\u0644\u0639\u062f\u0648\u0649 \u0625\u0644\u0649 \u0627\u0644\u0623\u0646\u0633\u062c\u0629 \u0627\u0644\u0639\u0645\u064a\u0642\u0629 \u0644\u0644\u0639\u064a\u0646", "\u0642\u062f \u064a\u0633\u0628\u0628 \u0627\u0646\u062a\u0634\u0627\u0631 \u0627\u0644\u0639\u062f\u0648\u0649 \u0627\u0644\u062e\u0637\u064a\u0631."], ["\u0645\u0627 \u0647\u0648 \u062f\u0648\u0631 \u0627\u0644\u062f\u0645\u0648\u0639 \u0627\u0644\u0627\u0635\u0637\u0646\u0627\u0639\u064a\u0629 (Lubricating drops) \u0641\u064a \u062c\u0641\u0627\u0641 \u0627\u0644\u0639\u064a\u0646\u061f", ["\u0642\u062a\u0644 \u0627\u0644\u0628\u0643\u062a\u064a\u0631\u064a\u0627", "\u062a\u0639\u0648\u064a\u0636 \u0627\u0644\u0637\u0628\u0642\u0629 \u0627\u0644\u062f\u0645\u0639\u064a\u0629 \u0648\u062a\u0631\u0637\u064a\u0628 \u0627\u0644\u0633\u0637\u062d", "\u062a\u0636\u064a\u064a\u0642 \u0627\u0644\u0623\u0648\u0639\u064a\u0629 \u0627\u0644\u062f\u0645\u0648\u064a\u0629", "\u062a\u0648\u0633\u064a\u0639 \u0627\u0644\u062d\u062f\u0642\u0629"], "\u062a\u0639\u0648\u064a\u0636 \u0627\u0644\u0637\u0628\u0642\u0629 \u0627\u0644\u062f\u0645\u0639\u064a\u0629 \u0648\u062a\u0631\u0637\u064a\u0628 \u0627\u0644\u0633\u0637\u062d", "\u062a\u0639\u062a\u0628\u0631 \u0627\u0644\u062e\u0637 \u0627\u0644\u0623\u0648\u0644 \u0644\u0639\u0644\u0627\u062c \u0623\u0639\u0631\u0627\u0636 \u0627\u0644\u062c\u0641\u0627\u0641."], ["\u0645\u0627 \u0647\u0648 \u0627\u0644\u0645\u0631\u0636 \u0627\u0644\u062c\u0647\u0627\u0632\u064a (\u0627\u0644\u0630\u064a \u064a\u0635\u064a\u0628 \u0627\u0644\u062c\u0633\u0645 \u0643\u0644\u0647) \u0627\u0644\u0645\u0631\u062a\u0628\u0637 \u0628\u0634\u062f\u0629 \u0628\u0627\u0644\u062a\u0647\u0627\u0628 \u0627\u0644\u062c\u0641\u0648\u0646 (Blepharitis)\u061f", ["\u0627\u0644\u0631\u0628\u0648", "\u0627\u0644\u0648\u0631\u062f\u064a\u0629 (Rosacea) \u0648\u0627\u0644\u062a\u0647\u0627\u0628 \u0627\u0644\u062c\u0644\u062f \u0627\u0644\u062f\u0647\u0646\u064a", "\u0627\u0644\u0633\u0643\u0631\u064a", "\u0627\u0644\u0636\u063a\u0637"], "\u0627\u0644\u0648\u0631\u062f\u064a\u0629 (Rosacea) \u0648\u0627\u0644\u062a\u0647\u0627\u0628 \u0627\u0644\u062c\u0644\u062f \u0627\u0644\u062f\u0647\u0646\u064a", "\u0623\u0645\u0631\u0627\u0636 \u062c\u0644\u062f\u064a\u0629 \u0645\u0632\u0645\u0646\u0629 \u062a\u0624\u062b\u0631 \u0639\u0644\u0649 \u0627\u0644\u063a\u062f\u062f \u0627\u0644\u062f\u0647\u0646\u064a\u0629."], ["\u0644\u0645\u0627\u0630\u0627 \u062a\u0633\u0648\u0621 \u0623\u0639\u0631\u0627\u0636 \u062c\u0641\u0627\u0641 \u0627\u0644\u0639\u064a\u0646 \u063a\u0627\u0644\u0628\u0627\u064b \u0641\u064a \u0627\u0644\u0635\u0628\u0627\u062d \u0627\u0644\u0628\u0627\u0643\u0631\u061f", ["\u0628\u0633\u0628\u0628 \u0636\u0648\u0621 \u0627\u0644\u0634\u0645\u0633", "\u0628\u0633\u0628\u0628 \u0627\u0646\u062e\u0641\u0627\u0636 \u0627\u0644\u0636\u063a\u0637 \u0644\u064a\u0644\u0627\u064b", "\u0644\u0639\u062f\u0645 \u0627\u0644\u0631\u0645\u0634 \u0623\u062b\u0646\u0627\u0621 \u0627\u0644\u0646\u0648\u0645 \u0648\u0627\u0644\u062a\u0635\u0627\u0642 \u0627\u0644\u062c\u0641\u0646 \u0628\u0627\u0644\u0642\u0631\u0646\u064a\u0629 \u0627\u0644\u062c\u0627\u0641\u0629", "\u0644\u0623\u0646 \u0627\u0644\u0639\u064a\u0646 \u062a\u0641\u0631\u0632 \u062f\u0645\u0648\u0639\u0627\u064b \u0643\u062b\u064a\u0631\u0629 \u0644\u064a\u0644\u0627\u064b"], "\u0644\u0639\u062f\u0645 \u0627\u0644\u0631\u0645\u0634 \u0623\u062b\u0646\u0627\u0621 \u0627\u0644\u0646\u0648\u0645 \u0648\u0627\u0644\u062a\u0635\u0627\u0642 \u0627\u0644\u062c\u0641\u0646 \u0628\u0627\u0644\u0642\u0631\u0646\u064a\u0629 \u0627\u0644\u062c\u0627\u0641\u0629", "\u064a\u0624\u062f\u064a \u0630\u0644\u0643 \u0644\u062a\u0645\u0632\u0642 \u062e\u0641\u064a\u0641 \u0641\u064a \u062e\u0644\u0627\u064a\u0627 \u0627\u0644\u0633\u0637\u062d \u0639\u0646\u062f \u0641\u062a\u062d \u0627\u0644\u0639\u064a\u0646."], ["\u0623\u064a \u0627\u0644\u0645\u0631\u0636\u0649 \u064a\u0639\u062a\u0628\u0631\u0648\u0646 \u0623\u0643\u062b\u0631 \u0639\u0631\u0636\u0629 \u0644\u0627\u0644\u062a\u0647\u0627\u0628\u0627\u062a \u0627\u0644\u0642\u0631\u0646\u064a\u0629 \u0627\u0644\u062e\u0637\u064a\u0631\u0629 \u0628\u0628\u0643\u062a\u064a\u0631\u064a\u0627 Pseudomonas\u061f", ["\u0643\u0628\u0627\u0631 \u0627\u0644\u0633\u0646", "\u0645\u0631\u0636\u0649 \u0627\u0644\u0631\u0628\u0648", "\u0645\u0633\u062a\u062e\u062f\u0645\u0648 \u0627\u0644\u0639\u062f\u0633\u0627\u062a \u0627\u0644\u0644\u0627\u0635\u0642\u0629 (\u062e\u0627\u0635\u0629 \u0623\u062b\u0646\u0627\u0621 \u0627\u0644\u0646\u0648\u0645)", "\u0627\u0644\u0623\u0637\u0641\u0627\u0644"], "\u0645\u0633\u062a\u062e\u062f\u0645\u0648 \u0627\u0644\u0639\u062f\u0633\u0627\u062a \u0627\u0644\u0644\u0627\u0635\u0642\u0629 (\u062e\u0627\u0635\u0629 \u0623\u062b\u0646\u0627\u0621 \u0627\u0644\u0646\u0648\u0645)", "\u062a\u062a\u0631\u0627\u0643\u0645 \u0627\u0644\u0628\u0643\u062a\u064a\u0631\u064a\u0627 \u062a\u062d\u062a \u0627\u0644\u0639\u062f\u0633\u0629 \u0641\u064a \u0628\u064a\u0626\u0629 \u062e\u0627\u0644\u064a\u0629 \u0645\u0646 \u0627\u0644\u0623\u0643\u0633\u062c\u064a\u0646."], ["\u0645\u0627 \u0647\u0648 \u0627\u0644\u0639\u0644\u0627\u062c \u0627\u0644\u0645\u0646\u0627\u0633\u0628 \u0644\u062d\u0643\u0629 \u0627\u0644\u0639\u064a\u0646 \u0627\u0644\u0634\u062f\u064a\u062f\u0629 \u0627\u0644\u0645\u0635\u0627\u062d\u0628\u0629 \u0644\u0645\u0648\u0633\u0645 \u0627\u0644\u0631\u0628\u064a\u0639\u061f", ["\u0645\u0636\u0627\u062f\u0627\u062a \u062d\u064a\u0648\u064a\u0629", "\u0642\u0637\u0631\u0627\u062a \u0645\u0636\u0627\u062f\u0629 \u0644\u0644\u0647\u064a\u0633\u062a\u0627\u0645\u064a\u0646", "\u0645\u062d\u0644\u0648\u0644 \u0645\u0644\u062d\u064a \u0641\u0642\u0637", "\u0643\u0648\u0631\u062a\u064a\u0632\u0648\u0646 \u0642\u0648\u064a"], "\u0642\u0637\u0631\u0627\u062a \u0645\u0636\u0627\u062f\u0629 \u0644\u0644\u0647\u064a\u0633\u062a\u0627\u0645\u064a\u0646", "\u062a\u0648\u0642\u0641 \u062a\u0641\u0627\u0639\u0644 \u0627\u0644\u062d\u0633\u0627\u0633\u064a\u0629 \u0627\u0644\u0645\u0633\u0628\u0628 \u0644\u0644\u062d\u0643\u0629."], ["\u0643\u064a\u0633 \u062f\u0647\u0646\u064a \u0645\u062a\u0643\u0631\u0631 \u0641\u064a \u0646\u0641\u0633 \u0627\u0644\u0645\u0643\u0627\u0646 \u0627\u0644\u062f\u0642\u064a\u0642 \u0644\u062c\u0641\u0646 \u0645\u0631\u064a\u0636 \u0645\u0633\u0646 \u064a\u062a\u0637\u0644\u0628 \u0625\u062d\u0627\u0644\u0629 \u0644\u0627\u0633\u062a\u0628\u0639\u0627\u062f\u061f", ["\u0627\u0644\u0633\u0643\u0631\u064a", "\u0627\u0644\u0645\u0627\u0621 \u0627\u0644\u0623\u0632\u0631\u0642 (\u0627\u0644\u062c\u0644\u0648\u0643\u0648\u0645\u0627)", "\u0633\u0631\u0637\u0627\u0646 \u0627\u0644\u063a\u062f\u062f \u0627\u0644\u062f\u0647\u0646\u064a\u0629 (Sebaceous gland carcinoma)", "\u0627\u0644\u0645\u0627\u0621 \u0627\u0644\u0623\u0628\u064a\u0636"], "\u0633\u0631\u0637\u0627\u0646 \u0627\u0644\u063a\u062f\u062f \u0627\u0644\u062f\u0647\u0646\u064a\u0629 (Sebaceous gland carcinoma)", "\u0627\u0644\u0623\u0643\u064a\u0627\u0633 \u0627\u0644\u0645\u062a\u0643\u0631\u0631\u0629 \u0641\u064a \u0646\u0641\u0633 \u0627\u0644\u0645\u0643\u0627\u0646 \u0642\u062f \u062a\u0646\u0630\u0631 \u0628\u0648\u0631\u0645 \u062e\u0628\u064a\u062b."], ["\u0627\u0644\u0633\u0628\u0628 \u0627\u0644\u0623\u0643\u062b\u0631 \u0634\u064a\u0648\u0639\u0627\u064b \u0644\u0641\u0642\u062f\u0627\u0646 \u0627\u0644\u0633\u0645\u0639 \u0627\u0644\u062a\u0648\u0635\u064a\u0644\u064a \u0627\u0644\u0630\u064a \u062a\u0631\u0627\u0647 \u0641\u064a \u0627\u0644\u0635\u064a\u062f\u0644\u064a\u0629\u061f", ["\u0627\u0644\u062a\u0647\u0627\u0628 \u0627\u0644\u0639\u0635\u0628", "\u0627\u0646\u062d\u0634\u0627\u0631 \u0634\u0645\u0639 \u0627\u0644\u0623\u0630\u0646 (Cerumen impaction)", "\u0637\u0646\u064a\u0646 \u0627\u0644\u0623\u0630\u0646", "\u062b\u0642\u0628 \u0627\u0644\u0637\u0628\u0644\u0629"], "\u0627\u0646\u062d\u0634\u0627\u0631 \u0634\u0645\u0639 \u0627\u0644\u0623\u0630\u0646 (Cerumen impaction)", "\u0627\u0646\u0633\u062f\u0627\u062f \u0645\u064a\u0643\u0627\u0646\u064a\u0643\u064a \u064a\u0645\u0646\u0639 \u0648\u0635\u0648\u0644 \u0627\u0644\u0635\u0648\u062a."], ["\u0639\u0644\u0627\u0645\u0629 \u0627\u0644\u062e\u0637\u0631 \u0627\u0644\u0642\u0635\u0648\u0649 (Red Flag) \u0639\u0646\u062f \u0641\u062d\u0635 \u0645\u0631\u064a\u0636 \u064a\u0639\u0627\u0646\u064a \u0645\u0646 \u0623\u0644\u0645 \u0641\u064a \u0627\u0644\u0623\u0630\u0646\u061f", ["\u062d\u0643\u0629 \u062e\u0641\u064a\u0641\u0629", "\u0627\u0644\u0634\u0639\u0648\u0631 \u0628\u0627\u0644\u0627\u0645\u062a\u0644\u0627\u0621", "\u062e\u0631\u0648\u062c \u0625\u0641\u0631\u0627\u0632\u0627\u062a \u0645\u062f\u0645\u0645\u0629 (\u062f\u0645 \u0645\u0646 \u0627\u0644\u0623\u0630\u0646)", "\u0648\u062c\u0648\u062f \u0634\u0645\u0639 \u0628\u0646\u064a"], "\u062e\u0631\u0648\u062c \u0625\u0641\u0631\u0627\u0632\u0627\u062a \u0645\u062f\u0645\u0645\u0629 (\u062f\u0645 \u0645\u0646 \u0627\u0644\u0623\u0630\u0646)", "\u064a\u0634\u064a\u0631 \u0625\u0644\u0649 \u0635\u062f\u0645\u0629\u060c \u062b\u0642\u0628 \u0634\u062f\u064a\u062f\u060c \u0623\u0648 \u0648\u0631\u0645."], ["\u0645\u0627 \u0647\u0648 \u0627\u0644\u0639\u0631\u0636 \u0627\u0644\u0633\u0631\u064a\u0631\u064a \u0627\u0644\u0630\u064a \u064a\u0645\u064a\u0632 \u0627\u0644\u062a\u0647\u0627\u0628 \u0627\u0644\u0623\u0630\u0646 \u0627\u0644\u062e\u0627\u0631\u062c\u064a\u0629 (\u0623\u0630\u0646 \u0627\u0644\u0633\u0628\u0627\u062d)\u061f", ["\u0623\u0644\u0645 \u0634\u062f\u064a\u062f \u0639\u0646\u062f \u0633\u062d\u0628 \u0634\u062d\u0645\u0629 \u0627\u0644\u0623\u0630\u0646 \u0623\u0648 \u0627\u0644\u0636\u063a\u0637 \u0639\u0644\u0649 \u0627\u0644\u0632\u0646\u0645\u0629 (Tragus)", "\u0623\u0644\u0645 \u0641\u064a \u0627\u0644\u062d\u0644\u0642", "\u0637\u0646\u064a\u0646 \u0646\u0627\u0628\u0636", "\u062f\u0648\u0627\u0631 \u0634\u062f\u064a\u062f"], "\u0623\u0644\u0645 \u0634\u062f\u064a\u062f \u0639\u0646\u062f \u0633\u062d\u0628 \u0634\u062d\u0645\u0629 \u0627\u0644\u0623\u0630\u0646 \u0623\u0648 \u0627\u0644\u0636\u063a\u0637 \u0639\u0644\u0649 \u0627\u0644\u0632\u0646\u0645\u0629 (Tragus)", "\u0627\u0644\u0627\u0644\u062a\u0647\u0627\u0628 \u064a\u0643\u0648\u0646 \u0641\u064a \u0627\u0644\u0642\u0646\u0627\u0629 \u0627\u0644\u062e\u0627\u0631\u062c\u064a\u0629 \u0644\u0644\u062c\u0644\u062f."], ["\u0644\u0645\u0627\u0630\u0627 \u064a\u062c\u0628 \u0646\u0635\u062d \u0627\u0644\u0645\u0631\u064a\u0636 \u0628\u0639\u062f\u0645 \u0627\u0633\u062a\u062e\u062f\u0627\u0645 \u0623\u0639\u0648\u0627\u062f \u0627\u0644\u0642\u0637\u0646 (Cotton buds) \u0644\u062a\u0646\u0638\u064a\u0641 \u0627\u0644\u0623\u0630\u0646\u061f", ["\u062a\u0633\u0628\u0628 \u062c\u0641\u0627\u0641 \u0627\u0644\u062c\u0644\u062f", "\u062a\u062f\u0641\u0639 \u0627\u0644\u0634\u0645\u0639 \u0639\u0645\u064a\u0642\u0627\u064b \u0648\u062a\u0633\u0628\u0628 \u0627\u0644\u0627\u0646\u062d\u0634\u0627\u0631 \u0648\u062a\u0632\u064a\u062f \u062e\u0637\u0631 \u062b\u0642\u0628 \u0627\u0644\u0637\u0628\u0644\u0629", "\u062a\u0633\u0628\u0628 \u062a\u0633\u0627\u0642\u0637 \u0627\u0644\u0634\u0639\u0631", "\u062a\u0633\u0628\u0628 \u0627\u0644\u0635\u062f\u0627\u0639"], "\u062a\u062f\u0641\u0639 \u0627\u0644\u0634\u0645\u0639 \u0639\u0645\u064a\u0642\u0627\u064b \u0648\u062a\u0633\u0628\u0628 \u0627\u0644\u0627\u0646\u062d\u0634\u0627\u0631 \u0648\u062a\u0632\u064a\u062f \u062e\u0637\u0631 \u062b\u0642\u0628 \u0627\u0644\u0637\u0628\u0644\u0629", "\u0627\u0644\u0623\u0630\u0646 \u062a\u0646\u0638\u0641 \u0646\u0641\u0633\u0647\u0627 \u0637\u0628\u064a\u0639\u064a\u0627\u064b \u0645\u0646 \u062e\u0644\u0627\u0644 \u062d\u0631\u0643\u0629 \u0627\u0644\u0641\u0643."], ["\u0637\u0641\u0644 \u064a\u0628\u0643\u064a\u060c \u064a\u0639\u0627\u0646\u064a \u0645\u0646 \u062d\u0645\u0649\u060c \u0648\u064a\u0634\u062f \u0623\u0630\u0646\u0647. \u0645\u0627 \u0647\u0648 \u0627\u0644\u062a\u0634\u062e\u064a\u0635 \u0627\u0644\u0645\u0631\u062c\u062d\u061f", ["\u0627\u0644\u062a\u0647\u0627\u0628 \u0627\u0644\u0623\u0630\u0646 \u0627\u0644\u0648\u0633\u0637\u0649 (Otitis Media)", "\u062a\u0631\u0627\u0643\u0645 \u0627\u0644\u0634\u0645\u0639", "\u0623\u0630\u0646 \u0627\u0644\u0633\u0628\u0627\u062d", "\u0637\u0646\u064a\u0646 \u0627\u0644\u0623\u0630\u0646"], "\u0627\u0644\u062a\u0647\u0627\u0628 \u0627\u0644\u0623\u0630\u0646 \u0627\u0644\u0648\u0633\u0637\u0649 (Otitis Media)", "\u0639\u062f\u0648\u0649 \u062e\u0644\u0641 \u0627\u0644\u0637\u0628\u0644\u0629 \u0634\u0627\u0626\u0639\u0629 \u062c\u062f\u0627\u064b \u0639\u0646\u062f \u0627\u0644\u0623\u0637\u0641\u0627\u0644."], ["\u0627\u0644\u0637\u0631\u064a\u0642\u0629 \u0627\u0644\u0635\u062d\u064a\u062d\u0629 \u0644\u0627\u0633\u062a\u062e\u062f\u0627\u0645 \u0642\u0637\u0631\u0627\u062a \u062a\u0644\u064a\u064a\u0646 \u0634\u0645\u0639 \u0627\u0644\u0623\u0630\u0646\u061f", ["\u0625\u0645\u0627\u0644\u0629 \u0627\u0644\u0631\u0623\u0633 \u0648\u0648\u0636\u0639 \u0627\u0644\u0642\u0637\u0631\u0629 \u0648\u0627\u0644\u0627\u0646\u062a\u0638\u0627\u0631 5 \u062f\u0642\u0627\u0626\u0642", "\u0648\u0636\u0639\u0647\u0627 \u0648\u0627\u0644\u0648\u0642\u0648\u0641 \u0641\u0648\u0631\u0627\u064b", "\u063a\u0644\u064a \u0627\u0644\u0642\u0637\u0631\u0629 \u0642\u0628\u0644 \u0627\u0644\u0627\u0633\u062a\u062e\u062f\u0627\u0645", "\u0627\u0633\u062a\u062e\u062f\u0627\u0645 \u0639\u0648\u062f \u0642\u0637\u0646 \u0628\u0639\u062f\u0647\u0627"], "\u0625\u0645\u0627\u0644\u0629 \u0627\u0644\u0631\u0623\u0633 \u0648\u0648\u0636\u0639 \u0627\u0644\u0642\u0637\u0631\u0629 \u0648\u0627\u0644\u0627\u0646\u062a\u0638\u0627\u0631 5 \u062f\u0642\u0627\u0626\u0642", "\u0644\u0644\u0633\u0645\u0627\u062d \u0644\u0644\u062c\u0627\u0630\u0628\u064a\u0629 \u0628\u0625\u0628\u0642\u0627\u0621 \u0627\u0644\u0633\u0627\u0626\u0644 \u0639\u0644\u0649 \u0627\u0644\u0634\u0645\u0639 \u0644\u062a\u0644\u064a\u064a\u0646\u0647."], ["\u0642\u0637\u0631\u0627\u062a \u0627\u0644\u0623\u0630\u0646 \u0627\u0644\u062a\u064a \u062a\u062d\u062a\u0648\u064a \u0639\u0644\u0649 \u0623\u0645\u064a\u0646\u0648\u063a\u0644\u064a\u0643\u0648\u0632\u064a\u062f\u0627\u062a \u064a\u0645\u0646\u0639 \u0627\u0633\u062a\u062e\u062f\u0627\u0645\u0647\u0627 \u0641\u064a \u062d\u0627\u0644\u0629\u061f", ["\u0627\u0644\u062a\u0647\u0627\u0628 \u0627\u0644\u0623\u0630\u0646 \u0627\u0644\u062e\u0627\u0631\u062c\u064a\u0629", "\u0648\u062c\u0648\u062f \u062b\u0642\u0628 \u0641\u064a \u0637\u0628\u0644\u0629 \u0627\u0644\u0623\u0630\u0646", "\u0634\u0645\u0639 \u0627\u0644\u0623\u0630\u0646", "\u0627\u0644\u0633\u0628\u0627\u062d\u0629"], "\u0648\u062c\u0648\u062f \u062b\u0642\u0628 \u0641\u064a \u0637\u0628\u0644\u0629 \u0627\u0644\u0623\u0630\u0646", "\u0644\u0623\u0646\u0647\u0627 \u0633\u0627\u0645\u0629 \u0644\u0644\u0623\u0630\u0646 \u0627\u0644\u062f\u0627\u062e\u0644\u064a\u0629 (Ototoxic) \u0648\u0642\u062f \u062a\u0633\u0628\u0628 \u0627\u0644\u0635\u0645\u0645."], ["\u0645\u062a\u0649 \u064a\u062c\u0628 \u0625\u062d\u0627\u0644\u0629 \u0645\u0631\u064a\u0636 \u064a\u0639\u0627\u0646\u064a \u0645\u0646 \u0637\u0646\u064a\u0646 \u0627\u0644\u0623\u0630\u0646 (Tinnitus) \u0628\u0634\u0643\u0644 \u0639\u0627\u062c\u0644\u061f", ["\u0625\u0630\u0627 \u0643\u0627\u0646 \u062e\u0641\u064a\u0641\u0627\u064b", "\u0625\u0630\u0627 \u0643\u0627\u0646 \u0627\u0644\u0637\u0646\u064a\u0646 \u0646\u0627\u0628\u0636\u0627\u064b (\u064a\u062a\u0648\u0627\u0641\u0642 \u0645\u0639 \u0646\u0628\u0636 \u0627\u0644\u0642\u0644\u0628) \u0623\u0648 \u0641\u064a \u0623\u0630\u0646 \u0648\u0627\u062d\u062f\u0629 \u0641\u0642\u0637", "\u0625\u0630\u0627 \u0643\u0627\u0646 \u0641\u064a \u0627\u0644\u0623\u0630\u0646\u064a\u0646", "\u0625\u0630\u0627 \u0631\u0627\u0641\u0642\u0647 \u0634\u0645\u0639"], "\u0625\u0630\u0627 \u0643\u0627\u0646 \u0627\u0644\u0637\u0646\u064a\u0646 \u0646\u0627\u0628\u0636\u0627\u064b (\u064a\u062a\u0648\u0627\u0641\u0642 \u0645\u0639 \u0646\u0628\u0636 \u0627\u0644\u0642\u0644\u0628) \u0623\u0648 \u0641\u064a \u0623\u0630\u0646 \u0648\u0627\u062d\u062f\u0629 \u0641\u0642\u0637", "\u0627\u0644\u0637\u0646\u064a\u0646 \u0627\u0644\u0646\u0627\u0628\u0636 \u0642\u062f \u064a\u0634\u064a\u0631 \u0625\u0644\u0649 \u0645\u0634\u0643\u0644\u0629 \u0641\u064a \u0627\u0644\u0623\u0648\u0639\u064a\u0629 \u0627\u0644\u062f\u0645\u0648\u064a\u0629."], ["\u0645\u0631\u064a\u0636 \u0633\u0643\u0631\u064a \u064a\u0639\u0627\u0646\u064a \u0645\u0646 \u0625\u0641\u0631\u0627\u0632\u0627\u062a \u0623\u0630\u0646 \u0635\u062f\u064a\u062f\u064a\u0629 \u0643\u0631\u064a\u0647\u0629 \u0627\u0644\u0631\u0627\u0626\u062d\u0629 \u0648\u0623\u0644\u0645 \u0645\u0628\u0631\u062d\u060c \u0645\u0627 \u0627\u0644\u062e\u0637\u0631 \u0627\u0644\u0645\u062d\u062a\u0645\u0644\u061f", ["\u0627\u0644\u062a\u0647\u0627\u0628 \u0623\u0630\u0646 \u062e\u0627\u0631\u062c\u064a\u0629 \u062e\u0628\u064a\u062b (Malignant Otitis Externa)", "\u062a\u0631\u0627\u0643\u0645 \u0634\u0645\u0639 \u0628\u0633\u064a\u0637", "\u062d\u0633\u0627\u0633\u064a\u0629 \u0623\u0630\u0646", "\u0637\u0646\u064a\u0646"], "\u0627\u0644\u062a\u0647\u0627\u0628 \u0623\u0630\u0646 \u062e\u0627\u0631\u062c\u064a\u0629 \u062e\u0628\u064a\u062b (Malignant Otitis Externa)", "\u0639\u062f\u0648\u0649 \u062e\u0637\u064a\u0631\u0629 \u0628\u0628\u0643\u062a\u064a\u0631\u064a\u0627 \u0627\u0644\u0632\u0627\u0626\u0641\u0629 (Pseudomonas) \u0642\u062f \u062a\u0635\u0644 \u0644\u0639\u0638\u0627\u0645 \u0627\u0644\u062c\u0645\u062c\u0645\u0629."], ["\u0644\u0645\u0627\u0630\u0627 \u0646\u0633\u062a\u062e\u062f\u0645 \u0632\u064a\u062a \u0627\u0644\u0632\u064a\u062a\u0648\u0646 \u0623\u0648 \u0628\u064a\u0643\u0631\u0628\u0648\u0646\u0627\u062a \u0627\u0644\u0635\u0648\u062f\u064a\u0648\u0645 \u0641\u064a \u0627\u0644\u0623\u0630\u0646\u061f", ["\u0644\u0642\u062a\u0644 \u0627\u0644\u0628\u0643\u062a\u064a\u0631\u064a\u0627", "\u0644\u062a\u0633\u0643\u064a\u0646 \u0627\u0644\u0623\u0644\u0645", "\u0644\u062a\u0644\u064a\u064a\u0646 \u0648\u062a\u0641\u0643\u064a\u0643 \u0634\u0645\u0639 \u0627\u0644\u0623\u0630\u0646 \u0627\u0644\u0635\u0644\u0628", "\u0644\u0639\u0644\u0627\u062c \u0627\u0644\u0637\u0646\u064a\u0646"], "\u0644\u062a\u0644\u064a\u064a\u0646 \u0648\u062a\u0641\u0643\u064a\u0643 \u0634\u0645\u0639 \u0627\u0644\u0623\u0630\u0646 \u0627\u0644\u0635\u0644\u0628", "\u0643\u062e\u0637\u0648\u0629 \u062a\u062d\u0636\u064a\u0631\u064a\u0629 \u0642\u0628\u0644 \u063a\u0633\u064a\u0644 \u0627\u0644\u0623\u0630\u0646 \u0627\u0644\u0637\u0628\u064a."], ["\u0643\u064a\u0641 \u064a\u0646\u062a\u0642\u0644 \u0627\u0644\u0623\u0644\u0645 \u0645\u0646 \u0627\u0644\u062d\u0644\u0642 \u0623\u0648 \u0627\u0644\u0623\u0633\u0646\u0627\u0646 \u0644\u064a\u0628\u062f\u0648 \u0648\u0643\u0623\u0646\u0647 \u0623\u0644\u0645 \u0641\u064a \u0627\u0644\u0623\u0630\u0646\u061f", ["\u0639\u0628\u0631 \u0627\u0644\u062f\u0645", "\u0623\u0644\u0645 \u0631\u062c\u064a\u0639 (Referred pain) \u0639\u0628\u0631 \u0627\u0644\u0623\u0639\u0635\u0627\u0628 \u0627\u0644\u0645\u0634\u062a\u0631\u0643\u0629", "\u0639\u0628\u0631 \u0642\u0646\u0627\u0629 \u0627\u0633\u062a\u0627\u0643\u064a\u0648\u0633", "\u0628\u0633\u0628\u0628 \u0627\u0644\u0634\u0645\u0639"], "\u0623\u0644\u0645 \u0631\u062c\u064a\u0639 (Referred pain) \u0639\u0628\u0631 \u0627\u0644\u0623\u0639\u0635\u0627\u0628 \u0627\u0644\u0645\u0634\u062a\u0631\u0643\u0629", "\u0634\u0627\u0626\u0639 \u062c\u062f\u0627\u064b \u0645\u0639 \u0645\u0634\u0627\u0643\u0644 \u0645\u0641\u0635\u0644 \u0627\u0644\u0641\u0643 (TMJ) \u0623\u0648 \u0623\u0636\u0631\u0627\u0633 \u0627\u0644\u0639\u0642\u0644."], ["\u0645\u0627 \u0647\u0648 \u0627\u0644\u062f\u0648\u0627\u0631 (Vertigo)\u061f", ["\u0633\u0645\u0627\u0639 \u0623\u0635\u0648\u0627\u062a \u0648\u0647\u0645\u064a\u0629", "\u0623\u0644\u0645 \u0641\u064a \u0637\u0628\u0644\u0629 \u0627\u0644\u0623\u0630\u0646", "\u0627\u0644\u0625\u062d\u0633\u0627\u0633 \u0627\u0644\u0632\u0627\u0626\u0641 \u0628\u0623\u0646 \u0627\u0644\u0645\u0631\u064a\u0636 \u0623\u0648 \u0627\u0644\u063a\u0631\u0641\u0629 \u062a\u062f\u0648\u0631 \u0645\u0646 \u062d\u0648\u0644\u0647", "\u0627\u0646\u0633\u062f\u0627\u062f \u0627\u0644\u0623\u0630\u0646"], "\u0627\u0644\u0625\u062d\u0633\u0627\u0633 \u0627\u0644\u0632\u0627\u0626\u0641 \u0628\u0623\u0646 \u0627\u0644\u0645\u0631\u064a\u0636 \u0623\u0648 \u0627\u0644\u063a\u0631\u0641\u0629 \u062a\u062f\u0648\u0631 \u0645\u0646 \u062d\u0648\u0644\u0647", "\u064a\u0631\u062a\u0628\u0637 \u063a\u0627\u0644\u0628\u0627\u064b \u0628\u0645\u0634\u0627\u0643\u0644 \u0627\u0644\u0623\u0630\u0646 \u0627\u0644\u062f\u0627\u062e\u0644\u064a\u0629."], ["\u0645\u0627 \u0647\u064a \u0623\u0641\u0636\u0644 \u0637\u0631\u064a\u0642\u0629 \u0644\u0644\u0648\u0642\u0627\u064a\u0629 \u0645\u0646 \u062a\u0643\u0631\u0627\u0631 \u0627\u0644\u062a\u0647\u0627\u0628 \u0623\u0630\u0646 \u0627\u0644\u0633\u0628\u0627\u062d\u061f", ["\u0627\u0633\u062a\u062e\u062f\u0627\u0645 \u0623\u0639\u0648\u0627\u062f \u0627\u0644\u0642\u0637\u0646", "\u062a\u062c\u0641\u064a\u0641 \u0627\u0644\u0623\u0630\u0646 \u062c\u064a\u062f\u0627\u064b \u0628\u0639\u062f \u0627\u0644\u0633\u0628\u0627\u062d\u0629 \u0648\u062a\u062c\u0646\u0628 \u062f\u062e\u0648\u0644 \u0627\u0644\u0645\u0627\u0621 \u0628\u0643\u062b\u0631\u0629", "\u0627\u0633\u062a\u062e\u062f\u0627\u0645 \u0645\u0636\u0627\u062f\u0627\u062a \u062d\u064a\u0648\u064a\u0629 \u064a\u0648\u0645\u064a\u0627\u064b", "\u0639\u062f\u0645 \u0627\u0644\u0627\u0633\u062a\u062d\u0645\u0627\u0645"], "\u062a\u062c\u0641\u064a\u0641 \u0627\u0644\u0623\u0630\u0646 \u062c\u064a\u062f\u0627\u064b \u0628\u0639\u062f \u0627\u0644\u0633\u0628\u0627\u062d\u0629 \u0648\u062a\u062c\u0646\u0628 \u062f\u062e\u0648\u0644 \u0627\u0644\u0645\u0627\u0621 \u0628\u0643\u062b\u0631\u0629", "\u0627\u0644\u0628\u064a\u0626\u0629 \u0627\u0644\u0631\u0637\u0628\u0629 \u0647\u064a \u0627\u0644\u062a\u064a \u062a\u0633\u0645\u062d \u0644\u0644\u0641\u0637\u0631\u064a\u0627\u062a \u0648\u0627\u0644\u0628\u0643\u062a\u064a\u0631\u064a\u0627 \u0628\u0627\u0644\u0646\u0645\u0648."], ["\u0641\u0642\u062f\u0627\u0646 \u0627\u0644\u0633\u0645\u0639 \u0627\u0644\u062a\u062f\u0631\u064a\u062c\u064a \u0627\u0644\u0645\u062a\u0645\u0627\u062b\u0644 \u0641\u064a \u0627\u0644\u0623\u0630\u0646\u064a\u0646 \u0644\u0643\u0628\u0627\u0631 \u0627\u0644\u0633\u0646 \u064a\u0633\u0645\u0649\u061f", ["\u0627\u0644\u062a\u0647\u0627\u0628 \u0627\u0644\u0623\u0630\u0646", "\u0637\u0646\u064a\u0646", "\u0627\u0644\u0635\u0645\u0645 \u0627\u0644\u0634\u064a\u062e\u0648\u062e\u064a (Presbycusis)", "\u062f\u0648\u0627\u0631"], "\u0627\u0644\u0635\u0645\u0645 \u0627\u0644\u0634\u064a\u062e\u0648\u062e\u064a (Presbycusis)", "\u062d\u0627\u0644\u0629 \u0637\u0628\u064a\u0639\u064a\u0629 \u0646\u0627\u062a\u062c\u0629 \u0639\u0646 \u0634\u064a\u062e\u0648\u062e\u0629 \u0627\u0644\u0639\u0635\u0628 \u0627\u0644\u0633\u0645\u0639\u064a."], ["\u0623\u0644\u0645 \u0627\u0644\u0623\u0630\u0646 \u0623\u062b\u0646\u0627\u0621 \u0627\u0644\u0637\u064a\u0631\u0627\u0646 (Barotrauma) \u064a\u062d\u062f\u062b \u0628\u0633\u0628\u0628\u061f", ["\u0639\u062f\u0648\u0649 \u0628\u0643\u062a\u064a\u0631\u064a\u0629", "\u0641\u0634\u0644 \u0642\u0646\u0627\u0629 \u0627\u0633\u062a\u0627\u0643\u064a\u0648\u0633 \u0641\u064a \u0645\u0633\u0627\u0648\u0627\u0629 \u0627\u0644\u0636\u063a\u0637 \u0628\u064a\u0646 \u0627\u0644\u0623\u0630\u0646 \u0627\u0644\u0648\u0633\u0637\u0649 \u0648\u0627\u0644\u062c\u0648", "\u0634\u0645\u0639 \u0627\u0644\u0623\u0630\u0646", "\u062a\u0645\u0632\u0642 \u0627\u0644\u0639\u0635\u0628"], "\u0641\u0634\u0644 \u0642\u0646\u0627\u0629 \u0627\u0633\u062a\u0627\u0643\u064a\u0648\u0633 \u0641\u064a \u0645\u0633\u0627\u0648\u0627\u0629 \u0627\u0644\u0636\u063a\u0637 \u0628\u064a\u0646 \u0627\u0644\u0623\u0630\u0646 \u0627\u0644\u0648\u0633\u0637\u0649 \u0648\u0627\u0644\u062c\u0648", "\u064a\u0633\u0628\u0628 \u0634\u062f\u0627\u064b \u0645\u0624\u0644\u0645\u0627\u064b \u0644\u0637\u0628\u0644\u0629 \u0627\u0644\u0623\u0630\u0646."], ["\u0627\u0644\u0623\u0644\u0645 \u0627\u0644\u0630\u064a \u064a\u062f\u0648\u0645 \u0644\u0623\u0643\u062b\u0631 \u0645\u0646 3 \u0623\u0634\u0647\u0631 \u0648\u064a\u0624\u062b\u0631 \u0639\u0644\u0649 \u062c\u0648\u062f\u0629 \u0627\u0644\u062d\u064a\u0627\u0629 \u064a\u0633\u0645\u0649\u061f", ["\u0623\u0644\u0645 \u062d\u0627\u062f", "\u0623\u0644\u0645 \u0645\u0632\u0645\u0646", "\u0623\u0644\u0645 \u0639\u0635\u0628\u064a", "\u0623\u0644\u0645 \u062c\u0633\u062f\u064a"], "\u0623\u0644\u0645 \u0645\u0632\u0645\u0646", "\u064a\u062a\u0637\u0644\u0628 \u063a\u0627\u0644\u0628\u0627\u064b \u0646\u0647\u062c\u0627\u064b \u0645\u062a\u0639\u062f\u062f \u0627\u0644\u062a\u062e\u0635\u0635\u0627\u062a \u0644\u0639\u0644\u0627\u062c\u0647."], ["\u0627\u0644\u0645\u0633\u0643\u0646 \u0627\u0644\u0645\u0641\u0636\u0644 \u0648\u0627\u0644\u062e\u0637 \u0627\u0644\u0623\u0648\u0644 \u0644\u0645\u0631\u0636\u0649 \u0642\u0631\u062d\u0629 \u0627\u0644\u0645\u0639\u062f\u0629 \u0623\u0648 \u0643\u0628\u06 0631\u0628\u0648 \u0628\u0627\u0644\u062d\u0630\u0631 \u0639\u0646\u062f \u0627\u0633\u062a\u062e\u062f\u0627\u0645 \u0627\u0644\u0623\u0633\u0628\u0631\u064a\u0646 \u0623\u0648 \u0627\u0644\u0625\u064a\u0628\u0648\u0628\u0631\u0648\u0641\u064a\u0646\u061f", ["\u062a\u0633\u0628\u0628 \u0627\u0644\u0633\u0639\u0627\u0644", "\u0642\u062f \u062a\u062d\u0641\u0632 \u062a\u0634\u0646\u062c \u0627\u0644\u0642\u0635\u0628\u0627\u062a \u0627\u0644\u0647\u0648\u0627\u0626\u064a\u0629 (NSAID-exacerbated respiratory disease)", "\u062a\u0633\u0628\u0628 \u062c\u0641\u0627\u0641 \u0627\u0644\u062d\u0644\u0642", "\u062a\u0628\u0637\u0626 \u0627\u0644\u062a\u0646\u0641\u0633"], "\u0642\u062f \u062a\u062d\u0641\u0632 \u062a\u0634\u0646\u062c \u0627\u0644\u0642\u0635\u0628\u0627\u062a \u0627\u0644\u0647\u0648\u0627\u0626\u064a\u0629 (NSAID-exacerbated respiratory disease)", "\u064a\u062d\u062f\u062b \u0641\u064a \u0646\u0633\u0628\u0629 \u0645\u0646 \u0645\u0631\u0636\u0649 \u0627\u0644\u0631\u0628\u0648."], ["\u0623\u062f\u0627\u0629 \u0627\u0644\u062a\u0642\u064a\u064a\u0645 \u0627\u0644\u0623\u0645\u062b\u0644 \u0644\u0645\u0639\u0631\u0641\u0629 \u062a\u0641\u0627\u0635\u064a\u0644 \u0627\u0644\u0623\u0644\u0645 \u0641\u064a \u0627\u0644\u0635\u064a\u062f\u0644\u064a\u0629\u061f", ["WWHAM", "SOCRATES", "ABCDE", "FACES"], "SOCRATES", "\u062a\u063a\u0637\u064a \u0627\u0644\u0645\u0648\u0642\u0639\u060c \u0627\u0644\u0628\u062f\u0627\u064a\u0629\u060c \u0627\u0644\u0637\u0628\u064a\u0639\u0629\u060c \u0627\u0644\u0627\u0646\u062a\u0634\u0627\u0631\u060c \u0648\u0627\u0644\u0623\u0639\u0631\u0627\u0636 \u0627\u0644\u0645\u0631\u0627\u0641\u0642\u0629."], ["\u0627\u0644\u062a\u0639\u0631\u064a\u0641 \u0627\u0644\u0637\u0628\u064a \u0627\u0644\u062f\u0642\u064a\u0642 \u0644\u0644\u0625\u0633\u0647\u0627\u0644 \u0647\u0648\u061f", ["\u0628\u0631\u0627\u0632 \u0633\u0627\u0626\u0644 \u0645\u0631\u0629 \u0648\u0627\u062d\u062f\u0629", "\u0645\u063a\u0635 \u0645\u0639 \u0628\u0631\u0627\ \u0646 \u0627\u0644\u0625\u0633\u0647\u0627\u0644 \u0627\u0644\u062d\u0627\u062f \u0648\u0627\u0644\u0630\u064a \u0646\u0647\u062f\u0641 \u0644\u0645\u0646\u0639\u0647\u061f", ["\u0627\u0644\u0633\u0645\u0646\u0629", "\u0627\u0644\u062c\u0641\u0627\u0641 \u0648\u0627\u062e\u062a\u0644\u0627\u0644 \u0627\u0644\u0634\u0648\u0627\u0631\u062f (Dehydration)", "\u0627\u0631\u062a\u0641\u0627\u0639 \u0627\u0644\u0636\u063a\u0637", "\u0627\u0644\u0635\u062f\u0627\u0639"], "\u0627\u0644\u062c\u0641\u0627\u0641 \u0648\u0627\u062e\u062a\u0644\u0627\u0644 \u0627\u0644\u0634\u0648\u0627\u0631\u062f (Dehydration)", "\u0642\u062f \u064a\u0643\u0648\u0646 \u0642\u0627\u062a\u0644\u0627\u064b \u062e\u0627\u0635\u0629 \u0644\u0644\u0623\u0637\u0641\u0627\u0644 \u0648\u0643\u0628\u0627\u0631 \u0627\u0644\u0633\u0646."], ["\u0625\u0633\u0647\u0627\u0644 \u0645\u0635\u062d\u0648\u0628 \u0628\u062f\u0645 \u0623\u0648 \u0645\u062e\u0627\u0637 (\u0632\u062d\u0627\u0631 - Dysentery) \u0645\u0639 \u062d\u0645\u0649 \u0639\u0627\u0644\u064a\u0629\u060c \u0645\u0627 \u0627\u0644\u0625\u062c\u0631\u0627\u0621\u061f", ["\u0648\u0635\u0641 \u0644\u0648\u0628\u064a\u0631\u0627\u0645\u064a\u062f", "\u0648\u0635\u0641 \u0645\u0633\u0643\u0646\u0627\u062a", "\u0625\u062d\u0627\u0644\u0629 \u0641\u0648\u0631\u064a\u0629 \u0644\u0644\u0637\u0628\u064a\u0628 \u0644\u0644\u0627\u0634\u062a\u0628\u0627\u0647 \u0628\u0639\u062f\u0648\u0649 \u0628\u0643\u062a\u064a\u0631\u064a\u0629 \u063a\u0627\u0632\u064a\u0629", "\u0634\u0631\u0628 \u0627\u0644\u0645\u0627\u0621 \u0641\u0642\u0637"], "\u0625\u062d\u0627\u0644\u0629 \u0641\u0648\u0631\u064a\u0629 \u0644\u0644\u0637\u0628\u064a\u0628 \u0644\u0644\u0627\u0634\u062a\u0628\u0627\u0647 \u0628\u0639\u062f\u0648\u0649 \u0628\u0643\u062a\u064a\u0631\u064a\u0629 \u063a\u0627\u0632\u064a\u0629", "\u0647\u0630\u0647 \u0639\u0644\u0627\u0645\u0627\u062a \u062e\u0637\u0631 (Red Flags) \u0644\u0627 \u062a\u064f\u0639\u0627\u0644\u062c \u0628\u0640 OTC."], ["\u0644\u0645\u0627\u0630\u0627 \u064a\u064f\u0645\u0646\u0639 \u0627\u0633\u062a\u062e\u062f\u0627\u0645 \u062f\u0648\u0627\u0621 \u0644\u0648\u0628\u064a\u0631\u0627\u0645\u064a\u062f (Loperamide) \u0641\u064a \u062d\u0627\u0644\u0627\u062a \u0627\u0644\u0625\u0633\u0647\u0627\u0644 \u0627\u0644\u062f\u0645\u0648\u064a (\u0627\u0644\u0632\u062d\u0627\u0631)\u061f", ["\u0644\u0623\u0646\u0647 \u0633\u064a\u0626 \u0627\u0644\u0637\u0639\u0645", "\u0644\u0623\u0646\u0647 \u064a\u0628\u0637\u0626 \u0627\u0644\u0623\u0645\u0639\u0627\u0621 \u0641\u064a\u062d\u062a\u062c\u0632 \u0627\u0644\u0628\u0643\u062a\u064a\u0631\u064a\u0627 \u0627\u0644\u063a\u0627\u0632\u064a\u0629 \u0648\u0627\u0644\u0633\u0645\u0648\u0645 \u062f\u0627\u062e\u0644 \u0627\u0644\u062c\u0633\u0645 \u0648\u064a\u0632\u064a\u062f \u0627\u0644\u0636\u0631\u0631", "\u0644\u0623\u0646\u0647 \u064a\u0633\u0628\u0628 \u0627\u0644\u0642\u064a\u0621", "\u0644\u0623\u0646\u0647 \u064a\u062e\u0641\u0636 \u0627\u0644\u0636\u063a\u0637"], "\u0644\u0623\u0646\u0647 \u064a\u0628\u0637\u0626 \u0627\u0644\u0623\u0645\u0639\u0627\u0621 \u0641\u064a\u062d\u062a\u062c\u0632 \u0627\u0644\u0628\u0643\u062a\u064a\u0631\u064a\u0627 \u0627\u0644\u063a\u0627\u0632\u064a\u0629 \u0648\u0627\u0644\u0633\u0645\u0648\u0645 \u062f\u0627\u062e\u0644 \u0627\u0644\u062c\u0633\u0645 \u0648\u064a\u0632\u064a\u062f \u0627\u0644\u0636\u0631\u0631", "\u0625\u064a\u0642\u0627\u0641 \u0627\u0644\u0625\u0633\u0647\u0627\u0644 \u0647\u0646\u0627 \u064a\u0645\u0646\u0639 \u0627\u0644\u062c\u0633\u0645 \u0645\u0646 \u0637\u0631\u062f \u0627\u0644\u0633\u0645\u0648\u0645."], ["\u0645\u0627 \u0647\u064a \u0627\u0644\u0622\u0644\u064a\u0629 \u0627\u0644\u0641\u0633\u064a\u0648\u0644\u0648\u062c\u064a\u0629 \u0644\u0645\u062d\u0644\u0648\u0644 \u0645\u0639\u0627\u0644\u062c\u0629 \u0627\u0644\u062c\u0641\u0627\u0641 (ORS)\u061f", ["\u0642\u062a\u0644 \u0627\u0644\u0641\u064a\u0631\u0648\u0633\u0627\u062a", "\u062a\u0633\u0643\u064a\u0646 \u0623\u0644\u0645 \u0627\u0644\u0645\u0639\u062f\u0629", "\u064a\u0633\u062a\u063a\u0644 \u0646\u0638\u0627\u0645 \u0627\u0644\u0646\u0642\u0644 \u0627\u0644\u0645\u0634\u062a\u0631\u0643 (\u0627\u0644\u0635\u0648\u062f\u064a\u0648\u0645/\u0627\u0644\u062c\u0644\u0648\u0643\u0648\u0632) \u0641\u064a \u0627\u0644\u0623\u0645\u0639\u0627\u0621 \u0644\u062a\u0633\u0631\u064a\u0639 \u0627\u0645\u062a\u0635\u0627\u0635 \u0627\u0644\u0645\u0627\u0621", "\u062a\u062c\u0645\u064a\u062f \u0627\u0644\u0628\u0631\u0627\u0632"], "\u064a\u0633\u062a\u063a\u0644 \u0646\u0638\u0627\u0645 \u0627\u0644\u0646\u0642\u0644 \u0627\u0644\u0645\u0634\u062a\u0631\u0643 (\u0627\u0644\u0635\u0648\u062f\u064a\u0648\u0645/\u0627\u0644\u062c\u0644\u0648\u0643\u0648\u0632) \u0641\u064a \u0627\u0644\u0623\u0645\u0639\u0627\u0621 \u0644\u062a\u0633\u0631\u064a\u0639 \u0627\u0645\u062a\u0635\u0627\u0635 \u0627\u0644\u0645\u0627\u0621", "\u0627\u0644\u062a\u0631\u0643\u064a\u0628\u0629 \u0627\u0644\u062f\u0642\u064a\u0642\u0629 \u0644\u0644\u0623\u0645\u0644\u0627\u062d \u0648\u0627\u0644\u0633\u0643\u0631 \u062a\u0646\u0642\u0630 \u0627\u0644\u062d\u064a\u0627\u0629."], ["\u0645\u062a\u0649 \u064a\u064f\u0645\u0646\u0639 \u0625\u0639\u0637\u0627\u0621 \u062f\u0648\u0627\u0621 \u0644\u0648\u0628\u064a\u0631\u0627\u0645\u064a\u062f (Loperamide) \u0628\u0646\u0627\u0621\u064b \u0639\u0644\u0649 \u0627\u0644\u0639\u0645\u0631\u061f", ["\u0644\u0644\u0628\u0627\u0644\u063a\u064a\u0646", "\u0644\u0644\u0623\u0637\u0641\u0627\u0644 \u062f\u0648\u0646 \u0633\u0646 12 \u0639\u0627\u0645\u0627\u064b", "\u0644\u0643\u0628\u0627\u0631 \u0627\u0644\u0633\u0646", "\u0644\u0644\u0645\u0631\u0627\u0647\u0642\u064a\u0646"], "\u0644\u0644\u0623\u0637\u0641\u0627\u0644 \u062f\u0648\u0646 \u0633\u0646 12 \u0639\u0627\u0645\u0627\u064b", "\u0628\u0633\u0628\u0628 \u062e\u0637\u0631 \u0634\u0644\u0644 \u0627\u0644\u0623\u0645\u0639\u0627\u0621 (Paralytic ileus) \u0648\u0627\u0644\u062a\u0633\u0645\u0645 \u0627\u0644\u062c\u0647\u0627\u0632\u064a."], ["\u062a\u063a\u064a\u0631 \u0645\u0633\u062a\u0645\u0631 \u0641\u064a \u0639\u0627\u062f\u0627\u062a \u0627\u0644\u0623\u0645\u0639\u0627\u0621 (\u0625\u0633\u0647\u0627\u0644 \u0623\u0648 \u0625\u0645\u0633\u0627\u0643) \u0644\u0645\u0631\u064a\u0636 \u0641\u0648\u0642 40 \u0633\u0646\u0629\u060c \u064a\u062a\u0637\u0644\u0628 \u0625\u062d\u0627\u0644\u0629 \u0644\u0627\u0633\u062a\u0628\u0639\u0627\u062f\u061f", ["\u0627\u0644\u0642\u0648\u0644\u0648\u0646 \u0627\u0644\u0639\u0635\u0628\u064a", "\u0633\u0631\u0637\u0627\u0646 \u0627\u0644\u0642\u0648\u0644\u0648\u0646 \u0648\u0627\u0644\u0645\u0633\u062a\u0642\u064a\u0645", "\u0627\u0644\u0642\u0631\u062d\u0629", "\u0627\u0644\u062a\u0648\u062a\u0631"], "\u0633\u0631\u0637\u0627\u0646 \u0627\u0644\u0642\u0648\u0644\u0648\u0646 \u0648\u0627\u0644\u0645\u0633\u062a\u0642\u064a\u0645", "\u0627\u0644\u062a\u063a\u064a\u0631 \u0627\u0644\u0645\u0633\u062a\u0645\u0631 \u0641\u064a \u0647\u0630\u0627 \u0627\u0644\u0639\u0645\u0631 \u0639\u0644\u0627\u0645\u0629 \u062e\u0637\u0631 \u0643\u0628\u0631\u0649."], ["\u0647\u0644 \u064a\u062c\u0628 \u0625\u064a\u0642\u0627\u0641 \u0627\u0644\u0631\u0636\u0627\u0639\u0629 \u0627\u0644\u0637\u0628\u064a\u0639\u064a\u0629 \u0644\u0644\u0637\u0641\u0644 \u0627\u0644\u0631\u0636\u064a\u0639 \u0627\u0644\u0645\u0635\u0627\u0628 \u0628\u0627\u0644\u0625\u0633\u0647\u0627\u0644\u061f", ["\u0646\u0639\u0645\u060c \u0644\u0625\u0631\u0627\u062d\u0629 \u0627\u0644\u0623\u0645\u0639\u0627\u0621", "\u0644\u0627\u060c \u064a\u062c\u0628 \u0627\u0644\u0627\u0633\u062a\u0645\u0631\u0627\u0631 \u0641\u064a \u0627\u0644\u0631\u0636\u0627\u0639\u0629 \u0648\u062a\u0642\u062f\u064a\u0645 \u0645\u062d\u0644\u0648\u0644 \u0627\u0644\u062c\u0641\u0627\u0641 \u0628\u064a\u0646 \u0627\u0644\u0631\u0636\u0639\u0627\u062a", "\u0646\u0639\u0645\u060c \u0648\u0627\u0633\u062a\u0628\u062f\u0627\u0644\u0647\u0627 \u0628\u062d\u0644\u064a\u0628 \u0635\u0646\u0627\u0639\u064a", "\u064a\u062c\u0628 \u0625\u0639\u0637\u0627\u0624\u0647 \u0645\u0627\u0621 \u0641\u0642\u0637"], "\u0644\u0627\u060c \u064a\u062c\u0628 \u0627\u0644\u0627\u0633\u062a\u0645\u0631\u0627\u0631 \u0641\u064a \u0627\u0644\u0631\u0636\u0627\u0639\u0629 \u0648\u062a\u0642\u062f\u064a\u0645 \u0645\u062d\u0644\u0648\u0644 \u0627\u0644\u062c\u0641\u0627\u0641 \u0628\u064a\u0646 \u0627\u0644\u0631\u0636\u0639\u0627\u062a", "\u064a\u062c\u0628 \u0627\u0644\u062d\u0641\u0627\u0638 \u0639\u0644\u0649 \u0627\u0644\u062a\u063a\u0630\u064a\u0629 \u0644\u0645\u0646\u0639 \u0633\u0648\u0621 \u0627\u0644\u062a\u063a\u0630\u064a\u0629."], ["\u0625\u0633\u0647\u0627\u0644 \u062f\u0647\u0646\u064a \u0643\u0631\u064a\u0647 \u0627\u0644\u0631\u0627\u0626\u062d\u0629 (Steatorrhea) \u0645\u0635\u062d\u0648\u0628 \u0628\u0646\u0642\u0635 \u0648\u0632\u0646 \u0648\u0623\u0646\u064a\u0645\u064a\u0627 \u0628\u0639\u062f \u062a\u0646\u0627\u0648\u0644 \u0627\u0644\u0642\u0645\u062d\u061f", ["\u0627\u0644\u0642\u0648\u0644\u0648\u0646 \u0627\u0644\u0639\u0635\u0628\u064a", "\u062d\u0633\u0627\u0633\u064a\u0629 \u0627\u0644\u0642\u0645\u062d (Celiac Disease)", "\u062a\u0633\u0645\u0645 \u063a\u0630\u0627\u0626\u064a", "\u0641\u064a\u0631\u0648\u0633 \u0631\u0648\u062a\u0627"], "\u062d\u0633\u0627\u0633\u064a\u0629 \u0627\u0644\u0642\u0645\u062d (Celiac Disease)", "\u062a\u0641\u0627\u0639\u0644 \u0645\u0646\u0627\u0639\u064a \u0636\u062f \u0627\u0644\u062c\u0644\u0648\u062a\u064a\u0646 \u064a\u062f\u0645\u0631 \u0632\u063a\u0627\u0628\u0627\u062a \u0627\u0644\u0623\u0645\u0639\u0627\u0621."], ["\u0625\u0633\u0647\u0627\u0644 \u0645\u0627\u0626\u064a \u0634\u062f\u064a\u062f \u0648\u0643\u0631\u064a\u0647 \u0627\u0644\u0631\u0627\u0626\u062d\u0629 \u0638\u0647\u0631 \u0628\u0639\u062f \u0625\u0646\u0647\u0627\u0621 \u0643\u0648\u0631\u0633 \u0645\u0646 \u0627\u0644\u0645\u0636\u0627\u062f\u0627\u062a \u0627\u0644\u062d\u064a\u0648\u064a\u0629 \u0648\u0627\u0633\u0639\u0629 \u0627\u0644\u0637\u064a\u0641\u061f", ["\u0639\u062f\u0648\u0649 \u0646\u0648\u0631\u0648\u0641\u064a\u0631\u0648\u0633", "\u0639\u062f\u0648\u0649 \u0627\u0644\u0645\u0637\u062b\u064a\u0629 \u0627\u0644\u0639\u0633\u064a\u0631\u0629 (Clostridioides difficile)", "\u0639\u0633\u0631 \u0647\u0636\u0645", "\u062d\u0633\u0627\u0633\u064a\u0629 \u0627\u0644\u0644\u0627\u0643\u062a\u0648\u0632"], "\u0639\u062f\u0648\u0649 \u0627\u0644\u0645\u0637\u062b\u064a\u0629 \u0627\u0644\u0639\u0633\u064a\u0631\u0629 (Clostridioides difficile)", "\u0627\u0644\u0645\u0636\u0627\u062f \u0627\u0644\u062d\u064a\u0648\u064a \u0642\u062a\u0644 \u0627\u0644\u0628\u0643\u062a\u064a\u0631\u064a\u0627 \u0627\u0644\u0646\u0627\u0641\u0639\u0629 \u0641\u0633\u0645\u062d \u0644\u0647\u0630\u0647 \u0627\u0644\u0628\u0643\u062a\u064a\u0631\u064a\u0627 \u0627\u0644\u0636\u0627\u0631\u0629 \u0628\u0627\u0644\u0646\u0645\u0648."], ["\u062f\u0648\u0627\u0621 (Bismuth Subsalicylate) \u064a\u0645\u0643\u0646 \u0623\u0646 \u064a\u0633\u0628\u0628 \u062a\u0623\u062b\u064a\u0631\u0627\u064b \u062c\u0627\u0646\u0628\u064a\u0627\u064b \u063a\u064a\u0631 \u0636\u0627\u0631 \u0648\u0644\u0643\u0646\u0647 \u0645\u062e\u064a\u0641 \u0644\u0644\u0645\u0631\u064a\u0636\u061f", ["\u062a\u0644\u0648\u0646 \u0627\u0644\u0628\u0648\u0644 \u0628\u0627\u0644\u0623\u062d\u0645\u0631", "\u0627\u0633\u0648\u062f\u0627\u062f \u0644\u0648\u0646 \u0627\u0644\u0628\u0631\u0627\u0632 \u0648\u0627\u0644\u0644\u0633\u0627\u0646", "\u0627\u0635\u0641\u0631\u0627\u0631 \u0627\u0644\u0639\u064a\u0646\u064a\u0646", "\u062a\u0633\u0627\u0642\u0637 \u0627\u0644\u0634\u0639\u0631"], "\u0627\u0633\u0648\u062f\u0627\u062f \u0644\u0648\u0646 \u0627\u0644\u0628\u0631\u0627\u0632 \u0648\u0627\u0644\u0644\u0633\u0627\u0646", "\u0628\u0633\u0628\u0628 \u062a\u0641\u0627\u0639\u0644 \u0627\u0644\u0628\u0632\u0645\u0648\u062a \u0645\u0639 \u0627\u0644\u0643\u0628\u0631\u064a\u062a \u0641\u064a \u0627\u0644\u062c\u0647\u0627\u0632 \u0627\u0644\u0647\u0636\u0645\u064a."], ["\u0645\u0627 \u0647\u0648 \u0627\u0644\u0645\u0639\u062f\u0646 \u0627\u0644\u0630\u064a \u062a\u0648\u0635\u064a \u0645\u0646\u0638\u0645\u0629 \u0627\u0644\u0635\u062d\u0629 \u0627\u0644\u0639\u0627\u0644\u0645\u064a\u0629 \u0628\u0625\u0639\u0637\u0627\u0626\u0647 \u0644\u0644\u0623\u0637\u0641\u0627\u0644 \u0645\u0639 \u0645\u062d\u0644\u0648\u0644 \u0627\u0644\u062c\u0641\u0627\u0641 \u0644\u062a\u0642\u0644\u064a\u0644 \u0645\u062f\u0629 \u0627\u0644\u0625\u0633\u0647\u0627\u0644\u061f", ["\u0627\u0644\u062d\u062f\u064a\u062f", "\u0627\u0644\u0643\u0627\u0644\u0633\u064a\u0648\u0645", "\u0627\u0644\u0632\u0646\u0643", "\u0627\u0644\u0645\u063a\u0646\u064a\u0633\u064a\u0648\u0645"], "\u0627\u0644\u0632\u0646\u0643", "\u064a\u0633\u0627\u0639\u062f \u0641\u064a \u062a\u0631\u0645\u064a\u0645 \u0628\u0637\u0627\u0646\u0629 \u0627\u0644\u0623\u0645\u0639\u0627\u0621 \u0648\u062f\u0639\u0645 \u0627\u0644\u0645\u0646\u0627\u0639\u0629."], ["\u0625\u0630\u0627 \u0644\u0645 \u064a\u0633\u062a\u0637\u0639 \u0627\u0644\u0637\u0641\u0644 \u0627\u0644\u0645\u0635\u0627\u0628 \u0628\u0627\u0644\u0625\u0633\u0647\u0627\u0644 \u0627\u0644\u0627\u062d\u062a\u0641\u0627\u0638 \u0628\u0645\u062d\u0644\u0648\u0644 \u0627\u0644\u062c\u0641\u0627\u0641 \u0628\u0633\u0628\u0628 \u0627\u0644\u0642\u064a\u0621 \u0627\u0644\u0645\u0633\u062a\u0645\u0631 \u0648\u0627\u0644\u0645\u062a\u0643\u0631\u0631\u060c \u0645\u0627 \u0627\u0644\u0625\u062c\u0631\u0627\u0621\u061f", ["\u0625\u064a\u0642\u0627\u0641 \u0627\u0644\u0645\u062d\u0644\u0648\u0644 \u062a\u0645\u0627\u0645\u0627\u064b", "\u0625\u062d\u0627\u0644\u0629 \u0637\u0627\u0631\u0626\u0629 \u0644\u0644\u0645\u0633\u062a\u0634\u0641\u0649 \u0644\u0644\u062d\u0635\u0648\u0644 \u0639\u0644\u0649 \u0633\u0648\u0627\u0626\u0644 \u0648\u0631\u064a\u062f\u064a\u0629 (IV Fluids)", "\u0625\u0639\u0637\u0627\u0624\u0647 \u0623\u0639\u0634\u0627\u0628 \u0633\u0627\u062e\u0646\u0629", "\u0625\u0639\u0637\u0627\u0624\u0647 \u0645\u0636\u0627\u062f \u062d\u064a\u0648\u064a"], "\u0625\u062d\u0627\u0644\u0629 \u0637\u0627\u0631\u0626\u0629 \u0644\u0644\u0645\u0633\u062a\u0634\u0641\u0649 \u0644\u0644\u062d\u0635\u0648\u0644 \u0639\u0644\u0649 \u0633\u0648\u0627\u0626\u0644 \u0648\u0631\u064a\u062f\u064a\u0629 (IV Fluids)", "\u0644\u0623\u0646\u0647 \u0633\u064a\u062f\u062e\u0644 \u0641\u064a \u062c\u0641\u0627\u0641 \u0633\u0631\u064a\u0639 \u0625\u0630\u0627 \u0641\u0634\u0644 \u0627\u0644\u0625\u0645\u0647\u0627\u0621 \u0627\u0644\u0641\u0645\u0648\u064a."], ["\u062a\u0646\u0627\u0648\u0644 \u0645\u0646\u062a\u062c\u0627\u062a \u0627\u0644\u0623\u0644\u0628\u0627\u0646 \u0644\u0645\u0631\u064a\u0636 \u064a\u0639\u0627\u0646\u064a \u0645\u0646 \u062d\u0633\u0627\u0633\u064a\u0629 \u0627\u0644\u0644\u0627\u0643\u062a\u0648\u0632 \u064a\u0633\u0628\u0628 \u0625\u0633\u0647\u0627\u0644\u0627\u064b \u0645\u0646 \u0623\u064a \u0646\u0648\u0639\u061f", ["\u0625\u0633\u0647\u0627\u0644 \u062a\u0646\u0627\u0636\u062d\u064a (Osmotic)", "\u0625\u0633\u0647\u0627\u0644 \u0625\u0641\u0631\u0627\u0632\u064a (Secretory)", "\u0625\u0633\u0647\u0627\u0644 \u0627\u0644\u062a\u0647\u0627\u0628\u064a", "\u0625\u0633\u0647\u0627\u0644 \u0646\u0636\u062d\u064a"], "\u0625\u0633\u0647\u0627\u0644 \u062a\u0646\u0627\u0636\u062d\u064a (Osmotic)", "\u062c\u0632\u064a\u0626\u0627\u062a \u0633\u0643\u0631 \u0627\u0644\u0644\u0627\u0643\u062a\u0648\u0632 \u063a\u064a\u0631 \u0627\u0644\u0645\u0647\u0636\u0648\u0645\u0629 \u062a\u0633\u062d\u0628 \u0627\u0644\u0645\u0627\u0621 \u0625\u0644\u0649 \u062f\u0627\u062e\u0644 \u0627\u0644\u0623\u0645\u0639\u0627\u0621."], ["\u0645\u0627 \u0647\u0648 \u0627\u0644\u0645\u0643\u0645\u0644 \u0627\u0644\u063a\u0630\u0627\u0626\u064a \u0627\u0644\u0630\u064a \u064a\u064f\u0635\u0631\u0641 \u0628\u0643\u062b\u0631\u0629 \u0644\u0644\u062d\u0648\u0627\u0645\u0644 \u0648\u064a\u0633\u0628\u0628 \u0625\u0645\u0633\u0627\u0643\u0627\u064b \u0634\u062f\u064a\u062f\u0627\u064b \u0648\u0644\u0648\u0646 \u0628\u0631\u0627\u0632 \u0623\u0633\u0648\u062f\u061f", ["\u0641\u064a\u062a\u0627\u0645\u064a\u0646 C", "\u0627\u0644\u0645\u063a\u0646\u064a\u0633\u064a\u0648\u0645", "\u0627\u0644\u062d\u062f\u064a\u062f", "\u0627\u0644\u0643\u0627\u0644\u0633\u064a\u0648\u0645"], "\u0627\u0644\u062d\u062f\u064a\u062f", "\u064a\u062c\u0628 \u0637\u0645\u0623\u0646\u0629 \u0627\u0644\u0645\u0631\u064a\u0636\u0629 \u0623\u0646 \u0644\u0648\u0646 \u0627\u0644\u0628\u0631\u0627\u0632 \u0627\u0644\u0623\u0633\u0648\u062f \u0637\u0628\u064a\u0639\u064a."], ["\u0643\u064a\u0641 \u062a\u0633\u0628\u0628 \u0645\u0633\u0643\u0646\u0627\u062a \u0627\u0644\u0623\u0644\u0645 \u0627\u0644\u0623\u0641\u064a\u0648\u0646\u064a\u0629 (Opioids) \u0645\u062b\u0644 \u0627\u0644\u0643\u0648\u062f\u0627\u064a\u064a\u0646 \u0627\u0644\u0625\u0645\u0633\u0627\u0643\u061f", ["\u062a\u0632\u064a\u062f \u0627\u0644\u062d\u0645\u0648\u0636\u0629", "\u062a\u062b\u0628\u0637 \u0627\u0644\u062d\u0631\u0643\u0629 \u0627\u0644\u062a\u0645\u0639\u062c\u064a\u0629 \u0644\u0644\u0623\u0645\u0639\u0627\u0621 \u0648\u062a\u0635\u064a\u0628\u0647\u0627 \u0628\u0627\u0644\u062e\u0645\u0648\u0644", "\u062a\u0632\u064a\u062f \u0645\u0646 \u0625\u0641\u0631\u0627\u0632 \u0627\u0644\u0645\u0627\u0621 \u0641\u064a \u0627\u0644\u0623\u0645\u0639\u0627\u0621", "\u062a\u0642\u062a\u0644 \u0627\u0644\u0628\u0643\u062a\u064a\u0631\u064a\u0627 \u0627\u0644\u0646\u0627\u0641\u0639\u0629"], "\u062a\u062b\u0628\u0637 \u0627\u0644\u062d\u0631\u0643\u0629 \u0627\u0644\u062a\u0645\u0639\u062c\u064a\u0629 \u0644\u0644\u0623\u0645\u0639\u0627\u0621 \u0648\u062a\u0635\u064a\u0628\u0647\u0627 \u0628\u0627\u0644\u062e\u0645\u0648\u0644", "\u0644\u0630\u0644\u0643 \u064a\u062c\u0628 \u062f\u0627\u0626\u0645\u0627\u064b \u0648\u0635\u0641 \u0645\u0644\u064a\u0646 \u0645\u0646\u0628\u0647 \u0645\u0639\u0647\u0627 \u0643\u0625\u062c\u0631\u0627\u0621 \u0648\u0642\u0627\u0626\u064a."], ["\u0645\u0627 \u0647\u0648 \u0627\u0644\u0645\u0644\u064a\u0646 \u0627\u0644
