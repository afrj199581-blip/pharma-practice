op is contraindicated if a patient has a suspected perforated eardrum?", "options": ["Ciprofloxacin", "Aminoglycosides (e.g., Neomycin)", "Saline", "Olive oil"], "ans": "Aminoglycosides (e.g., Neomycin)", "hint": "Highly ototoxic to the inner ear."}, {"q": "A patient complains of ear pain that worsens when chewing, but the ear exam is normal. What is a likely cause?", "options": ["TMJ (Temporomandibular Joint) disorder", "Otitis Media", "Wax impaction", "Meniere's"], "ans": "TMJ (Temporomandibular Joint) disorder", "hint": "Referred pain from the jaw."}, {"q": "How long should a patient use olive oil drops before attempting ear syringing/irrigation at the clinic?", "options": ["1 day", "3 to 5 days", "14 days", "1 month"], "ans": "3 to 5 days", "hint": "Softens the wax adequately."}, {"q": "What is a common complication of flying with an active upper respiratory tract infection?", "options": ["Otitis externa", "Barotrauma (Eustachian tube dysfunction)", "Tinnitus", "Ear wax buildup"], "ans": "Barotrauma (Eustachian tube dysfunction)", "hint": "Inability to equalize pressure."}, {"q": "Fungal Otitis Externa (Otomycosis) is typically caused by?", "options": ["Staphylococcus", "Pseudomonas", "Aspergillus or Candida", "Rhinovirus"], "ans": "Aspergillus or Candida", "hint": "Spores or yeast in the ear canal."}, {"q": "Which medication class is known to cause reversible tinnitus at high doses?", "options": ["Beta-blockers", "Salicylates (Aspirin)", "Statins", "Proton Pump Inhibitors"], "ans": "Salicylates (Aspirin)", "hint": "Classic side effect of high-dose NSAIDs."}, {"q": "Proper technique for using an intranasal corticosteroid spray involves:", "options": ["Pointing the nozzle towards the nasal septum", "Pointing away from the septum (towards the ear)", "Inhaling as forcefully as possible", "Lying down"], "ans": "Pointing away from the septum (towards the ear)", "hint": "Prevents septum irritation and epistaxis (nosebleeds)."}, {"q": "Which rhinitis treatment works by ions", "hint": "Norovirus is highly resistant to alcohol sanitizers."}, {"q": "Diarrhoea after eating bread, pasta, or oats, accompanied by weight loss and anemia, is a red flag for:", "options": ["IBS", "Celiac Disease", "Viral gastroenteritis", "Lactose intolerance"], "ans": "Celiac Disease", "hint": "Autoimmune reaction to gluten."}, {"q": "What is a harmless but alarming side effect of Bismuth Subsalicylate (Pepto-Bismol)?", "options": ["Green urine", "Black, tarry stools and dark tongue", "Yellow skin", "Blue vision"], "ans": "Black, tarry stools and dark tongue", "hint": "Reacts with sulfur in the digestive tract."}, {"q": "The WHO recommends supplementing which mineral in children with acute diarrhoea to reduce duration and recurrence?", "options": ["Iron", "Zinc", "Magnesium", "Calcium"], "ans": "Zinc", "hint": "Supports immune function and intestinal mucosa repair."}, {"q": "Lactose intolerance causes what type of diarrhoea?", "options": ["Secretory", "Osmotic", "Inflammatory", "Exudative"], "ans": "Osmotic", "hint": "Unabsorbed sugar draws water into the gut."}, {"q": "Varenicline (Champix) helps smoking cessation by:", "options": ["Providing pure nicotine", "Acting as a partial agonist at nicotinic receptors", "Making cigarettes taste bad", "Blocking serotonin"], "ans": "Acting as a partial agonist at nicotinic receptors", "hint": "Reduces cravings and blocks the reward of smoking."}, {"q": "Bupropion (Zyban) is contraindicated in patients with a history of:", "options": ["Asthma", "Seizures or eating disorders", "Hypertension", "Glaucoma"], "ans": "Seizures or eating disorders", "hint": "It lowers the seizure threshold."}, {"q": "Smoking cessation induces CYP1A2 enzymes to return to normal, which can cause toxicity if the patient is on:", "options": ["Paracetamol", "Clozapine, Olanzapine, or Theophylline", "Ibuprofen", "Loratadine"], "ans": "Clozapine, Olanzapine, or Theophylline", "hint": "Smoking speeds up their metabolism; quitting slows it down, raising drug levels."}, {"q": "A patient using NRT gum complains of a sore jaw. What is the likely error?", "options": ["Using expired gum", "Chewing it continuously like regular gum", "Drinking water", "Swallowing it"], "ans": "Chewing it continuously like regular gum", "hint": "Must use the 'Chew and Park' method."}, {"q": "What is a common metabolic change post-smoking cessation that patients should be counseled on?", "options": ["Hair loss", "Mild weight gain", "Weight loss", "Osteoporosis"], "ans": "Mild weight gain", "hint": "Nicotine is an appetite suppressant and boosts metabolism slightly."}, {"q": "Macrogol (Polyethylene glycol) works as a:", "options": ["Stimulant", "Osmotic laxative", "Bulk-forming", "Softener"], "ans": "Osmotic laxative", "hint": "Retains water in the stool without causing gas."}, {"q": "Chronic use of Senna can cause a harmless, dark pigmentation of the colon known as:", "options": ["Melanoma", "Melanosis coli", "Ischemic colitis", "Ulcerative colitis"], "ans": "Melanosis coli", "hint": "Visible on colonoscopy, reverses upon stopping."}, {"q": "Which laxative lowers stool surface tension, allowing water and fats to penetrate?", "options": ["Bisacodyl", "Docusate Sodium", "Lactulose", "Ispaghula"], "ans": "Docusate Sodium", "hint": "Acts as a surfactant/softener."}, {"q": "Hypothyroidism commonly causes which GI symptom?", "options": ["Severe diarrhoea", "Constipation", "Acid reflux", "Vomiting"], "ans": "Constipation", "hint": "Slows down all metabolic processes, including peristalsis."}, {"q": "A toddler crossing their legs, hiding, and dancing may be exhibiting:", "options": ["Abdominal pain", "Stool withholding behavior", "Seizures", "Normal play"], "ans": "Stool withholding behavior", "hint": "Fear of painful defecation causes them to hold it in."}, {"q": "For immediate relief of severe, low-rectal fecal impaction, what is the best route?", "options": ["Oral bulk laxative", "Glycerin suppository or Enema", "Oral stimulant", "IV fluids"     let currentQ = 0;
    let score = 0;

    function render() {
        const qBox = document.getElementById('q-box');
        if (currentQ >= questions.length) {
            const pct = Math.round((score / questions.length) * 100);
            qBox.innerHTML = `
                <div style="text-align: center; padding: 30px 0;">
                    <h2 style="color: #2c3e50; font-size: 2.2rem; margin-bottom: 10px;">Mastery Achieved!</h2>
                    <p style="font-size: 1.8rem; color: ${pct >= 80 ? '#27ae60' : '#e74c3c'}; font-weight: bold;">Final Score: ${score} / ${questions.length} (${pct}%)</p>
                    <p style="color: #7f8c8d; font-size: 1.2rem; margin-top: 10px;">${pct >= 80 ? 'You are a Clinical Expert!' : 'Review the interactions and try again.'}</p>
                </div>
                <button class="btn btn-restart" style="display: block;" onclick="location.reload()">Restart Exam</button>
            `;
            document.getElementById('p-bar').style.width = '100%';
            return;
        }

        const q = questions[currentQ];
        document.getElementById('q-tracker').innerText = `Question: ${currentQ + 1} / ${questions.length}`;
        document.getElementById('score-tracker').innerText = `Score: ${score}`;
        document.getElementById('p-bar').style.width = `${(currentQ / questions.length) * 100}%`;

        let html = `<div class='question'>${q.q}</div><div class='options'>`;
        q.options.forEach(opt => {
            const safeOpt = opt.replace(/'/g, "\'").replace(/"/g, '&quot;');
            const safeAns = q.ans.replace(/'/g, "\'").replace(/"/g, '&quot;');
            html += `<button class="opt-btn" onclick="checkAnswer('${safeOpt}', '${safeAns}', this)">${opt}</button>`;
        });
        
        html += `</div>

                    <button id="hintBtn" class="btn btn-hint" onclick="showHint()">💡 Show Logic</button>
                    <button id="nextBtn" class="btn btn-next" onclick="nextQuestion()">Next ➡️</button>
                 </div>
                 <div class='hint-box' id='hint'><strong>Clinical Logic:</strong> ${q.hint}</div>`;
        
        qBox.innerHTML = html;
    }

    function checkAnswer(choice, ans, btn) {
        const buttons = document.querySelectorAll('.opt-btn');
        buttons.forEach(b => b.disabled = true);
        
        if (choice === ans) {
            btn.classList.add('correct');
            score++;
            document.getElementById('score-tracker').innerText = `Score: ${score}`;
        } else {
            btn.classList.add('wrong');
            buttons.forEach(b => {
                if (b.innerText === ans) {
                    b.classList.add('correct');
                }
            });
        }
        document.getElementById('nextBtn').style.display = 'block';
        showHint();
    }

    function showHint() { 
        document.getElementById('hint').style.display = 'block'; 
        document.getElementById('hintBtn').disabled = true; 
        document.getElementById('hintBtn').style.opacity = '0.5';
    }
    
    function nextQuestion() { 
        currentQ++; 
        render(); 
    }

    render();
