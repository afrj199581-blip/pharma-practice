<html lang="en">
<head>

    <style>

        body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg); padding: 15px; margin: 0; color: #333; }
        .quiz-container { max-width: 700px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); }
        .header-area { text-align: center; border-bottom: 2px solid #eee; padding-bottom: 15px; margin-bottom: 20px; }
        h1 { color: var(--primary); font-size: 1.6rem; margin: 0 0 10px 0; }
        
        /* Progress Bar */
        .progress-container { width: 100%; background-color: #ddd; border-radius: 8px; margin-bottom: 15px; overflow: hidden; }
        .progress-bar { height: 10px; background-color: var(--secondary); width: 0%; transition: width 0.3s ease; }
        
        .stats { display: flex; justify-content: space-between; font-weight: bold; color: #7f8c8d; font-size: 0.95rem; }
        
        .question { font-size: 1.25rem; margin-bottom: 20px; color: var(--primary); font-weight: 600; line-height: 1.4; }
        .options button { display: block; width: 100%; margin: 10px 0; padding: 15px; border: 2px solid #ecf0f1; border-radius: 8px; cursor: pointer; font-size: 1.05rem; background: #fff; text-align: left; transition: all 0.2s; color: #444; }
        .options button:hover:not(:disabled) { border-color: var(--secondary); background: #f7f9fa; }
        
        .correct { background-color: var(--success) !important; color: white !important; border-color: var(--success) !important; }
        .wrong { background-color: var(--danger) !important; color: white !important; border-color: var(--danger) !important; }
        
        .hint-box { margin-top: 15px; background: #fff3cd; color: #856404; padding: 15px; border-radius: 8px; display: none; font-size: 0.95rem; border-left: 4px solid #ffeeba; }
        
        .controls { display: flex; gap: 10px; margin-top: 20px; }
        .btn { flex: 1; padding: 15px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; color: white; font-size: 1rem; transition: 0.2s; }
        .btn-hint { background: #f39c12; }
        .btn-hint:hover { background: #e67e22; }
        .btn-next { background: var(--secondary); display: none; }
        .btn-next:hover { background: #2980b9; }
        .btn-restart { background: var(--primary); margin-top: 20px; width: 100%; display: none; }

    let currentQ = 0;
    let score = 0;

    function render() {
        const qBox = document.getElementById('q-box');
        
        if (currentQ >= questions.length) {
            const percentage = Math.round((score / questions.length) * 100);
            qBox.innerHTML = `
                <div style="text-align: center; padding: 30px 0;">
                    <h2 style="color: #2c3e50; font-size: 2rem; margin-bottom: 10px;">Quiz Complete!</h2>
                    <p style="font-size: 1.5rem; color: ${percentage >= 70 ? '#2ecc71' : '#e74c3c'}; font-weight: bold;">Final Score: ${score} / ${questions.length} (${percentage}%)</p>
                    <p style="color: #7f8c8d; margin-top: 10px;">Great job tackling the comprehensive clinical review.</p>
                </div>
                <button class="btn btn-restart" style="display: block;" onclick="location.reload()">Start Over</button>
            `;
            document.getElementById('p-bar').style.width = '100%';
            return;
        }

        const q = questions[currentQ];
        document.getElementById('q-tracker').innerText = `Question: ${currentQ + 1} / ${questions.length}`;
        document.getElementById('score-tracker').innerText = `Score: ${score}`;
        document.getElementById('p-bar').style.width = `${(currentQ / questions.length) * 100}%`;

        let html = `<div class='question'>${q.q}</div><div class='options'>`;
        q.options.forEach(opt => {
            // Escape quotes to prevent HTML breaking
            const safeOpt = opt.replace(/'/g, "\'").replace(/"/g, '&quot;');
            const safeAns = q.ans.replace(/'/g, "\'").replace(/"/g, '&quot;');
            html += `<button class="opt-btn" onclick="checkAnswer('${safeOpt}', '${safeAns}', this)">${opt}</button>`;
        });
        
        html += `</div>
                 <div class="controls">
                    <button id="hintBtn" class="btn btn-hint" onclick="showHint()">💡 Clinical Hint</button>
                    <button id="nextBtn" class="btn btn-next" onclick="nextQuestion()">Next Question ➡️</button>
                 </div>
                 <div class='hint-box' id='hint'><strong>Clinical Rationale:</strong> ${q.hint}</div>`;
        
        qBox.innerHTML = html;
    }

    function checkAnswer(choice, ans, btn) {
        const buttons = document.querySelectorAll('.opt-btn');
        buttons.forEach(b => b.disabled = true); // Lock answers
        
        const isCorrect = choice.startsWith(ans);
        
        if (isCorrect) {
            btn.classList.add('correct');
            score++;
            document.getElementById('score-tracker').innerText = `Score: ${score}`;
        } else {
            btn.classList.add('wrong');
            // Highlight the correct answer
            buttons.forEach(b => {
                if (b.innerText.startsWith(ans)) {
                    b.classList.add('correct');
                }
            });
        }
        
        document.getElementById('nextBtn').style.display = 'block';
        showHint(); // Auto-show rationale after answering
    }

    function showHint() { 
        document.getElementById('hint').style.display = 'block'; 
        document.getElementById('hintBtn').disabled = true; 
        document.getElementById('hintBtn').style.opacity = '0.5';
    }
    
    function nextQuestion() { 
        currentQ++; 
        render(); 
    }

    // Initialize
    render();
