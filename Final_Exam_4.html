    const questions = questionsRaw.map(q => {
        return {
            q: q[0],
            options: q[1],
            ans: q[2],
            hint: q[3]
        };
    });

    let currentQ = 0;
    let score = 0;

    function render() {
        const qBox = document.getElementById('q-box');
        if (currentQ >= questions.length) {
            const pct = Math.round((score / questions.length) * 100);
            qBox.innerHTML = `
                <div style="text-align: center; padding: 30px 0;">
                    <h2 style="color: #2c3e50; font-size: 2.2rem; margin-bottom: 10px;">Exam Completed!</h2>
                    <p style="font-size: 1.8rem; color: ${pct >= 80 ? '#27ae60' : '#c0392b'}; font-weight: bold;">Final Score: ${score} / ${questions.length} (${pct}%)</p>
                    <p style="color: #7f8c8d; font-size: 1.2rem; margin-top: 10px;">${pct >= 80 ? 'Outstanding! You have mastered the entire clinical syllabus.' : 'Great effort! Keep reviewing the clinical rationales.'}</p>
                </div>
                <button class="btn btn-restart" style="display: block;" onclick="location.reload()">Restart Exam</button>
            `;
            document.getElementById('p-bar').style.width = '100%';
            return;
        }

        const q = questions[currentQ];
        document.getElementById('q-tracker').innerText = `Question: ${currentQ + 1} / ${questions.length}`;
        document.getElementById('score-tracker').innerText = `Score: ${score}`;
        document.getElementById('p-bar').style.width = `${(currentQ / questions.length) * 100}%`;

        // Shuffle options for better testing
        let shuffledOptions = [...q.options].sort(() => Math.random() - 0.5);

        let html = `<div class='question'>${q.q}</div><div class='options'>`;
        shuffledOptions.forEach(opt => {
            const safeOpt = opt.replace(/'/g, "\'").replace(/"/g, '&quot;');
            const safeAns = q.ans.replace(/'/g, "\'").replace(/"/g, '&quot;');
            html += `<button class="opt-btn" onclick="checkAnswer('${safeOpt}', '${safeAns}', this)">${opt}</button>`;
        });
        
        html += `</div>
                 <div class="controls">
                    <button id="hintBtn" class="btn btn-hint" onclick="showHint()">💡 Show Rationale</button>
                    <button id="nextBtn" class="btn btn-next" onclick="nextQuestion()">Next Question ➡️</button>
                 </div>
                 <div class='hint-box' id='hint'><strong>Clinical Rationale:</strong> ${q.hint}</div>`;
        
        qBox.innerHTML = html;
    }

    function checkAnswer(choice, ans, btn) {
        const buttons = document.querySelectorAll('.opt-btn');
        buttons.forEach(b => b.disabled = true);
        
        if (choice === ans) {
            btn.classList.add('correct');
            score++;
            document.getElementById('score-tracker').innerText = `Score: ${score}`;
        } else {
            btn.classList.add('wrong');
            buttons.forEach(b => {
                if (b.innerText === ans) {
                    b.classList.add('correct');
                }
            });
        }
        document.getElementById('nextBtn').style.display = 'block';
        showHint();
    }

    function showHint() { 
        document.getElementById('hint').style.display = 'block'; 
        document.getElementById('hintBtn').disabled = true; 
        document.getElementById('hintBtn').style.opacity = '0.5';
    }
    
    function nextQuestion() { 
        currentQ++; 
        render(); 
    }

    render();
